<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">一次预订里的六种职责</title><desc id="desc">用预订场景解释六种建模职责；图中分组表示职责配合，不表示固定调用顺序。</desc><rect width="960" height="615" rx="18" fill="#f4f8fc"/><style>text{font-family:system-ui,sans-serif}.title{font-size:28px;font-weight:700;fill:#112a43}.sub{font-size:17px;fill:#526b80}.name{font-size:22px;font-weight:650;fill:#112a43}.detail{font-size:16px;fill:#526b80}</style><text x="36" y="48" class="title">一次预订里的六种职责</text><text x="36" y="80" class="sub">围绕一条业务规则组织模型，而不是围绕数据库表组织类</text><rect x="32" y="110" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="110" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="146" class="name">实体 / 值对象</text><text x="60" y="183" class="detail">预订持续保留身份；运输要求按值比较并可整体替换。</text><text x="60" y="215" class="detail">同样的要求可以用于两笔不同的预订，两笔预订的身份不能合并。</text><rect x="32" y="270" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="270" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="306" class="name">聚合 / 领域服务</text><text x="60" y="343" class="detail">聚合保护局部不变量；领域服务表达跨对象的业务决定。</text><text x="60" y="375" class="detail">“还能否预留”与“如何寻找一条合适路线”需要不同的知识。</text><rect x="32" y="430" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="430" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="466" class="name">工厂 / 仓储</text><text x="60" y="503" class="detail">工厂形成有效的新对象；仓储恢复和保存已有对象。</text><text x="60" y="535" class="detail">创建、重建与提交各有语义，不应由同一个万能 Save 隐藏。</text></svg>
