<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">同一票货物，三个有效模型</title><desc id="desc">同一业务事实在不同边界服务不同目的，集成契约需要明确翻译。</desc><rect width="960" height="615" rx="18" fill="#f4f8fc"/><style>text{font-family:system-ui,sans-serif}.title{font-size:28px;font-weight:700;fill:#112a43}.sub{font-size:17px;fill:#526b80}.name{font-size:22px;font-weight:650;fill:#112a43}.detail{font-size:16px;fill:#526b80}</style><text x="36" y="48" class="title">同一票货物，三个有效模型</text><text x="36" y="80" class="sub">边界依赖语言与责任，不由服务数量决定</text><rect x="32" y="110" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="110" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="146" class="name">订舱上下文</text><text x="60" y="183" class="detail">关心：要求、承诺、行程、截止时间。</text><text x="60" y="215" class="detail">“完成”可能意味着预订已经确认，尚未说明货物已抵达。</text><rect x="32" y="270" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="270" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="306" class="name">运输网络上下文</text><text x="60" y="343" class="detail">关心：节点、边、连通性、运输成本。</text><text x="60" y="375" class="detail">返回可行路径，再由订舱模型判断是否满足对客户的承诺。</text><rect x="32" y="430" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="430" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="466" class="name">履约上下文</text><text x="60" y="503" class="detail">关心：实际装卸、责任移交、异常与签收。</text><text x="60" y="535" class="detail">外部 delivered 若仅指交给末端，不得翻译成收件人签收。</text></svg>
