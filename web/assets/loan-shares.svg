<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">承诺份额，不等于实际贷款份额</title><desc id="desc">用自设数字展示 Facility 和 Loan 的独立变化，不复刻原书饼图。</desc><rect width="960" height="615" rx="18" fill="#f4f8fc"/><style>text{font-family:system-ui,sans-serif}.title{font-size:28px;font-weight:700;fill:#112a43}.sub{font-size:17px;fill:#526b80}.name{font-size:22px;font-weight:650;fill:#112a43}.detail{font-size:16px;fill:#526b80}</style><text x="36" y="48" class="title">承诺份额，不等于实际贷款份额</text><text x="36" y="80" class="sub">金额为便于推演的教学数字，不涉及实际交易</text><rect x="32" y="110" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="110" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="146" class="name">额度承诺：总额 100</text><text x="60" y="183" class="detail">A 承诺 50，B 承诺 30，C 承诺 20。</text><text x="60" y="215" class="detail">首次放款 50 按比例出资：A 25，B 15，C 10。</text><rect x="32" y="270" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="270" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="306" class="name">再次放款：总额 30</text><text x="60" y="343" class="detail">B 不参与，A 出 21，C 出 9。</text><text x="60" y="375" class="detail">当前贷款合计 80：A 46，B 15，C 19；额度承诺比例仍未改变。</text><rect x="32" y="430" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="430" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="466" class="name">分配必须选择正确依据</text><text x="60" y="503" class="detail">本金与利息按当前贷款份额处理；额度费用按相应承诺份额处理。</text><text x="60" y="535" class="detail">把两个比例强制绑定，会导致不断修补的调整记录和舍入问题。</text></svg>
