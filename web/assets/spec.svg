<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">冷链规格：条件组合与使用方式</title><desc id="desc">基于冷链教学案例独立绘制，帮助区分规格判定和执行机制。</desc><rect width="960" height="615" rx="18" fill="#f4f8fc"/><style>text{font-family:system-ui,sans-serif}.title{font-size:28px;font-weight:700;fill:#112a43}.sub{font-size:17px;fill:#526b80}.name{font-size:22px;font-weight:650;fill:#112a43}.detail{font-size:16px;fill:#526b80}</style><text x="36" y="48" class="title">冷链规格：条件组合与使用方式</text><text x="36" y="80" class="sub">相同业务含义，不要求相同执行算法</text><rect x="32" y="110" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="110" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="146" class="name">条件：食品级 AND 制冷能力达标</text><text x="60" y="183" class="detail">每个叶子表达一个可解释的条件，AND 要求两者同时满足。</text><text x="60" y="215" class="detail">未知规则必须明确失败，不能默认视为通过。</text><rect x="32" y="270" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="270" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="306" class="name">校验 / 筛选 / 构造</text><text x="60" y="343" class="detail">校验选中的箱子；筛选候选箱子；安排清洗或预冷得到可用箱子。</text><text x="60" y="375" class="detail">规格表达什么算满足；查询、规划和预约操作各有执行责任。</text><rect x="32" y="430" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="430" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="466" class="name">逻辑与时间</text><text x="60" y="503" class="detail">设备能降到 −18°C，不等于不同货物的温区可以混装。</text><text x="60" y="535" class="detail">剩余规格要扣除已完成的条件，同时补上当前位置与后续约束。</text></svg>
