<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">容量与预订的一致性边界</title><desc id="desc">以海风容量规则讲解聚合与原子提交，不是原书 Car 类图的复刻。</desc><rect width="960" height="615" rx="18" fill="#f4f8fc"/><style>text{font-family:system-ui,sans-serif}.title{font-size:28px;font-weight:700;fill:#112a43}.sub{font-size:17px;fill:#526b80}.name{font-size:22px;font-weight:650;fill:#112a43}.detail{font-size:16px;fill:#526b80}</style><text x="36" y="48" class="title">容量与预订的一致性边界</text><text x="36" y="80" class="sub">总量约束必须在提交时继续成立</text><rect x="32" y="110" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="110" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="146" class="name">共同规则</text><text x="60" y="183" class="detail">0 ≤ reserved ≤ capacity；有效预订合计与 reserved 一致。</text><text x="60" y="215" class="detail">只有单笔预订合法，不代表多笔并发请求合在一起仍合法。</text><rect x="32" y="270" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="270" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="306" class="name">边界内的决定</text><text x="60" y="343" class="detail">预订状态改变与容量占用 / 释放使用同一原子协议。</text><text x="60" y="375" class="detail">取消 R-42 只能释放 R-42 实际占用的数量，重复取消释放量为零。</text><rect x="32" y="430" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="430" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="466" class="name">边界外的协作</text><text x="60" y="503" class="detail">客户身份、付款结果和承运商响应通过明确契约进入。</text><text x="60" y="535" class="detail">外部网络调用不能自动随本地事务回滚，需要自己的恢复协议。</text></svg>
