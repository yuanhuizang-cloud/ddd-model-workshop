<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">货物改变目的地时，哪些东西会变？</title><desc id="desc">用变化场景解释航运模型，避免从外键关系机械推导聚合边界。</desc><rect width="960" height="615" rx="18" fill="#f4f8fc"/><style>text{font-family:system-ui,sans-serif}.title{font-size:28px;font-weight:700;fill:#112a43}.sub{font-size:17px;fill:#526b80}.name{font-size:22px;font-weight:650;fill:#112a43}.detail{font-size:16px;fill:#526b80}</style><text x="36" y="48" class="title">货物改变目的地时，哪些东西会变？</text><text x="36" y="80" class="sub">用“要求、计划、事实”检验对象责任</text><rect x="32" y="110" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="110" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="146" class="name">运输要求：替换为新的目标</text><text x="60" y="183" class="detail">新目的地与客户承诺属于要求，须通过当前业务规则校验。</text><text x="60" y="215" class="detail">改动要求可能使现有计划不再合格。</text><rect x="32" y="270" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="270" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="306" class="name">运输计划：重新评估并选择</text><text x="60" y="343" class="detail">计划描述将怎样履约，可以失效，也可以重新规划。</text><text x="60" y="375" class="detail">计划的变化不能抹去已经发生的装卸。</text><rect x="32" y="430" width="896" height="136" rx="12" fill="white" stroke="#b5cbdc"/><rect x="32" y="430" width="8" height="136" rx="4" fill="#087f8c"/><text x="60" y="466" class="name">处理事实：保存已经发生的事</text><text x="60" y="503" class="detail">保留发生地点、时间、责任与稳定身份。</text><text x="60" y="535" class="detail">是否独立创建和访问，要根据实际用例及一致性需求决定。</text></svg>
