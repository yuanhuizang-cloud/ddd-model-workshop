</style></head><body data-language="go"><a class="skip" href="#main" data-anchor="main">跳到正文</a><header class="topbar"><button class="menu-btn" data-action="menu" aria-label="打开章节目录" aria-expanded="false">☰</button><a class="brand" href="#home"><span class="brandmark">DDD</span>模型<em>工坊</em></a><nav class="top-links" aria-label="主导航"><a href="#home" data-nav="home">阅读目录</a><a href="#lab" data-nav="lab">代码案例</a><a href="#interview" data-nav="interview">面试参考</a><a href="#review" data-nav="review" class="hide-small">阅读记录</a><a href="#sources" data-nav="sources" class="hide-small">参考文献</a></nav></header><aside class="sidebar" aria-label="课程目录"><label class="search-wrap"><span class="small muted">搜索概念、代码与章节</span><input id="search" placeholder="例如：聚合 / 幂等 / 防腐层" type="search" autocomplete="off"></label><div class="progress-line"><span>已读章节</span><span id="progress-text"></span></div><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div><nav id="chapter-nav" aria-label="章节导航"></nav><div class="nav-foot">以 Evans 原书为主线 · 20 个阅读单元<br>自由阅读 · 手动标记已读 · 无需登录<br><a href="#terms">概念索引</a> · <a href="#sources">参考文献</a> · <a href="#review">阅读记录与备份</a></div></aside><main id="main" tabindex="-1"><div id="app" class="content"></div></main><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="image-dialog"><button class="close-dialog" data-action="close-image">关闭大图</button><img id="big-image" alt=""><p id="image-caption" class="small"></p></dialog><input type="file" id="import-file" accept="application/json" hidden><noscript>本课程需要启用 JavaScript 以切换章节和保存已读标记。内容与图片均内嵌，不需要联网。</noscript><script id="course-data" type="application/json">{"lessons":[{"id":"1","n":1,"part":1,"title":"消化知识：模型从争论中长出来","subtitle":"先听懂业务，再决定代码长什么样。","pages":"36–50","tags":["知识消化","领域模型","深层模型"],"body":"\u003csection>\u003ch2>故事：那一票“已经到了”的货\u003c/h2>\u003cp>客服说“货到了”，码头说“还没卸”，财务说“还没结算”。你准备加一个 \u003ccode>status\u003c/code> 字段，却发现三个团队讨论的不是同一件事。问题藏在语言与规则里，增加枚举值并不会让它自动消失。\u003c/p>\u003cp>DDD 的起点是：把业务里影响决策的知识，提炼为团队能讨论、代码能执行的模型。模型是\u003cstrong>为某个目的做出的选择性抽象\u003c/strong>。地铁图不用按真实比例画街道，依旧能帮助换乘；海运模型也不需要复制整个港口。\u003c/p>\u003c/section>\u003csection>\u003ch2>沿着电路板案例，看一次真实的知识消化\u003c/h2>\u003cp class=\"source-note\">原书案例转述：第 1 章，PDF 36–42 页。以下按设计变化整理，不是原对话的逐字翻译。\u003c/p>\u003cp>Evans 开始开发电路板设计工具时，并不懂电子硬件。专家最初描述的解决方案是读文件、排序、加注释、输出报告；这些操作能说清，却未必抓住真正提升生产率的机会。转机来自报表里反复出现的 \u003cstrong>Net\u003c/strong>：它连接元件并传递信号。这是第一个值得研究的概念，而不是第一个应该建表的名词。\u003c/p>\u003cp>最初把元件画成一个个盒子，还不足以解释信号的传播。专家指出：同一种元件可以有多个实例；信号具体到达的是某个实例的某个引脚；一个引脚属于一个元件实例并接入一个网络。于是模型逐渐区分 \u003cstrong>Component Type、Component Instance、Pin、Net\u003c/strong>。每一次拆分都来自原模型回答不了的问题，而不是为了符合预设的对象数量。\u003c/p>\u003cp>团队随后收窄范围，只研究探针模拟。信号穿过网络抵达引脚后，还可能由元件内部传递到其他引脚。这里不必模拟芯片的全部电子行为，只需保存特定输入引脚到输出引脚的传播关系。这个简化足以支持当前任务，却明确舍弃了与任务无关的细节。\u003cstrong>模型有用，往往因为它省略得正确。\u003c/strong>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>从“画得像”转向“算得对”\u003c/h2>\u003cp>这个模拟需要找出可能因路径过长而产生延迟的问题。一次跨越 Net 算一跳，算法把跳数沿传播路径传下去。原来难懂的一团硬件名词，现在能够共同完成一项计算：从某个引脚出发，追踪哪些路径超过了关注的跳数。\u003c/p>\u003cp>另一个细节随之浮现：引脚间的传播关系由元件类型决定，不需要在每个实例上重复维护。相反，实例本身的连接关系不能与类型混为一谈。同样的芯片型号可以连接在不同的位置。这个区分减少重复，也避免改动一个实例时意外改变所有同型号实例。\u003c/p>\u003cdiv class=\"model-strip\">\u003cdiv>\u003cstrong>最初\u003c/strong>\u003cspan>元件与连接的名词\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>发现差异\u003c/strong>\u003cspan>类型、实例、引脚、网络\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>赋予行为\u003c/strong>\u003cspan>传播信号并累计跳数\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>验证目的\u003c/strong>\u003cspan>识别值得检查的长路径\u003c/span>\u003c/div>\u003c/div>\u003cp>专家还提到网络拓扑，但它暂时不参与这项模拟，于是被移出当前模型。不是说拓扑不重要，而是重要性必须相对于具体目的判断。一个囊括所有专业词汇的模型，通常比能解释一项决策的小模型更难使用。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>原型为什么比更多会议更有信息量\u003c/h2>\u003cp>原书中的早期原型没有界面、没有持久化，用简单数据和自动化测试驱动，直接计算路径长度。它仍然是软件，因为关键业务行为已经执行起来。专家看到实际输出，才能发现自己此前描述中的遗漏；开发者看到无法实现的地方，才能修正图上的想当然。\u003c/p>\u003cp>这条反馈链可以迁移到海风订舱：先给三条虚构航次和两种冷链要求，让选择过程明确返回“可行、不可行、原因”。不必先接登录、支付和监控平台。但这个原型的结果只能验证领域假设，不能证明并发安全、吞吐或真实数据质量。\u003cstrong>业务可解释性与生产可运行性是两个需要接续验证的问题。\u003c/strong>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>超订政策：从魔法数字到可讨论的承诺\u003c/h2>\u003cp class=\"source-note\">原书案例转述：PDF 47–49 页；整数示例为教学改编。\u003c/p>\u003cp>原书用允许一定比例超订说明知识如何隐藏在代码里。起初容量乘以 1.1，只是预订函数中的一个判断。提取出 Overbooking Policy 后，团队才有一个明确对象去讨论：为什么允许超订、谁承担风险、政策适用于哪些货物。提取的主要价值是表达政策，不是预言一定会出现十种算法。\u003c/p>\u003cpre>\u003ccode>def allows_booking(capacity, reserved, requested, limit_percent):\n    if capacity &lt; 0 or reserved &lt; 0 or requested &lt;= 0:\n        raise ValueError(\"容量、已预留量或申请量不合法\")\n    if limit_percent &lt; 100:\n        raise ValueError(\"该示例的承诺上限不能低于物理容量\")\n    return (reserved + requested) * 100 &lt;= capacity * limit_percent\u003c/code>\u003c/pre>\u003cp>整数交叉相乘让“承诺量不超过容量的某个比例”更直接，也避免把取整方式悄悄藏进浮点运算。这里仍未处理并发；它只回答某一份快照上的领域问题。实际业务还可能区分物理装载上限与可售承诺上限。二者若被叫成同一个 capacity，代码再严谨也会守错约束。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>更深的模型，可能改变观察业务的角度\u003c/h2>\u003cp>原书 PDF 50 页讲述另一次发现：运输公司关注的不只是货物从哪里移动到哪里，还有各方之间的责任移交。货物留在仓库时，责任和付款条件可能已经变化；货物经历多个物理动作时，某些动作却不影响公司的关键决策。\u003c/p>\u003cp>这个发现没有使行程对象消失，而是让它不再承担解释整个业务的任务。提单、责任主体和释放付款的条件获得了更合适的位置。所谓“深”，是模型更接近重要决策的依据，不是对象更抽象或继承层次更多。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>从现场材料提炼出能够运行的知识\u003c/h2>\u003cp>一次有效的建模讨论可以围绕一张异常运单展开：货物当时在哪里，系统知道什么，负责人根据什么作决定，哪条事实出现后决定会改变。普通案例帮助发现主流程，争议案例更容易暴露隐藏条件。开发者把发现转为最小行为，专家再用反例检验它。\u003c/p>\u003cp>若专家说“通常如此”，不要立即把它写成不可违反的不变量。它可能是经验偏好、当前政策或缺省处理。区分事实、硬约束和可选择政策，才能让模型既坚定地守住承诺，又允许业务有意识地改变做法。理解业务不是在编码前完成的一道工序，而是在实现反馈中持续发生的工作。\u003c/p>\u003c/section>\u003csection>\u003ch2>重点 · Knowledge Crunching 知识消化\u003c/h2>\u003cp>原书第 1 章用电路板设计的讨论说明：开发者不断提出模型，领域专家用真实情形反驳，双方在反馈中发现更有解释力的概念。开发者不是抄需求的书记员，专家也不是一次性交付知识的接口。\u003c/p>\u003cp>有效建模需要五件事互相支撑：模型紧贴实现、围绕模型形成语言、把业务知识放进设计、提炼真正重要的概念、反复试验。一个模型若只在白板上优雅，遇到代码就崩塌，反馈循环就断了。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 把“名词清单”变成“决策模型”\u003c/h2>\u003cp>听到“客户、货物、航次”只能得到名词。继续追问：谁允许改目的地？什么时间之后不允许？已装船但未开航算哪个节点？谁承担费用？规则和例外才决定模型的价值。\u003c/p>\u003cp>可以在会议上用三个真实订单走查：最普通的一票、最近出问题的一票、争议最大的一票。对每票写下“事实—决定—理由—例外”。把无法解释的词保留为问题，别立即发明万能实体。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 一页模型假设\u003c/h2>\u003cp>以舱位预订为例：假设“不允许超订”是本阶段业务政策；不变量是 \u003ccode>reserved ≤ capacity\u003c/code>；变化信号是业务开始接受一定比例的超订。把假设写在测试和决策记录旁。政策变了，模型也应变，不要指责业务破坏设计。\u003c/p>\u003cp>本课程航运系统为教学案例；它借用原书的问题域，不代表真实航运规则。原书后续案例里的政策也不能直接搬成你公司的事实。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 从数据库逆向命名就算 DDD？\u003c/h2>\u003cp>表结构保存了历史实现，未必保存了业务意图。若设计会只讨论“给表加一列还是建关联表”，请退回到一个真实决策。另一端也会失败：三个月建模不交付，专家没有运行反馈，模型逐渐变成猜想。先选择一个高变化、可验证的用例做薄切片。\u003c/p>\u003c/section>","answer":"可追问：到港是船舶靠泊还是货物卸下？以哪个事件为准？转运港是否也算？异常改港由谁批准？规则示例：最终目的港的卸货确认已记录后，普通改目的地命令必须拒绝。若允许人工特批，建模为独立授权流程，并保留审计。","quiz":[{"prompt":"一个模型的首要评价标准是什么？","options":["与真实世界名词一一对应","对目标业务决策有解释力，并能在代码中兑现","类越少越好"],"answer":1,"why":"模型为目的服务。完整复制现实通常只会复制复杂性；简洁也必须保留关键约束。"},{"prompt":"领域专家指出测试里的规则不符合例外，先做什么？","options":["维护架构权威，拒绝变化","让专家直接写代码","用真实案例澄清并修正模型与测试"],"answer":2,"why":"模型是假设，真实业务反馈是修正依据。例外可能暴露一个尚未命名的概念。"}],"diagram":"cycle","quote":["Knowledge crunching is an exploration, and you can’t know where you will end up.","消化知识是一场探索，你无法预先知道最后会抵达哪里。",50],"refs":["meituan17"],"caseTitle":"“到了”不是一个足够精确的状态","caseContext":"客服提出“已到港的货物不能改目的地”。在决定字段和判断条件前，必须先澄清这个规则的含义。"},{"id":"2","n":2,"part":1,"title":"通用语言：让同一个词做同一件事","subtitle":"从“大家都懂”到可以共同检验。","pages":"51–70","tags":["通用语言","Ubiquitous Language","可执行文档"],"body":"\u003csection>\u003ch2>故事：已完成，到底完成了什么？\u003c/h2>\u003cp>产品说订单“完成”，开发把它理解为付款完成，仓库理解为发货完成，用户理解为收货完成。所有人都说对了同一个词，系统却做错了三件事。\u003c/p>\u003cp>通用语言不是把中文翻成英文，也不是一张全公司强制词典。它是某个模型语境内，领域专家和开发者一起使用、不断打磨的语言；讨论、测试、界面和代码尽量保持同义。\u003c/p>\u003c/section>\u003csection>\u003ch2>把一个含糊的状态，拆成能执行的业务句子\u003c/h2>\u003cp class=\"source-note\">本节以海风订舱作教学改编，依据原书第 2 章 PDF 51–70 页关于语言、讨论、文档与模型的论述。\u003c/p>\u003cp>假设销售说“订单已经确认”，客服因此告知客户舱位有保证，运营却认为这只表示需求已录入。这个事故不能通过统一状态码解决：各方对同一句话承担的责任不同。更有用的语言是“申请已收到”“舱位已预留”“运输承诺已形成”。每个表达都应说明什么已经成为事实，而不仅是流程推进了几格。\u003c/p>\u003cp>例如“预留”在这里表示某个数量暂时不再对其他订单销售，且有截止时间；“确认”表示业务承诺形成，可能需要信用审批；“装载”是实际发生的处理事实。三个词的前置条件、失败后果和撤销方式各不相同。若全塞进 confirmed 布尔字段，后续每一个调用方都会自己补一套解释。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>语言必须同时约束名词、动词和判断\u003c/h2>\u003cp>术语表只列“预订 = Booking”还不够。还要说明预订的身份怎么延续、预留失败是否产生预订、确认后能否修改数量，以及取消意味着撤回承诺还是释放资源。动词决定状态转移，判断词决定规则边界，通常比中英文拼写更影响正确性。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>表达\u003c/th>\u003cth>明确语义\u003c/th>\u003cth>容易混淆的另一件事\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>申请已接收\u003c/td>\u003ctd>系统已记录意图，可继续处理\u003c/td>\u003ctd>不保证容量足够\u003c/td>\u003c/tr>\u003ctr>\u003ctd>舱位已预留\u003c/td>\u003ctd>容量承诺进入受保护状态\u003c/td>\u003ctd>不代表货物已装船\u003c/td>\u003c/tr>\u003ctr>\u003ctd>预留已过期\u003c/td>\u003ctd>临时承诺按约定终止\u003c/td>\u003ctd>不等于用户主动取消\u003c/td>\u003c/tr>\u003ctr>\u003ctd>运输已完成\u003c/td>\u003ctd>需按履约语境明确结束条件\u003c/td>\u003ctd>不自动表示账款已结清\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>同一个上下文中，确认的语义应一致；跨上下文时则可能需要不同模型。结算里的“完成”可以表示账款处理完毕，不必迫使它接受运输的定义。通用语言统一的是协作语境里的含义，不是整个企业的字面词汇。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>一次语言变化如何穿过需求、代码和接口\u003c/h2>\u003cp>团队发现“已付款才能确认”只适用于预付客户，企业客户可以使用月结额度。最危险的修补是保留 paid 字段，在企业客户分支里也写成 true。这样每一张报表都会把信用批准当作已收款。更稳妥的变化是引入“付款条件已满足”：现金到账与信用授信成为两种不同的满足方式，实际收款事实仍单独保存。\u003c/p>\u003cp>实现中可能出现 \u003ccode>PaymentTerms\u003c/code> 和 \u003ccode>CreditApproval\u003c/code>，需求描述改为“满足本客户付款条件后可确认”，测试分别说明预付和月结情形，接口返回明确的决定原因。数据库迁移再解决旧字段的兼容问题。先改变概念，再计划命名与数据变更，避免把语义变化伪装成无害重命名。\u003c/p>\u003cpre>\u003ccode># 行为名称必须能读回业务句子。\n# 这里的 terms 是政策结果，不是“是否真的收到现金”。\nif not terms.is_satisfied_by(payment_evidence, credit_approval):\n    raise PaymentTermsNotSatisfied()\nbooking.confirm()\u003c/code>\u003c/pre>\u003cp>外部旧客户端可能继续发送旧字段，此时入口适配器负责解释兼容语义，不能允许含糊字段继续污染新模型。过渡期间要明确哪些旧请求无法可靠翻译，宁可返回可解释错误，也不能悄悄猜测客户意图。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>把模型读出来，听见它卡住的地方\u003c/h2>\u003cp>原书强调用口头场景检验模型。可以沿着一票货物讲：“客服提交改目的地申请；运输要求改变；当前行程不再满足要求；调度选择新行程。”每个动作都有主体与结果。这段话很容易暴露一个问题：改变要求与安排新路线是不是必须同时完成？如果现实里可以等待调度，模型就需要表达待重新规划的状态。\u003c/p>\u003cp>相比之下，“服务更新状态，然后发一个通知给另一个服务”只描述了技术动作，掩盖了业务上究竟发生什么。讨论中频繁出现“那个东西”“特殊处理”“你懂的”，通常意味着关键概念尚未明确。不是所有口头简称都必须成为类，但反复左右决策的词值得认真追踪。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>图、文字与可执行示例各负其责\u003c/h2>\u003cp>一张类图擅长表达货物、要求和行程的关联，却未必说清“已经装船之后改目的地要增加什么费用”。一段文字可以解释政策的原因，却可能遗漏某种组合。一条可执行示例能固定具体行为，却不能独自讲明整个模型的意图。三者互补，不能相互替代。\u003c/p>\u003cp>对于“预留截止时间”这样的边界，一句自然语言最好配一个明确例子：如果政策规定截止时刻不再接受确认，那么 \u003ccode>now == expires_at\u003c/code> 应拒绝。日期、时区和时间来源属于随后必须兑现的实现细节。例子使团队发现分歧，代码让约定可检查；两者都应随政策变化更新。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>维护语言的成本，应小于翻译错误的成本\u003c/h2>\u003cp>不必为每个词建立审批大会。把常用概念放在离代码和业务讨论最近的位置，记录定义、反例与典型行为即可。重构时一起检查公开接口、日志原因、监控口径和客服文案，因为同一个错误词可能在这些地方继续传播。\u003c/p>\u003cp>一个实用的判断是：新成员读一次用例，能否用业务语言解释它为什么接受或拒绝？如果必须翻译三套术语，说明模型还在为团队制造摩擦。语言稳定来自不断共同使用，而不是来自一个再也不能修改的词典。\u003c/p>\u003c/section>\u003csection>\u003ch2>重点 · 大声地建模\u003c/h2>\u003cp>把设计读成一句业务话：“货物 C 被分配到航次 V；若剩余舱位不足则拒绝预订。”如果你只能说“调用 Manager 更新 DTO”，模型还没有表达业务意图。读出来会暴露概念含糊、动作主体不清和不必要的绕行。\u003c/p>\u003cp>领域专家不必懂每个类，但应当能挑战测试里的业务句子。将“有效”改成更具体的 \u003ccode>canChangeDestination\u003c/code> 或“符合本次运输需求”，比共用一个 \u003ccode>isValid\u003c/code> 更容易讨论。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 一词多义何时合理？\u003c/h2>\u003cp>“客户”在销售里有线索等级，在结算里有开票主体，在运输里有收发货角色。同名本身不是错误；错误是忽略语义边界，硬塞进一个巨大的 Customer。第 14 章会用限界上下文管理这件事。\u003c/p>\u003cp>模型语言也需要变更流程：记录旧词、新词、含义变化与代码影响，迁移 API 时保留兼容窗口。统一语言不是只统一拼写，更要统一前置条件和失败含义。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>业务语言\u003c/th>\u003cth>代码 / 测试语言\u003c/th>\u003cth>应追问\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>预留舱位\u003c/td>\u003ctd>ReserveSlots / reserve_slots\u003c/td>\u003ctd>是否有过期时间？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>确认运输计划\u003c/td>\u003ctd>AssignItinerary / assign_itinerary\u003c/td>\u003ctd>确认后能否改派？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>卸货事件\u003c/td>\u003ctd>CargoUnloaded\u003c/td>\u003ctd>事实由谁确认？重复如何识别？\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>原书提醒 · 文档与图不会代替活的模型\u003c/h2>\u003cp>原书讨论了图、书面设计文档、可执行基石和解释性模型。UML 可以说明关系，却难以完整表达业务规则。概念图应少而有目的；测试和实现提供可检验的细节。解释给业务的模型与用于软件实现的模型也不必机械相同。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 名词好看，动作仍是 CRUD\u003c/h2>\u003cp>类名改成 Aggregate，核心用例仍是 \u003ccode>update(status=3)\u003c/code>，行为没有表达业务。优先把高风险状态变化命名为命令：确认、取消、改派；明确谁可以做、什么时候能做、失败意味着什么。\u003c/p>\u003c/section>","answer":"示例：预留=在有效期内暂占舱位；确认=把有效预留转为承诺；取消=终止仍可撤销的预订并释放相关资源。事件使用过去式，如 SlotsReserved。定义属于教学假设，必须再由你的领域专家确认。","quiz":[{"prompt":"通用语言应统一到什么范围？","options":["一个模型及其限界上下文","任何系统使用同一个 Customer","只要求后端类名统一"],"answer":0,"why":"同一个语境中保持一致，不等于强制所有业务视角共用一个模型。"},{"prompt":"最能暴露语言问题的做法是？","options":["增加更多 UML 箭头","用实际案例大声叙述模型行为","把中文名词全部转成英文"],"answer":1,"why":"说出真实行为时，歧义和不合理的职责会自然出现。"}],"diagram":"language","quote":["Recognize that a change in the UBIQUITOUS LANGUAGE is a change to the model.","要认识到，通用语言的变化就是模型的变化。",54],"refs":["fowler"],"caseTitle":"预订、预留、确认和取消","caseContext":"这四个词表面上都像状态更新，实际可能分别代表资源暂占、承诺形成和责任终止。"},{"id":"3","n":3,"part":1,"title":"模型驱动设计：白板必须通向代码","subtitle":"建模的人，也要面对实现的摩擦。","pages":"71–86","tags":["模型驱动设计","Hands-on Modelers","模型与实现"],"body":"\u003csection>\u003ch2>重点 · 一个模型，两种表达\u003c/h2>\u003cp>如果分析模型说“路线满足运输规格”，代码却是五层 switch 加十个布尔字段，两者无法相互解释，模型就没有驱动设计。Model-Driven Design 要求选择一个既能解释领域、又能形成可行实现的模型；模型与代码共同演化。\u003c/p>\u003cp>这不是从 UML 自动生成所有代码。模型有意省略技术细节，代码则负责兑现规则。二者可以粒度不同，但关键概念、行为和约束应该对得上。\u003c/p>\u003c/section>\u003csection>\u003ch2>模型驱动设计不是“先分析，后翻译”\u003c/h2>\u003cp class=\"source-note\">依据原书第 3 章 PDF 71–86 页；路线与代码片段为教学改编。\u003c/p>\u003cp>设想分析阶段画出了“路线满足客户要求”的模型，开发阶段为了省事只保存起点、终点和一个 routes_json 字符串。最初界面能工作，但业务要求避开某港口时，应用服务开始解析 JSON；要求转运间隔时，另一个服务再实现时间校验。白板上的路线只是解释性图画，真正驱动行为的是分散的条件分支。\u003c/p>\u003cp>另一种极端是坚持原图不动，强迫实现承担所有困难。原书要求寻找一个既能解释业务、又能在技术条件下有效实现的模型。业务含义与实现可行性是共同的设计输入；任何一边都不是事后验收对方的部门。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>让一条路线从数据串变成领域值\u003c/h2>\u003cp>先区分“去哪儿”与“怎么去”。运输要求保存起终点、截止时间和必要条件；行程保存有顺序的航段。行程构造时检查相邻航段的空间连续性，规格检查它是否满足某一票货的需求。同一条行程可能满足甲客户却不满足乙客户，因此“是否有效”不能无条件挂在行程上。\u003c/p>\u003cpre>\u003ccode>from dataclasses import dataclass\nfrom datetime import datetime\n\n@dataclass(frozen=True)\nclass Leg:\n    origin: str\n    destination: str\n    departure: datetime\n    arrival: datetime\n\n@dataclass(frozen=True)\nclass Itinerary:\n    legs: tuple[Leg, ...]\n\n    def __post_init__(self):\n        if not self.legs:\n            raise ValueError(\"行程不能为空\")\n        if any(x.arrival &lt; x.departure for x in self.legs):\n            raise ValueError(\"航段到达早于出发\")\n        for before, after in zip(self.legs, self.legs[1:]):\n            if before.destination != after.origin:\n                raise ValueError(\"航段不连续\")\n            if before.arrival &gt; after.departure:\n                raise ValueError(\"衔接时间倒置\")\u003c/code>\u003c/pre>\u003cp>片段只说明不可变值与构造约束，调用方还需保证时间对象可比较，并用运输规格检查港口、截止日期与最短转运时长。把这些职责分开以后，“行程本身结构合法”与“这票货可采用它”成为两个清楚的问题。代码中的区分直接改进了团队的思考。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>模型与实现相互校验的三处接缝\u003c/h2>\u003cp>第一处是创建：能否造出一个模型声称不可能存在的对象？如果可以随意修改公开字段，构造函数中的约束可能形同虚设。第二处是行为：关键业务动作是否有明确入口，还是调用者要按特定顺序拼多个 setter？第三处是恢复：从数据库加载后是否仍有同样的语义，还是 ORM 实体又变回一个无人负责的数据包？\u003c/p>\u003cp>这不意味着所有程序语言都要使用封闭的复杂对象。Go 可以用包控制字段可见性与构造方式；Python 可以用不可变数据和明确模块边界；函数式实现可以让状态转移返回新值。只要非法变化的入口可控制，业务意图可读，数据与行为的组织就可以适应语言特点。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>当模型太慢，应先定位到底慢在哪里\u003c/h2>\u003cp>路线模型可能很适合表达承诺，却不适合直接搜索百万条运输连接。逐一实例化所有航段再组合路线，可能既耗内存又难优化。更好的选择不一定是删除领域模型，而是让搜索内部采用图结构、索引和专用算法，再把候选结果转换为行程，由业务规格确认它是否可接受。\u003c/p>\u003cp>这里出现两种服务于不同目的的表示：一个适合优化计算，一个适合业务承诺。第 14 章会进一步讨论这种模型边界。需要谨慎的是转换处：时区、不可达标记、转运约束与缺省成本若解释错误，搜索速度再快也会生成错误承诺。\u003c/p>\u003cp>性能压力有时会迫使妥协。例如采用缓存的可售量加速展示，但实际预留仍在受保护的提交边界重新检查。把“展示估计”与“确认事实”命名清楚，就能避免把缓存过期问题误当成领域规则失效。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>亲自实现的建模者，关注的是反馈闭环\u003c/h2>\u003cp>Hands-on Modelers 的重点不是职位名称，而是设计知识能否穿过实现反馈。当一个建模决定导致仓储无法高效加载，参与者要能够回到模型层讨论边界；当开发者发现两个看似相同的取消流程其实承担不同责任，也应该能够推动语言改变。\u003c/p>\u003cp>一种有效协作是让领域专家解释最近发生的异常，开发者展示具体状态转移，设计者比较两种模型的后果。每个人不必掌握全部技能，但关键决策不能经过多层交接后失去理由。代码评审也不应只检查命名和复杂度，还要确认行为是否仍表达团队共同接受的模型。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>可追踪的行为，比整齐目录更能证明模型成立\u003c/h2>\u003cp>沿着“改目的地”追踪一次：入口解析意图，应用服务加载货物，货物更新运输要求并标记需要重新规划，仓储提交变化，后续流程安排新路线。若业务不允许某阶段修改，拒绝原因应在模型中可解释，而不是仅由前端按钮灰掉表示。\u003c/p>\u003cp>当批处理、客服入口和开放 API 都需要这个动作时，它们应复用同一业务含义。不同入口可以有不同认证和展示，却不能各自决定“在途”是什么意思。这种复用保护的是规则的一致性，不一定要求所有入口共享同一个大型框架。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 实现困难也是知识\u003c/h2>\u003cp>假设路线用“起点、终点”两个字段表示。业务新增“必须经上海入境”，实现不断加特殊条件。这不是简单缺一个字段，而是“路线是一串连续航段”可能更贴切。实现压力提示我们重新思考概念。\u003c/p>\u003cp>原书讨论开发范式与工具的影响。对象不是唯一有效的实现方式；Go 的值、方法和接口，Python 的数据类与纯函数，都能承载模型。关键是实现能否显式表达业务，不是框架是否自称 DDD。\u003c/p>\u003c/section>\u003csection>\u003ch2>重点 · Hands-on Modelers 亲身参与实现\u003c/h2>\u003cp>只画图不接触代码的“架构组”容易忽略重建对象、事务、性能和语言限制。只写代码不参与模型讨论的开发者容易把含糊需求固化为长期负担。让建模者参与关键用例、测试和实现评审，形成双向反馈。\u003c/p>\u003c/section>\u003cdiv class=\"code-pair\">\u003cdiv data-lang=\"go\">\u003cpre>\u003ccode>type Itinerary struct { legs []Leg }\n// NewItinerary 校验航段首尾相接。\n// Satisfies 用领域语言表达路线与要求的关系。\nfunc (i Itinerary) Satisfies(r RouteSpec) bool {\n    return r.IsSatisfiedBy(i)\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv data-lang=\"python\">\u003cpre>\u003ccode>class Itinerary:\n    # 构造时校验航段连续性；这里只示意接口。\n    def satisfies(self, route_spec):\n        return route_spec.is_satisfied_by(self)\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003csection>\u003ch2>工程落地 · 用行为追踪模型\u003c/h2>\u003cp>选“变更目的地”这一个动作，追踪到 API、应用服务、领域方法、测试、持久化。要求每一层都能解释自己的职责。若关键规则只存在前端表单中，后台批处理就可能绕过它。\u003c/p>\u003cp>优先为行为写例子：给定货物在途、目的地变为东京，原计划不再满足要求，应进入待重新规划状态。不要只测试 setDestination 保存了一个字符串。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 把领域层做成框架展厅\u003c/h2>\u003cp>技术抽象越多不代表模型越好。十个接口之间传同一个贫血对象，而规则仍在 Controller 中，抽象只增加了跳转。先把一条规则放到有意义的业务行为里，再决定是否需要接口隔离。\u003c/p>\u003c/section>","answer":"可提炼 ChangeDestinationPolicy 或货物自己的 changeDestination 行为；把到港事实和授权信息作为明确输入。先用旧规则建立特征测试，再双跑新判断记录差异，确认后逐步迁移入口。不要假设三个布尔值本来就一致。","quiz":[{"prompt":"图与代码不同步时，最合理的处理是？","options":["图只给管理层看即可","只按图改代码，无视可实现性","共同修正模型与实现，使关键含义一致"],"answer":2,"why":"模型与实现是双向关系；任何一端脱离反馈都容易失真。"},{"prompt":"Go 不使用继承，能做 DDD 吗？","options":["不能，必须 Java","能，模型可以由值、行为和接口表达","只能用结构体标签模拟继承"],"answer":1,"why":"DDD 不是特定语言机制。业务概念和不变量是否清晰才是关键。"}],"diagram":"","quote":["Programmers are modelers, whether anyone likes it or not.","无论人们愿不愿意承认，程序员本来就在建模。",86],"refs":["go"],"caseTitle":"三个布尔字段背后的一个决定","caseContext":"can_change、is_arrived、is_locked 散落在三个服务中，调用者很难知道何时允许改变目的地。"},{"id":"4","n":4,"part":2,"title":"隔离领域：谁做决定，谁负责跑腿","subtitle":"分层的价值，是让业务规则有一个家。","pages":"89–101","tags":["分层架构","应用服务","领域服务","Smart UI"],"body":"\u003csection>\u003ch2>故事：改运价为什么要启动 Redis？\u003c/h2>\u003cp>你想验证“冷链货物加价”的规则，却要起 HTTP 服务、数据库、缓存和消息队列。规则与技术纠缠在一起，理解和修改都昂贵。隔离领域让业务规则可以独立讨论、执行和测试。\u003c/p>\u003c/section>\u003csection>\u003ch2>沿着一次预订，看四种职责怎样协作\u003c/h2>\u003cp class=\"source-note\">原书四层职责见第 4 章 PDF 89–96 页；以下请求链路、端口和事务示例为 Go/Python 工程教学补充。\u003c/p>\u003cp>客户请求在航次 V 上预留 3 个舱位。HTTP 入口负责解析整数、识别调用者、返回协议状态；应用服务负责完成“预订”这个用例；航次或相关领域对象决定此刻是否允许预留；存储适配器负责将决定可靠地保存。它们参与同一次请求，却回答不同的问题。\u003c/p>\u003cp>如果把容量判断留在 Controller，下一次后台批量导入就容易绕开它。如果让 Voyage 自己读取请求头，测试容量规则就必须伪造网络上下文。如果 Repository 每保存一个对象便提交一次，用例可能在中途失败后只完成一半。分层真正隔离的是变化原因和业务责任，不是文件夹颜色。\u003c/p>\u003cdiv class=\"model-strip\">\u003cdiv>\u003cstrong>入口\u003c/strong>\u003cspan>理解请求与身份\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>应用\u003c/strong>\u003cspan>协调一个业务用例\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>领域\u003c/strong>\u003cspan>判断与改变业务状态\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>适配器\u003c/strong>\u003cspan>兑现存储和通信协议\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003csection>\u003ch2>应用服务很薄，但不能没有可靠性责任\u003c/h2>\u003cp>“薄”不意味着只有三行代码，也不意味着不需要处理失败。应用服务可以决定事务范围、请求幂等、加载顺序和提交后如何继续；它不应该自行重写容量公式。一个用例既要让业务规则有正确归属，也要让这些规则的结果在并发和故障中成立。\u003c/p>\u003cpre>\u003ccode>def reserve_slots(command, uow_factory):\n    with uow_factory() as uow:\n        receipt = uow.receipts.find(command.request_id)\n        if receipt is not None:\n            return receipt.replay_for(command)\n        voyage = uow.voyages.get(command.voyage_id)\n        voyage.reserve(command.slots)  # 领域判断\n        result = receipt_for(command, voyage)\n        uow.receipts.add(result)\n        uow.commit()  # 版本校验与原子写入由提交协议兑现\n        return result\u003c/code>\u003c/pre>\u003cp>这是职责示意，\u003ccode>receipt_for\u003c/code>、仓储与工作单元的实现未在片段中展开。并发请求可能同时查不到回执，因此提交处仍需唯一约束或等效协议；领域方法在旧快照上成功，也不代表提交时必然成功。薄应用服务并不会自动获得一致性。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>领域判断不应依赖技术偶然性\u003c/h2>\u003cp>“请求里的 slots 必须是整数”属于协议与类型检查；“预留量必须为正”是多个入口都应遵守的业务约束。二者可能都检查正整数，却服务于不同边界：入口提供友好错误，领域对象保护自身不被绕过。适当重复不同职责的检查，比只有入口拥有规则更可靠。\u003c/p>\u003cp>同样，“当前用户能否访问某租户”是入口安全与应用授权问题；“某客户的信用额度是否允许形成新承诺”属于业务资格。规则可能需要结合双方信息，但不要把登录角色直接当作企业信用模型，也不要让拥有对象引用就等于获得操作授权。\u003c/p>\u003cp>时间也是常见依赖。预留是否到期可以把 \u003ccode>now\u003c/code> 作为输入，使边界条件可验证；真实时间从适配器获取。若执行到一半又在不同函数里各读一次时钟，截止时刻附近的结果就可能相互矛盾。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>运行时调用方向，与源码依赖方向可以不同\u003c/h2>\u003cp>应用在运行时确实要调用 SQL 仓储，才能读到航次。采用依赖倒置时，仓储接口由需要它的业务侧定义，SQL 适配器实现接口，程序启动时把两者连接。于是领域代码可以在编译和理解层面不依赖具体数据库，而运行时仍获得持久化能力。\u003c/p>\u003cp>这是现代端口与适配器实践，不宜把它的全部术语当作 Evans 四层的同义词。Go 的小接口通常由使用方根据实际需要定义，Python 可以通过协议或鸭子类型表达端口。接口应暴露“按身份取航次”等语义，而不是把 SQL Session 原样传入领域。对复杂查询，直接构造只读结果也可能更合适，没必要为展示报表加载完整聚合。\u003c/p>\u003cp>过度抽象也会制造新耦合：一个通用 Repository 暴露任意 Filter、排序和事务细节，最终每个业务调用者都要理解持久化实现。是否值得设端口，要看隔离了什么真实变化，而不是接口数量是否达标。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>事务与外部副作用，不能靠分层图许愿\u003c/h2>\u003cp>如果事务未提交就发送“预订成功”邮件，提交失败后客户会收到虚假承诺；如果提交后才发送，发送失败又需要恢复。网络调用不能因为写在应用层里就自动加入本地数据库事务。常见做法是在同一事务保存业务事实和待发通知意图，提交后由可重试流程处理，详见一致性专题。\u003c/p>\u003cp>这也解释了为什么领域事件不应偷偷调用邮件客户端。领域对象可以记录“发生了什么”，应用和基础设施决定怎样可靠地传播。对于无法撤销的外部副作用，要显式设计请求身份、回执、重复处理和人工恢复路径，而不是只添加一个 catch。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>Smart UI 的判断依据，是业务复杂度与演化压力\u003c/h2>\u003cp>原书 PDF 97–99 页承认 Smart UI 的适用性。一个短期管理页面只录入港口名称、代码和备注，直接组织界面与数据库操作可能足够。如果为了三个字段创建聚合、领域事件、工厂和一整套端口，理解成本可能高于业务价值。\u003c/p>\u003cp>但当录入演变为“港口停用不得影响在途合同”“多入口共享准入规则”“变更必须保留生效时间”，原有写法就会把规则散落到不同表单中。这是逐步隔离领域的信号。迁移时可先抽出一个高风险动作，让现有入口调用它；不必等待整个系统重新分层才获得收益。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>原书四层\u003c/th>\u003cth>职责\u003c/th>\u003cth>航运例子\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>用户界面 / 表示\u003c/td>\u003ctd>展示信息、解析请求、交互\u003c/td>\u003ctd>HTTP JSON → BookCommand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>应用\u003c/td>\u003ctd>编排用例、协调事务和权限流程\u003c/td>\u003ctd>加载航次 → 预留 → 提交\u003c/td>\u003c/tr>\u003ctr>\u003ctd>领域\u003c/td>\u003ctd>业务状态、规则、决策\u003c/td>\u003ctd>航次不能超出容量\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基础设施\u003c/td>\u003ctd>通用技术能力与外部系统接入\u003c/td>\u003ctd>SQL、消息发送、时钟适配器\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>深挖 · 应用服务与领域服务\u003c/h2>\u003cp>应用服务像调度员：“先查航次，再预留，再保存”。它知道要调用谁，不应独占“不允许超订”的判断。领域服务承载无法自然归属于某个实体或值对象的领域操作，例如在多个候选路线中按业务政策选择方案。\u003c/p>\u003cp>领域服务不是一个容纳所有逻辑的 Service 类。若金额加法属于 Money、预留属于 Voyage，把这些行为移出实体会丢掉规则的自然归属。领域服务通常无持久状态，但可以通过明确端口获取必要信息；涉及 I/O 时必须意识到一致性和测试成本。\u003c/p>\u003c/section>\u003csection>\u003ch2>现代补充 · 依赖倒置与六边形\u003c/h2>\u003cp>本课程把仓储端口放在业务侧，让 SQL 适配器实现它；运行时应用仍调用适配器，源码依赖朝向业务。六边形、整洁架构是可借鉴的组织方法，不能把它们的全部术语归入本书原有四层。\u003c/p>\u003cp>认证、输入类型检查、租户访问控制、业务资格校验需要明确分工。例如“身份证号格式合法”不同于“该客户允许赊账”。安全入口不能依赖前端；业务约束也不能只写在请求校验器中。\u003c/p>\u003c/section>\u003csection>\u003ch2>原书的克制 · Smart UI\u003c/h2>\u003cp>本章没有宣称所有软件都要复杂领域层。业务简单、生命周期短、团队条件有限时，界面与数据操作紧密结合的 Smart UI 有适用空间。代价是复杂业务增长后可维护性与复用性受限。\u003c/p>\u003cp>选型时问：规则是否变化频繁？相同规则是否跨入口？错误代价是否高？业务是否存在难以统一的概念？一个只录入港口名称的后台未必值得四层完整铺开。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 目录分了，职责没分\u003c/h2>\u003cp>\u003ccode>domain/service\u003c/code> 里写 SQL，\u003ccode>controller\u003c/code> 里判断退款上限，换个文件夹不会隔离领域。测试一个领域规则时，如果仍必须启动网络，先找出不必要的技术依赖。\u003c/p>\u003c/section>","answer":"表示层解析；应用入口执行访问控制并编排加载与提交；聚合保证容量规则；基础设施完成数据存储。普通通知失败不应取消已经成功的预订，采用待发送记录和重试。若通知本身构成法律或业务承诺，需要重新定义业务流程，而非随意吞错。","quiz":[{"prompt":"应用服务最应负责哪一项？","options":["决定 Money 如何比较币种","协调仓储、领域行为和事务","实现所有 SQL 方言"],"answer":1,"why":"应用服务协调用例，领域对象或服务负责业务决策，基础设施处理技术细节。"},{"prompt":"简单字典维护后台必须完整 DDD 吗？","options":["必须，否则不专业","可以按复杂度选择更简单方案","必须先拆成微服务"],"answer":1,"why":"原书也讨论 Smart UI 的适用性。设计成本要有业务收益。"}],"diagram":"layers","refs":["cosmic","meituan17"],"caseTitle":"一次预订请求中的职责","caseContext":"从 HTTP 请求到容量判断、事务提交和通知发送，这些操作需要协作，却不属于同一种职责。"},{"id":"5","n":5,"part":2,"title":"实体、值对象与服务：别让 ID 替你思考","subtitle":"身份、值与行为，是三种不同的问题。","pages":"102–142","tags":["实体","值对象","领域服务","模块","关联"],"body":"\u003csection>\u003ch2>重点 · Entity 实体看连续身份\u003c/h2>\u003cp>一票货物换了目的地，仍然是同一票货物；这是实体。身份的意义来自业务连续性，不是因为数据库刚好有自增主键。选稳定标识，避免用会变化的邮箱、名称或船期组合当永久身份。\u003c/p>\u003cp>身份策略还要回答跨系统去重、重建和合并。两个系统产生相同文本 ID 不表示同一实体；必要时使用“来源系统 + 外部 ID”，通过显式映射联系。\u003c/p>\u003c/section>\u003csection>\u003ch2>从一张“什么都有关联”的图开始\u003c/h2>\u003cp>刚开始画模型，很容易把客户、货物、合同、港口、航次都连起来：客户有货物，货物属于客户，港口有航次，航次经过港口。图很热闹，却没有告诉程序员该加载多少对象、谁负责维护关系、修改时会牵动谁。原书第 5 章的起点正是关联，而不是先给每个对象贴 Entity 或 Value Object 标签。\u003c/p>\u003cp>关联要为业务问题服务。客服从运单找到收货人很常见，却未必需要每次加载客户就带出其十年的全部运单。可以保留 Cargo → Customer 的方向，把“按客户查货物”交给查询。数据库中仍然能够连接两张表，但对象模型不必维持两个随时同步的大集合。\u003c/p>\u003cp>第二个办法是加限定条件。原书用“国家在某一年对应哪位总统”说明：一个时间条件，把模糊的一对多关系收窄为有意义的选择。航运中“客户与货物有关”也太宽泛；改成“这票货物的付款方是谁”，角色限定了关系，代码可以用 \u003ccode>customerFor(Payer)\u003c/code> 表达它。第三个办法最直接：业务根本不需要的关联就不建。少一条线，通常也少一份加载、同步和推理负担。\u003cspan class=\"small muted\">（原书转述，PDF 103–108 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>实体身份：追踪的是同一件事，不是同一份数据\u003c/h2>\u003cp>两票货物的重量、起点、终点甚至客户都相同，仍可能是两笔独立委托；一票货物改了目的地，也不会因此变成另一票货物。这两个方向共同定义了身份：属性相同不保证相同，属性改变也不必失去连续性。原书用同名者被误认的经历提醒读者，误判身份会直接污染业务记录。\u003c/p>\u003cp>落到工程上，要区分进程对象、数据库行和领域实体。两个请求各加载一个 Cargo 实例，它们在内存里是两个对象，却可能代表同一实体；数据库把历史版本拆成多行，也不意味着存在多票货物。主键能够定位记录，业务身份则解释记录代表谁。\u003c/p>\u003cp>外部系统的 \u003ccode>123\u003c/code> 和本地系统的 \u003ccode>123\u003c/code> 不能因为字符串一样就合并。常见方案是把来源与外部标识一起保存，再维护显式映射。客户合并也不是简单更新一个 ID：已有合同、债权、隐私授权与历史责任是否可以合并，必须由业务规则决定。UUID 可以降低编号冲突，不能替你判断两个人是不是同一个客户。\u003cspan class=\"small muted\">（原书身份原则，PDF 109–117 页；跨系统方案为工程推演）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>值对象的收益，是让非法组合没有藏身之处\u003c/h2>\u003cp>如果价格只用两个独立参数 \u003ccode>amount\u003c/code> 和 \u003ccode>currency\u003c/code> 传来传去，调用者很容易把人民币金额与美元币种拼到一起。Money 把它们收拢为一个完整概念，并规定加法的合法范围。TimeRange 可以保证开始早于结束；Weight 可以显式携带单位；DeliveryRequirement 可以把目的地和期限作为同一份承诺讨论。\u003c/p>\u003cp>值对象不要求“简单”。路线可以引用多个有身份的港口，同时自身仍只关心经过的顺序和值。判断标准是：业务是否需要识别“原来那一份路线”，还是同样的路线可以互换。为值对象建立数据库 ID 可能只是存储技术选择，不能据此自动改变领域语义。\u003c/p>\u003cp>假设两张订单共享一份地址值。用户修改第一张订单的送货地址，应当为它替换一个新值，而不是原地修改共享地址，让另一张订单也悄悄搬家。共享不可变值通常安全；共享可变对象则要求所有使用者理解别名关系，成本会迅速扩散。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>不可变是行为约束，不是一行注解\u003c/h2>\u003cp>Python 的冻结 dataclass 只阻止直接改字段；字段里若放了 list，仍可追加元素。Go 返回结构体副本时，slice 的底层数组和 map 也可能共享。下面的教学节选让路线持有不可变航段，再在边界复制容器；重点是防止调用者绕过规则改内部状态，而不是追求某种语法。\u003c/p>\u003c/section>\u003cpre>\u003ccode>// Go：Leg 仅含字符串等值成员；不含 map、slice 或可变指针。\ntype Leg struct { From, To string }\ntype Itinerary struct { legs []Leg }\nfunc NewItinerary(legs []Leg) Itinerary {\n    return Itinerary{legs: append([]Leg(nil), legs...)}\n}\nfunc (i Itinerary) Legs() []Leg {\n    return append([]Leg(nil), i.legs...)\n}\n// 路线连通、时间先后等业务校验仍须由构造入口实现。\u003c/code>\u003c/pre>\u003csection>\u003ch2>同一个“地址”，为什么有时是实体？\u003c/h2>\u003cp>订单上的收货地址通常是当时交付承诺的一部分，按值保存更容易还原历史。城市管理系统却要追踪同一地块多年间的门牌变化；供电系统还要区分一个物理供电点与住户填写的地址文本。这里需要连续身份，可以建成 Premise 或 ServicePoint 实体，把 Address 保留为它的描述。\u003c/p>\u003cp>这并不矛盾：模型服务于用途。把现实世界的所有“地址”统一成一个拥有几十个字段的共享实体，反而可能让订单被迫理解地块测绘，让城市管理依赖用户通讯录。分类不是词典查词，而是对业务问题的回答。\u003cspan class=\"small muted\">（原书地址与路线讨论，PDF 118–120 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>领域服务：行为没有自然归宿时，给它一个诚实的名字\u003c/h2>\u003cp>账户能判断自己的余额是否低于阈值，这个判断自然属于账户。把它搬到 AccountManager 只会让实体逐渐变成数据袋。跨两个账户的转账规则，则可能需要一个领域服务表达资金转移、货币兼容性和资格限制；硬塞进其中一个账户会让它承担对方及整个交易的知识。\u003c/p>\u003cp>同一次请求里，应用服务负责组织“识别请求、加载对象、调用规则、提交”；领域服务表达业务决定；邮件适配器负责把通知发出去。三者都可能叫 service，但不能因为后缀相同就混为一层。尤其要小心 \u003ccode>CheckAndSaveAndNotify\u003c/code>：它把业务决定、事务和外部副作用捆在一起，让单独理解规则变得困难。\u003c/p>\u003cp>领域服务可以不保留自己的业务状态，却读取实体或接收外部事实。“无状态”不等于每个结果永远相同，也不意味着可以忽略数据版本。报价依赖某版合同与费率时，应让这些依据显式进入决策，并在真正接受报价时处理过期问题。\u003cspan class=\"small muted\">（服务边界见 PDF 125–130 页；版本例子为工程推演）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>模块应该讲出业务故事\u003c/h2>\u003cp>如果目录只有 entity、valueobject、service、repository，想理解一次订舱就必须横跨所有目录；而两个完全不同业务的实体却被迫挤在一起。原书把模块看成模型的一部分：模块名应当帮助团队讨论职责，例如 booking 表达委托与承诺，handling 表达处理事实，billing 表达计费与应收。\u003c/p>\u003cp>模块内部仍可以按技术需要分文件，但第一层边界最好能解释知识为什么聚在这里。一次计价政策变化若总同时改动三个模块，可能意味着边界没有沿概念划开；如果所有模块都引用 common 中不断膨胀的 Customer，也要检查是不是不同语境被强行统一。模块优化理解与依赖，不自动要求独立部署。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>从数据库回看模型：允许映射差异，守住语义差异\u003c/h2>\u003cp>领域对象可能跨多张表，一个值对象也可能只映射为同一表的几列。ORM 的能力影响实现成本，却不应成为业务概念的唯一来源。保留单向对象关联、使用显式查询获取另一方向，往往比暴露全量双向集合更清楚。\u003c/p>\u003cp>对一票货物进行“修改收货地址”时，身份连续性由 Cargo 维持，地址整体替换，修改权限与时机由领域行为判断，存储适配器负责写入对应列。沿着这个小用例，实体、值、服务、关联、模块和映射形成一条可解释的链；每种模式只承担它解决的那部分问题。\u003c/p>\u003c/section>\u003csection>\u003ch2>重点 · Value Object 值对象看含义\u003c/h2>\u003cp>两个“100 CNY”在付款计算中可视为等值；不需要关心哪一个先创建。值对象按相关属性比较，通常设计为不可变，变化时创建新值。地址可在一个语境中是值，在需要追踪地块历史的语境中是实体。\u003c/p>\u003cp>值对象不能只是包装器。Money 拒绝不同币种直接相加，重量区分 kg 与 lb，时间段校验起止顺序。这样规则不再到处复制。金额使用整数最小单位或十进制定点，并明确币种精度与舍入策略；示例用“分”只为说明 CNY。\u003c/p>\u003c/section>\u003cdiv class=\"code-pair\">\u003cdiv data-lang=\"go\">\u003cpre>\u003ccode>type Money struct { cents int64; currency string }\nfunc (m Money) Add(n Money) (Money, error) {\n    if m.currency != n.currency {\n        return Money{}, errors.New(&quot;currency mismatch&quot;)\n    }\n    // 教学节选：生产还须检查整数溢出与币种规则。\n    return Money{m.cents+n.cents, m.currency}, nil\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv data-lang=\"python\">\u003cpre>\u003ccode>@dataclass(frozen=True)\nclass Money:\n    cents: int\n    currency: str\n    def add(self, other):\n        if self.currency != other.currency:\n            raise ValueError(&quot;currency mismatch&quot;)\n        return Money(self.cents + other.cents, self.currency)\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003csection>\u003ch2>重点 · Service 与 Module\u003c/h2>\u003cp>将运输报价策略放进领域服务是一个候选方案，因为报价可能涉及路线、客户协议与货物特性。服务名称应来自领域动作；避免“所有东西都归 DomainService”。\u003c/p>\u003cp>Module 按有凝聚力的领域概念组织知识，例如 routing、booking、handling；不要永远只按 entity/service/repository 分类到巨大的全局包。模块边界帮助人理解业务，但不是微服务边界的自动证明。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 关联也要花成本\u003c/h2>\u003cp>数据库能关联不代表对象就必须双向持有引用。问清业务需要哪一个遍历方向，能否用标识查找，能否收窄为某个时段或角色。每个双向关联都增加同步、加载和一致性负担。\u003c/p>\u003cp>Go 返回包含 slice/map 的结构体只是浅拷贝，Python frozen dataclass 也不让内部 list 自动不可变。值语义需要不可变成员、防御性复制或受控访问。不能只靠语法标签保证封装。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · ORM 行就是领域实体？\u003c/h2>\u003cp>表里每行都有 ID，但不是每行都需要领域身份；反之一个领域实体可能跨多张表存储。以“是否追踪同一事物随时间变化”判断实体，以“是否只关心描述和值”判断值对象，再选择映射方案。\u003c/p>\u003c/section>","answer":"运单通常是实体；报价金额通常是值对象；计费策略可为 Policy/领域服务；航段在运输计划中可为值。收件地址通常是值，但地址登记与产权管理可能需要独立身份。答案依赖语境，能解释判断比贴标签更重要。","quiz":[{"prompt":"两个地址字段相同就一定是同一实体吗？","options":["是，字段相同就是同一对象","不是，需看身份与业务语境","取决于用了哪个 ORM"],"answer":1,"why":"属性相等和值对象等价相关；实体同一性由业务身份决定。"},{"prompt":"frozen dataclass 内含 list，是否绝对不可变？","options":["是","否，内部列表仍可能被修改","仅 Python 3.11 不可变"],"answer":1,"why":"冻结通常限制属性重新赋值，不会递归冻结所有内部对象。"}],"diagram":"objects","refs":["go"],"image":"blocks","caseTitle":"一个对象的分类会随语境变化","caseContext":"收件地址、运单、航段、报价金额和计费策略，各自需要的身份、行为与生命周期不同。"},{"id":"6","n":6,"part":2,"title":"聚合、工厂与仓储：把不变量守住","subtitle":"最重要的一章：对象边界最终要经得住事务检验。","pages":"143–183","tags":["聚合","聚合根","不变量","工厂","仓储","乐观锁"],"body":"\u003csection>\u003ch2>重点 · Aggregate 是一致性边界\u003c/h2>\u003cp>聚合是一组作为一致性单元管理的领域对象；聚合根控制外部访问与生命周期。划分起点是“哪些规则必须在一次提交后成立”，不是“哪些表能 JOIN”。外部通常通过根访问聚合内部，内部对象局部身份可以只在聚合中有效。\u003c/p>\u003cp>示例：航次容量 10，当前预留 4，两个请求各预留 4。两个内存快照都判断通过，最后数据库可能丢失更新或记录超额预订。\u003cstrong>领域方法判断规则，事务与并发控制保障判断依据仍有效。\u003c/strong>二者缺一不可。\u003c/p>\u003c/section>\u003csection>\u003ch2>采购订单：两次合法修改为什么合成一次违规？\u003c/h2>\u003cp>原书用采购订单讨论聚合：订单有审批上限，行项目引用目录中的零件。以下数字是教学改编。订单上限 1,000 元，当前合计 600 元。甲给第一行增加 300 元，乙给第二行增加 300 元。两人都从 600 元的快照出发，都得到“900 元，未超限”。若数据库只分别锁住被修改的行，两次提交都能成功，最终合计却成了 1,200 元。\u003c/p>\u003cp>这里没有一个行项目单独犯错，错的是它们共同约束的订单。只给 LineItem 加校验不够，因为规则跨越多行。即使每行拥有 version，只要甲、乙更新的不是同一行，两人的版本检查仍可能同时通过。\u003c/p>\u003cdiv class=\"model-strip\">\u003cspan>共同规则：订单合计 ≤ 审批上限\u003c/span>\u003cspan>边界内：PurchaseOrder + LineItems\u003c/span>\u003cspan>边界外：目录 Part\u003c/span>\u003c/div>\u003cp>聚合把这条共同规则的责任落实到 PurchaseOrder。增加数量、改变成交价、删除行都必须经过根，不能让应用绕过根直接保存内部行。它保护的是提交时的有效整体，而不是把数据库有关联的表全部圈在一起。\u003cspan class=\"small muted\">（原书案例，PDF 150–155 页；金额为教学改编）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>把目录也锁住，为什么仍不是好答案？\u003c/h2>\u003cp>第一反应可能是：订单行价格来自目录，干脆把订单、所有行、所有目录零件都锁住。这样每次改价、下单都彼此阻塞；不同请求以不同顺序访问多个零件，还可能形成死锁。技术上把锁加得更大，并没有解释价格究竟应该遵循什么业务语义。\u003c/p>\u003cp>原书随后引入关键知识：目录价格的变化，不一定追溯修改已经形成的订单。已交付订单当然应保留当时成交价格；未完成订单何时重新议价，需要具体政策。因此 LineItem 保存成交价快照并引用 Part，目录价不再是一个必须始终同步的“实时视图”。订单内的审批不变量变得可局部保障，目录也摆脱了无意义的高争用。\u003c/p>\u003cp>如果业务要求未确认订单重新检查新价格，可以形成“待重新确认”的流程，而不是假装全公司价格在任何时刻都原子同步。这里最有效的优化来自领域理解：先分清承诺与参考信息，再选择锁与事务。\u003cspan class=\"small muted\">（PDF 153–155 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>聚合根是规则入口，也需要提交协议配合\u003c/h2>\u003cp>领域代码可以保证一次方法调用后，对象在当前快照上满足规则。它无法凭空知道另一进程刚提交了什么。持久化适配器必须把读取依据和写入建立联系，例如所有修改订单行的路径都竞争同一个订单版本，或者在同一事务中锁住根并读取相关状态。\u003c/p>\u003cp>下面是乐观锁的核心，而非完整仓储。即使没有直接改订单头字段，只改行项目，也必须推进根版本。否则跨行约束仍缺少共同的竞争点。成功获得根版本后，写行项目与版本推进要在同一事务中；任一步失败都回滚。\u003c/p>\u003c/section>\u003cpre>\u003ccode>-- 参数化执行；与行项目写入处于同一数据库事务。\nUPDATE purchase_order\nSET version = version + 1\nWHERE id = :order_id AND version = :loaded_version;\n-- 影响行数必须为 1。若为 0：回滚、重读、重新判断规则。\n-- 不要把新版本号贴到旧计算结果上直接重试。\u003c/code>\u003c/pre>\u003csection>\u003ch2>不变量、约束、流程政策不能全部叫“一致性”\u003c/h2>\u003cp>“订单总额不超过审批额度”要求一次有效提交就成立；“报表中的昨日总额已经更新”可以由读模型稍后反映；“订单确认后应发送通知”通常是跨系统的后续工作。这三种要求若一律强制立即完成，会把通知供应商的可用性也绑到订单事务上。\u003c/p>\u003cp>相反，不能因为使用消息队列，就把真正不可违反的约束降格成“最终修好”。若售票业务承诺绝不超卖，需要原子资源扣减、明确配额所有权或其他可证明的协议。先问失败时允许看到什么中间状态，谁有权纠正，是否需要用户重新确认，再讨论拆聚合。\u003c/p>\u003cp>根也不一定要永久加载所有历史。若某条规则只依赖“当前已承诺量”，可以在明确维护协议下持有汇总；但这种汇总是规则所依赖的状态，不是随意缓存。多个写入路径必须共同维护它，重建和校验流程也要明确。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>工厂的位置，取决于谁知道创建规则\u003c/h2>\u003cp>简单对象用构造函数即可。对象必须成套生成、内部结构复杂，或调用者不应该知道具体子类型时，工厂才开始发挥价值。订单新增行项目通常由订单根创建，因为它知道局部编号、审批规则和生命周期归属；外部不应先造一条任意行，再直接塞进内部集合。\u003c/p>\u003cp>另一种情况是账户生成交易指令。交易指令以后独立执行，不必与账户属于同一聚合，但账户掌握授权和身份等生成依据，仍可能适合作为工厂方法的宿主。若没有自然宿主，再使用独立工厂。原书强调的是创建责任与产品的概念关系，不是所有类型都配一套 Factory 接口。\u003c/p>\u003cp>工厂返回时应满足创建所需的不变量。规则可以委托给产品自身验证，避免工厂和领域方法各维护一份不同逻辑。可选信息稍后补充，不意味着必须先返回一个随时能被业务误用的“半成品”；若业务确实存在草稿，就把 Draft 作为明确状态。\u003cspan class=\"small muted\">（PDF 156–165 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>创建与重建：旧对象不能再出生一次\u003c/h2>\u003cp>新建订单通常分配身份、设置初始状态，也可能形成“已创建”的领域事实。仓储从持久化数据重建对象则保留原身份、版本、成交价和历史，不应重新执行一次新建优惠，也不能再次发创建通知。把反序列化直接接到新建入口，是重复副作用的常见来源。\u003c/p>\u003cp>如果新规则要求地址完整，而五年前的历史订单缺少某字段，重建时既不能静默补一个虚构地址，也不能假装历史不存在。可以隔离为不可继续修改的历史记录、使用兼容版本、进入数据修复流程，或在明确授权下迁移。选择取决于业务必须保留的事实和可操作性。\u003c/p>\u003cp>这解释了为什么“所有对象从构造函数出来必须符合今天全部新建规则”并不总是可行。需要区分永恒的数据完整性要求、按当时规则成立的历史事实，以及今天新增交易的前置条件。重建接口不应暴露为任意用户可以绕过校验的后门。\u003cspan class=\"small muted\">（PDF 165–166 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>仓储的承诺：找回整体，隐藏机制，暴露必要成本\u003c/h2>\u003cp>\u003ccode>orders.get(id)\u003c/code> 表达寻找一个订单；它不必暴露 JOIN、映射和缓存，却应有清楚的“不存在”“版本冲突”“不可用”等结果。一个订单行没有独立业务入口，就不需要面向应用公开 LineItemRepository。聚合根是仓储候选，仍要看用例是否真的需要直接寻找它。\u003c/p>\u003cp>仓储也不是“任何查询都必须返回完整对象”。原书明确容许汇总查询，并讲过把整座工厂数据库加载进内存后再统计导致耗尽内存的事故。订单数量、分页列表、跨聚合报表可以走专门查询，避免为了维护抽象而做灾难性的物化。调用代码无需依赖 SQL，但开发者必须知道分页、索引、批量和懒加载的后果。\u003c/p>\u003cp>仓储通常不在每次 save 后自行提交。一次用例可能还要同时保存命令回执和待发记录；提前 commit 会产生半完成。应用层或 Unit of Work 协调事务，仓储负责参与其中。内存替身也必须符合隔离约定：若 get 返回可随意修改的共享指针，尚未调用 save 就已改变存储，“测试通过”可能只是测试替身把错误藏起来。\u003cspan class=\"small muted\">（PDF 169–177 页；Unit of Work 组织方式为工程补充）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>边界太大或太小，都能从运行症状看出来\u003c/h2>\u003cp>边界过小，常见症状是一次业务动作必须手工协调很多对象、到处补偿本应立即成立的约束、多个接口能绕过共同规则。边界过大，则表现为无关动作频繁版本冲突、每次加载巨大集合、热点根串行化所有流量。两边都不能仅凭类图解决。\u003c/p>\u003cp>对高热航次，先测清争用来源：是同一资源真实竞争，还是把查询、历史和配置也绑进同一根造成假竞争。配额拆分、排队或分区能改变竞争结构，但同时改变资源归属与可用性语义，需要说明额度如何回收、失败如何恢复。聚合设计最终是一份业务保证与并发成本之间的契约。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 什么是真正的不变量？\u003c/h2>\u003cp>“已预留舱位不超过容量”要求强一致；“推荐页上的剩余舱位数字实时准确”可能允许延迟。不要为了所有页面都实时把整个平台装进一个聚合。先分清必须同时成立的约束、可滞后的投影和跨边界流程。\u003c/p>\u003cp>我们用 Voyage 守容量，教学实现只保存容量和预留总数。一旦支持单票取消、过期和审计，就需要预订身份及生命周期；不能只做总数减法。高热航次还可能成为并发热点，需要预约配额、分区或队列化等替代设计，但这些会改变一致性和运营语义。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方案\u003c/th>\u003cth>保证 / 成本\u003c/th>\u003cth>使用前要回答\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>乐观锁 version\u003c/td>\u003ctd>旧版本提交失败；高冲突时重试增多\u003c/td>\u003ctd>冲突后能否安全重新决策？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>悲观锁 / 条件更新\u003c/td>\u003ctd>锁或数据库谓词保护资源；可能等待\u003c/td>\u003ctd>锁顺序、超时、热点如何处理？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>扩大聚合\u003c/td>\u003ctd>规则容易原子保护；加载与争抢增加\u003c/td>\u003ctd>这些对象真的必须共同变更吗？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>跨聚合异步协作\u003c/td>\u003ctd>松耦合；引入中间状态与补偿\u003c/td>\u003ctd>用户看到什么？失败由谁处理？\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>重点 · Factory 工厂负责完整出生\u003c/h2>\u003cp>复杂对象的创建可能需要组合部件并验证不变量。工厂把创建细节藏起来，返回可用且有效的聚合；简单创建用构造函数就够。工厂不等于 Spring Bean 或依赖注入容器。\u003c/p>\u003cp>重建历史对象与创建新对象不是一回事。从数据库恢复时应保留身份和历史事实，不能再发一次“新建成功”事件。新规则与历史数据冲突时要制定迁移或兼容策略，不可悄悄把旧记录重新解释成新业务事实。\u003c/p>\u003c/section>\u003csection>\u003ch2>重点 · Repository 仓储像有业务语义的集合\u003c/h2>\u003cp>仓储提供“按身份寻找、保存聚合”等访问方式，将存储细节与领域行为隔开。通常以聚合根为入口，而非每张表一个仓储。工厂负责生成对象，仓储负责获取已有对象，仓储内部可以使用工厂完成重建。\u003c/p>\u003cp>原书并未要求开发者无视查询性能。报表汇总、分页、关联查询可能走专门读模型；不必加载完整聚合图再计算一个数量。仓储通常不各自任意 commit，事务范围应由用例协调，否则多个保存之间会出现半完成。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程推演 · 乐观锁到底检查什么？\u003c/h2>\u003cp>加载 \u003ccode>version=7\u003c/code>，在副本上执行 reserve，再执行 \u003ccode>UPDATE ... WHERE id=? AND version=7\u003c/code>。必须检查影响行数；0 行表示依据过时。重新加载后再校验规则，不能只改 version 重试旧结果。\u003c/p>\u003cp>内存仓储如果返回共享可变指针，调用者尚未提交就改变了仓储状态，回滚与版本机制形同虚设。本课程 Go 版使用无引用成员的值快照；复杂对象应实现深拷贝或受控更新。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · “一个事务只能一个聚合”是铁律？\u003c/h2>\u003cp>应优先让一个聚合内的规则局部成立，避免跨聚合锁链。但工程约束可能要求多个对象同事务，不能靠口号抹掉业务要求。记录为何需要、是否边界划错、竞争成本，以及是否存在显式业务流程。将现代聚合设计经验当推理工具，而非编译器规则。\u003c/p>\u003c/section>","answer":"第一次成功并写入 8。第二次更新 0 行，必须重新读取 8/10，再预留 4 时规则拒绝。若只重试旧快照，会覆盖第一笔或产生错误的业务效果；只有检查和状态提交一起受保护才可靠。","quiz":[{"prompt":"聚合优先按什么划分？","options":["外键可达的所有对象","必须一起保护的不变量","每个 HTTP 接口一个聚合"],"answer":1,"why":"关联不是一致性的充分理由。聚合为规则提供边界。"},{"prompt":"乐观锁冲突后应当？","options":["改用最新 version 保存旧结果","忽略 0 行更新","重新加载，并重新评估业务规则"],"answer":2,"why":"原决策建立在旧事实之上。冲突重试必须重新决策，且要有次数与退避策略。"}],"diagram":"aggregate","quote":["Provide REPOSITORIES only for AGGREGATE roots that actually need direct access.","只为确实需要直接访问的聚合根提供仓储。",173],"refs":["aggregate","vernon","go-repo"],"image":"aggregate","caseTitle":"两份快照都正确，合在一起却错了","caseContext":"容量 10，已预留 4。A/B 同时读到 version=7，各自要求再预留 4。单独检查时两者都符合容量限制。"},{"id":"7","n":7,"part":2,"title":"航运案例：把积木拼成一个用例","subtitle":"用同一票货，检验每个概念是否真的有用。","pages":"184–211","tags":["Cargo","Route Specification","Itinerary","Handling Event","角色"],"body":"\u003csection>\u003ch2>原书案例 · 我们在追踪什么？\u003c/h2>\u003cp>原书的货运系统把 Cargo、Customer、Location、Carrier Movement、Handling Event 等概念放进具体业务中，围绕变更目的地、重复业务、处理事件和资源分配逐步检验模型。模型通过具体用例检验自己的职责与边界。\u003c/p>\u003cp>Cargo 需要连续身份；运输要求描述希望如何运到；运输计划描述准备怎么走；处理事件记录发生了什么。\u003cstrong>要求、计划、事实\u003c/strong>分开，才能解释“计划满足要求，但实际走错路线”。\u003c/p>\u003c/section>\u003csection>\u003ch2>把模型放到码头上：三件工作，各自需要什么知识？\u003c/h2>\u003cp>原书第 7 章从一个已经相对成熟的航运模型出发，观察它怎样落到可工作的设计。订舱人员登记委托，现场人员录入装卸，客服查看运输进展。它们看着同一票货，却执行不同的用例。Booking Application、Incident Logging Application 和 Tracking Query 是协调者：负责组织步骤，不应各自发明一套“运输完成”的判断。\u003c/p>\u003cp>Cargo 表示需要持续追踪的货物委托；Customer 在这票委托中担当托运人、收货人、付款方；Location 表达业务所识别的地点；Carrier Movement 表示某承运工具的一次运输；Handling Event 表示已经发生的一次处理。Delivery Specification 描述交付目标，Delivery History 帮助理解实际发生的经过。\u003c/p>\u003cp>这里有一条很重要的语义分界：目标不是事实。要求送到东京，并不证明货物现在在东京；一份规划也不保证现场已经执行。将三者塞进一个不断变化的 \u003ccode>status\u003c/code> 字段，会让“改了计划”“发生了处理”“违背了要求”逐渐无法区分。\u003cspan class=\"small muted\">（原书模型与应用分工，PDF 184–189 页；计划的展开可衔接第 9 章 Itinerary）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>逐个决定身份与边界，而不是照着名词建表\u003c/h2>\u003cp>两个箱子内容相同也需要分开追踪，因此 Cargo 有追踪号。Customer 沿用企业已经使用的客户身份，比另造一套无法对应的编号更便于协作。Location 不能只按名称判等，同名港口不等于同一地点。Carrier Movement 则与具体班次对应，不能把“这条航线”与“今天这班船”混在一起。\u003c/p>\u003cp>Delivery Specification 是值：两票货可能有相同目标。Delivery History 却不能因为眼下都为空就互换，它属于特定 Cargo；原书把它的连续性关联到货物，而不要求再造一个独立全局身份。Customer、Location、Carrier Movement 被多票货共享，具有独立生命周期，不能因为一票货取消就跟着删除。\u003c/p>\u003cp>Handling Event 的边界更值得推敲。看一票货的历史时，它像 Cargo 的组成部分；但现场还可能需要查某班船的全部装载动作，它也有独立业务意义。原书据此把它设为独立聚合根。边界判断必须结合访问、生命周期和一致性要求，而不是只看“没有货物就没有事件”这句因果描述。\u003cspan class=\"small muted\">（PDF 188–193 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>改目的地：哪些东西必须改变，哪些必须保留？\u003c/h2>\u003cp>客户打来电话，请把目的地从甲港改成乙港。在原书的基本模型中，Delivery Specification 是值，可以创建新要求并整体替换。Cargo 的追踪号、已发生的装卸记录和参与客户不因为这个动作消失。若系统已引入 Itinerary，还要检查旧计划是否仍满足新要求；不满足时进入待重新规划，而不是偷偷把旧路线末站改掉。\u003c/p>\u003cp>工程中通常还需定义修改权限、截止阶段、额外费用与不可达情形。这些是具体业务政策，不能从“值对象整体替换”自动推导。允许替换数据只是机制；何时可以替换是领域规则。若现场已经交付，普通变更操作应拒绝或转入专门的纠错流程，不能重写历史来让报表看起来一致。\u003c/p>\u003cp>一个清晰的结果可以是：新要求已接受，原计划已失效，重新规划待完成。它比“更新成功”更诚实，也让前端和运营知道下一步责任。这里的中间状态是业务承认的流程状态，不是偶然的技术半成品。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>重复业务：复制的是可复用信息，不是整条生命线\u003c/h2>\u003cp>用户希望拿旧货单作为新货单的模板。直接深拷贝整个对象图会制造荒谬结果：新货物继承旧货物的追踪号和已签收历史，甚至复制出“同一个客户”的第二个实体。原书逐项处理：新追踪号、新的空历史、复制客户角色映射，但映射仍指向原来那些客户实体。\u003c/p>\u003cp>原书的工厂示例返回的 Delivery Specification 为空，等待新委托确定交付目标；并不是把旧承诺无条件继承下来。具体产品也可以允许复制要求作为草稿，但需要明确“待确认”，尤其要防止沿用已经过期的期限、价格与危险品声明。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>元素\u003c/th>\u003cth>重复委托时的处理\u003c/th>\u003cth>原因\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cargo 身份\u003c/td>\u003ctd>生成新的追踪号\u003c/td>\u003ctd>这是另一笔委托\u003c/td>\u003c/tr>\u003ctr>\u003ctd>处理历史\u003c/td>\u003ctd>清空，建立新历史\u003c/td>\u003ctd>过去事实不属于新货物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>客户角色映射\u003c/td>\u003ctd>复制容器，保留客户引用\u003c/td>\u003ctd>角色常可复用，客户不应被克隆\u003c/td>\u003c/tr>\u003ctr>\u003ctd>运输要求\u003c/td>\u003ctd>原书重置；产品可明确选择草稿复制\u003c/td>\u003ctd>新承诺需要重新确认\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"small muted\">原书场景与工厂，PDF 196–198 页。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>处理事件的创建，暴露了一个令人头疼的环\u003c/h2>\u003cp>最初设计中 Cargo 持有 Delivery History，History 持有 Handling Event 集合，Event 又指回 Cargo。录入装船事件时，既要创建 Event，又要把它加进 History；漏掉任一边，内存图就互相矛盾。为了维护集合，事件录入事务还会碰到 Cargo，和客服改委托争用。\u003c/p>\u003cp>原书没有把这个环奉为“正确类图”，而是改变实现：历史中的事件集合由查询得到，Handling Event 单独持久化；通过新增的事件仓储查询某票货的处理记录。录入现场事实因此不必修改 Cargo 聚合。若只关心最近一次装卸，还可以做有针对性的查询，而不是每次加载全部历史。\u003c/p>\u003cp>代价并没有消失：历史查询需要数据库访问；查询频率很高时，缓存或预计算可能更划算；有些对象数据库的直接引用又可能更有效。这里的取舍是访问模式、争用和一致性维护成本。原书展示的价值在于允许模型与实现相互反馈，而不是给出唯一永久正确的存储方式。\u003cspan class=\"small muted\">（PDF 198–202 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>现场事实的身份，不等于消息系统的投递次数\u003c/h2>\u003cp>原书根据案例中的业务约定，用货物、完成时间和事件类型识别 Handling Event。真实接入时必须重新核对这个约定：时间精度是否足够，人工补录是否会修正时间，外部供应商是否带稳定事件编号。不要把示例组合键直接当所有港口都适用的事实。\u003c/p>\u003cp>现代消息系统可能把同一现场事实投递两次。可以使用“来源 + 外部事件 ID”去重，再保存发生时间与接收时间。后来收到一个更早发生的卸船事件，不代表货物倒退了；不能按消息到达顺序无条件覆盖当前位置。若收到更正，应保留被更正事实与更正关系，避免审计时只剩一个无法解释的最新字段。这些是现代集成推演，不是原书完整给出的消息架构。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>销售分配进入订舱：防腐层究竟保护什么？\u003c/h2>\u003cp>销售系统想控制不同类型货物的配额，让高价值业务不被挤占。它的分类由一组外部类别名表示。直接把这些字符串贯穿订舱代码，短期最省事；但销售调整分类后，订舱、仓储、报表都可能被迫跟着变，开发者还会逐渐把类别编码误当成本地业务语言。\u003c/p>\u003cp>原书引入 Enterprise Segment，表达按商品、起讫地等维度划分的业务片段；Allocation Checker 将它与外部类别翻译，并提供订舱所需的业务能力。底层可以有处理 HTTP 或数据库访问的适配器，但真正的防腐工作是重述语义，不是换一个网络客户端。\u003c/p>\u003cp>第一次设计仍把“已订量 + 新货量不超过可分配量”的判断留在 Booking Application。随后作者把这条领域规则移入 Allocation Checker，应用只协调输入和结果。Cargo Repository 可以按 Segment 返回数量，无须返回所有 Cargo。分类规则由理解分段政策的对象掌握；即使 Cargo 持有所需数据，也不意味着所有分类行为都应该挂在 Cargo 上。\u003cspan class=\"small muted\">（PDF 206–211 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>把原书的调用关系放进生产，还要补哪条保证？\u003c/h2>\u003cp>下面的教学接口刻意把“判断”与“承诺”分开：第一次检查回答目前看起来是否可接受，最终接受则需要防止并发请求共同耗尽同一配额。若销售系统只返回一张可用额度快照，两个请求都看到余量，并不能证明它们能同时被接受。\u003c/p>\u003c/section>\u003cpre>\u003ccode># 接口示意：具体配额服务必须定义原子占用和重试契约。\nsegment = segment_policy.classify(cargo)\npreview = allocation.preview(segment, cargo.quantity)\n# 页面展示 preview 不代表占用成功。\nreceipt = allocation.reserve(\n    segment=segment,\n    quantity=cargo.quantity,\n    command_id=request_id,\n)\n# 本地保存失败时，如何取消/到期回收这份承诺，需要明确协议。\u003c/code>\u003c/pre>\u003csection>\u003ch2>优化之前，先分清稳定知识与实时承诺\u003c/h2>\u003cp>原书讨论过缓存相对稳定的分段规则来减少跨服务器通信，同时指出复制数据需要同步。今天也一样：类别映射可以带版本缓存，剩余额度却可能随每笔交易变化。把两者都缓存十分钟，只因为它们来自同一个接口，会把性能优化变成超配风险。\u003c/p>\u003cp>航运案例最终留下的是一组连贯决策：值对象承载要求，实体保留连续性，聚合围绕不变量，仓储按用例提供入口，工厂控制新生命，防腐层保护语言。某个访问模式或业务承诺改变时，允许重新选择边界；每一次变化都应能用真实场景解释。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 改目的地，不是改一个字符串\u003c/h2>\u003cp>改目的地会改变运输要求；已有计划可能不再满足新要求；货物当前位置仍由处理事实决定。用例要明确：哪些阶段允许修改、旧计划如何失效、是否触发重新规划，以及用户看到的待处理状态。\u003c/p>\u003cp>要求与计划适合建模为值：整体替换便于推理历史和一致性。若计划非常大或有独立协作生命周期，也可能选择实体；不要从词的长相决定。\u003c/p>\u003c/section>\u003csection>\u003ch2>原书的细节 · 角色、关联与副本\u003c/h2>\u003cp>同一 Customer 可以是托运人、收货人等角色，角色应放在具体业务关系中，而不是给客户永久贴一个只能选一项的类型。通过业务使用场景收窄关联方向，降低对象图的牵连。\u003c/p>\u003cp>重复业务不等于复制所有身份与历史。原书的重复业务工厂生成新跟踪身份，复制客户角色映射但仍引用同一客户；处理历史为空，运输规格留空，等待新业务提供。旧货物的处理事件不会成为新货物的历史。这是实体和值对象区别最直观的试金石。\u003c/p>\u003c/section>\u003csection>\u003ch2>现代补充 · 领域事件与集成事件\u003c/h2>\u003cp>本书的 Handling Event 首先是航运领域中真实的处理事实。后来的“领域事件模式”“消息总线”“事件溯源”并不能与它画等号。进程内领域事件可以触发后续行为，跨上下文集成事件还要考虑版本、敏感字段、重复和顺序。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 场景驱动评审\u003c/h2>\u003cp>以海风的业务约定为例，三个验收场景能检验模型：未装船前允许合法改目的地；已到最终港后普通修改被拒；已有路线不满足新要求时进入待规划状态。每个场景同时关注领域状态、持久化结果和对外反馈，类图据此接受检验。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 把跟踪历史全装进 Cargo\u003c/h2>\u003cp>历史事件无限增长，加载、锁范围和并发更新可能变得昂贵。先找根真正需要判断的事实，考虑快照或独立事件记录的查询。原书也通过重构、关联选择与性能讨论表明：模型不是一次画完的圣物。\u003c/p>\u003c/section>","answer":"要求替换目的地；检查原计划是否仍满足要求，必要时进入待重新规划；过去处理事件保持不变。货物身份不变。若新政策禁止此阶段修改，整个命令拒绝，不能只更新一半对象。","quiz":[{"prompt":"复制一票旧货物创建新业务，什么应当新建？","options":["货物身份与自身生命周期","所有共享港口定义","旧货物全部历史事件"],"answer":0,"why":"复用值或参考资料可以，新实体不能继承旧实体身份和已发生的业务历史。"},{"prompt":"Handling Event 出现在原书，能说明原书要求 Event Sourcing 吗？","options":["能","不能，这首先是领域里的业务事实概念","只要有 MQ 就能"],"answer":1,"why":"领域中存在事件不等于选择事件存储作为唯一状态来源。"}],"diagram":"cargo","refs":[],"caseTitle":"改目的地不会改写过去","caseContext":"同一票货的目的地发生改变，运输要求、运输计划和已发生的处理事实受到的影响不同。","image":"cargo-aggregate"},{"id":"8","n":8,"part":3,"title":"模型突破：补丁太多，也许问题问错了","subtitle":"让真正的业务关系浮出水面。","pages":"217–229","tags":["Breakthrough","深层模型","重构风险"],"body":"\u003csection>\u003ch2>原书故事 · 银团贷款的份额\u003c/h2>\u003cp>原书描述银行贷款系统：Facility 和 Loan 的份额关系原先被绑定得过紧。业务中的买卖与份额变化不断挑战设计。突破来自发现两种份额可以独立变化，用 Share Pie 等概念表达分配关系，而不是继续维护一个错误的同步假设。\u003c/p>\u003cp>精彩之处不在发明了一个新类，而在于撤掉“不应该存在的不变量”。仍需保证各自份额总和等真实规则。一个强约束如果业务根本不承认，它只是制造异常的机器。\u003c/p>\u003c/section>\u003csection>\u003ch2>先认识业务：额度承诺与实际放款是两回事\u003c/h2>\u003cp>银团贷款由多家机构共同参与。Facility 表达愿意在约定条件下提供资金的承诺，Loan 表达已经借出的资金。可以把个人信用卡额度作为理解入口：额度存在时你不一定已经借钱，使用额度才形成未偿借款。银团业务更复杂，因为每家参与者对承诺和实际放款的份额可能不同。\u003c/p>\u003cp>原书中的团队最初把两种份额绑得太紧。某机构在额度中承诺参与一定比例，于是系统倾向于让它在每次放款和已有贷款中保持同样比例。正常案例看起来顺畅；一旦有机构这次少出一点、另一家多出一点，就需要额外的 Loan Adjustment 去解释偏差。\u003c/p>\u003cp>“例外”越来越多，舍入问题也不断出现。团队不是不会写公式，而是在用一条业务并不认可的关系作为公式的基础。把错误关系实现得再严密，得到的也只是稳定地产生错误解释的系统。\u003cspan class=\"small muted\">（原书银团贷款案例，PDF 217–220 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>跟着两笔放款，看旧假设怎样失效\u003c/h2>\u003cp>下面用缩小后的数字推演，比例和金额为教学示例。额度总额 100，A、B、C 的承诺份额是 50%、30%、20%。第一次放款 50，三家按约参与，未偿贷款分为 A 25、B 15、C 10。此时额度比例与贷款比例一致，很容易误以为这是必须一直成立的不变量。\u003c/p>\u003cp>第二次再放款 30，但 B 本次不参与，A 出 21，C 出 9。新的未偿贷款是 A 46、B 15、C 19，合计 80；额度仍然是原来的承诺分布。这不是系统数据不一致，而是业务允许的一次安排。为了强行维持 50/30/20 而生成越来越多“调整”记录，才是在与事实较劲。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>对象 / 动作\u003c/th>\u003cth>A\u003c/th>\u003cth>B\u003c/th>\u003cth>C\u003c/th>\u003cth>合计\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>额度承诺\u003c/td>\u003ctd>50\u003c/td>\u003ctd>30\u003c/td>\u003ctd>20\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第一次放款\u003c/td>\u003ctd>25\u003c/td>\u003ctd>15\u003c/td>\u003ctd>10\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第二次放款\u003c/td>\u003ctd>21\u003c/td>\u003ctd>0\u003c/td>\u003ctd>9\u003c/td>\u003ctd>30\u003c/td>\u003c/tr>\u003ctr>\u003ctd>未偿贷款\u003c/td>\u003ctd>46\u003c/td>\u003ctd>15\u003c/td>\u003ctd>19\u003c/td>\u003ctd>80\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>这正对应原书突破的核心：Facility 的份额和 Loan 的份额可以独立演变。独立不等于毫无联系，额度上限、放款资格和总额守恒等真实约束仍然存在。\u003cspan class=\"small muted\">（原书过程见 PDF 221–225 页；表中金额为教学改编）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>同样一笔钱，为什么要按不同依据分配？\u003c/h2>\u003cp>借款人现在偿还本金 8。原书案例按未偿贷款的实际份额分配，而不是按最初额度比例分配，因此 A 得 4.6、B 得 1.5、C 得 1.9；相应未偿余额减少。若继续用额度比例，B 就会收到与其实际放款份额不符的本金。\u003c/p>\u003cp>借款人为保有额度支付费用时，分配依据又是 Facility 的承诺份额；原书还说明不同权益可能有更复杂的交易安排。这告诉我们，不能设计一个含糊的 \u003ccode>distribute(amount)\u003c/code>，让调用者猜它究竟使用哪套比例。应明确叫“按贷款份额分配本金偿还”或“按额度份额分配额度费用”。\u003c/p>\u003cp>这些动作共享“把一个总量按份额分成若干部分”的数学机制，却不共享选择哪份比例的业务政策。机制可以复用，决策依据必须留在正确的业务概念里。把复用做到抹平语义差别，是另一种形式的过度抽象。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>Share Pie：把“许多独立数值”变成一个完整分布\u003c/h2>\u003cp>如果每个 Share 只是 \u003ccode>owner + amount\u003c/code>，计算仍然会散落在 Loan、Facility、Payment 的循环里。Share Pie 把同一次分配的全部份额看成一个整体，回答总量是多少、各参与者占多少、两个分布怎样相加减、某总量怎样按现有分布分摊。\u003c/p>\u003cp>Facility 持有表示承诺的份额分布，Loan 持有表示未偿资金的分布，Payment 也可以有自己的分配结果。它们使用相同的值运算，但业务含义由宿主和操作名称给出。原书中的 Loan Adjustment 不再作为维持错误比例的补丁存在，因为 Loan 的真实份额可以直接表达。\u003c/p>\u003cdiv class=\"model-strip\">\u003cspan>额度分布 → 默认放款建议\u003c/span>\u003cspan>实际放款分布 → 增加贷款份额\u003c/span>\u003cspan>贷款分布 → 分配本金偿还\u003c/span>\u003c/div>\u003cp>模型突破的证据是：旧模型需要例外才能解释的正常事实，新模型可以直接表达；此前难以理解的图，领域专家也能够讨论。多一个类本身不是证据，少写几行代码也不是充分证据。\u003cspan class=\"small muted\">（PDF 223–227 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>数字守恒：给“差一分钱”一个明确政策\u003c/h2>\u003cp>份额分摊不能只做每项金额四舍五入再求和。总额 1 分、三方等权时，每人舍入为 0 分就丢了 1 分；若每人都进位又多出 2 分。把小数误差反复抹平，可能把问题从一次计算转移到后续审计。\u003c/p>\u003cp>一种可解释的工程方案是整数最小单位分配：先按比例取整，再按余数大小分配剩余单位，余数相同时使用约定的稳定顺序。这只是候选政策；真实金融合同可能要求其他分配方法，必须确认并保留规则版本。下面代码展示守恒方法，不代表原书的完整金融计算实现。\u003c/p>\u003c/section>\u003cpre>\u003ccode>def allocate_minor_units(total: int, weights: dict[str, int]):\n    if total &lt; 0 or not weights or any(w &lt; 0 for w in weights.values()):\n        raise ValueError(&quot;invalid allocation&quot;)\n    basis = sum(weights.values())\n    if basis == 0:\n        raise ValueError(&quot;zero basis&quot;)\n    pairs = {k: divmod(total * w, basis) for k, w in weights.items()}\n    result = {k: q for k, (q, _) in pairs.items()}\n    remaining = total - sum(result.values())\n    priority = sorted(weights, key=lambda k: (-pairs[k][1], k))\n    for owner in priority[:remaining]:\n        result[owner] += 1\n    return result\n# allocate_minor_units(1, {&quot;A&quot;: 1, &quot;B&quot;: 1, &quot;C&quot;: 1})\n# 按此处稳定次序：A 1 分，B/C 0 分；总量仍为 1 分。\u003c/code>\u003c/pre>\u003csection>\u003ch2>发现新模型后，为什么团队反而害怕？\u003c/h2>\u003cp>原书的故事没有停在白板上的顿悟。团队已经落后于进度，又缺少今天常见的自动化测试保障；新概念牵动大量代码，中间可能没有稳定可发布的停靠点。负责人需要评估恢复现有功能的时间、继续旧设计的可行性、后续版本的阻力与长期风险。\u003c/p>\u003cp>作者记述团队在获得支持后完成了这次重大重构，但不能据此得出“看懂新模型就该推倒重来”。成功案例说明重构可能消除长期障碍，也同样呈现了承担风险所需的组织支持。迁移时间估计是那次项目的事实，不是任何 DDD 项目的模板。\u003c/p>\u003cp>工程上应把“新模型更贴近业务”与“现在有能力安全切换”分开举证。前者通过业务场景和反例验证；后者通过数据转换、契约兼容、回滚路径、可观察性与发布安排验证。把二者混为一谈，会让正确的建模判断变成危险的交付决策。\u003cspan class=\"small muted\">（PDF 225–227 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>一种可控制的迁移路线\u003c/h2>\u003cp>先把当前系统的正常与例外交易保存成具名样例，尤其保留 B 不参与放款、份额转让、部分还款和舍入边界。新模型先只计算、不产生真实扣款或通知，把同样输入送入新旧计算比较。差异由专家判断：是新模型错误，还是旧系统长久以来就在错误解释业务。\u003c/p>\u003cp>接着定义旧数据到新份额分布的映射。若旧系统只保存“默认比例 + 调整项”，转换必须能够重建实际所有权，并核对每笔总额与每家余额；无法解释的差额进入人工核查，不能一律记给某个“其他”参与者。对在途交易还要确定切换点，避免一半按旧模型、一半按新模型。\u003c/p>\u003cp>最后再选择按产品、客户群或业务时段切换。双写会引入两边成功程度不同的问题，并非天然安全；能由一个权威模型写入、另一个影子计算时，往往更容易明确事实来源。以上是工程推演，采用哪条路线取决于系统是否允许重放、交易可撤销程度及现有审计能力。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>如何识别下一次突破正在靠近\u003c/h2>\u003cp>几个信号常一起出现：同一个“例外”反复返回；两个字段通常相同却不断需要绕开；业务专家不使用代码里的重要名词；看似局部的改动总要修改远处公式。它们提示模型可能把不同生命周期绑在一起，或遗漏了更完整的概念。\u003c/p>\u003cp>但不是每个复杂分支都证明模型错误。有些业务本来就包含例外，有些复杂性属于集成与运维。先找到具体反例，再探索能解释它的新概念。第 9 章把这种寻找变成日常建模方法，第 10 章则展示 Share Pie 如何继续经过细致重构，形成可组合的值运算。\u003c/p>\u003c/section>\u003csection>\u003ch2>迁移到航运 · 货物运动还是责任移交？\u003c/h2>\u003cp>只看集装箱移动，会把一切建模为位置变化。但某些业务真正关心的是“谁在什么时候承担交付责任”。原书早期也提出这种更深的视角。你的模型可能因此引入交接、承诺与异常责任，而不是继续给位置表加字段。\u003c/p>\u003cp>深层模型不等于更抽象、更数学或更多层。它应该让业务现象更容易解释，让此前特殊的分支变得自然，同时减少无关概念。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 突破并不自动值得立刻重写\u003c/h2>\u003cp>新模型可能正确，迁移时机仍可能错误。检查受影响的数据、接口、团队协作、在途业务和发布时间。原书明确记录了重构收益与管理风险之间的抉择；它不是“顿悟后删除旧系统”的英雄故事。\u003c/p>\u003cp>可以先在一个局部场景建立新模型，用特征测试固定旧行为，再比较新旧计算结果。差异要由业务确认：哪些是修复旧错误，哪些是新模型误解。代码变少只是信号，不能替代业务验收。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程做法 · 给旧模型做一次“压力访谈”\u003c/h2>\u003cp>收集最近三次补丁：它们是否总在修同一个词？是不是一个对象承担了两个不同生命周期？是不是有字段“通常相等，但特殊情况下例外”？这些地方值得重访。\u003c/p>\u003cp>例如“预订必须一直等于支付状态”可能是错约束。预订保留资源、支付记录收款，两者可以通过流程协作，但不必共享单一状态机。认知上的解绑会引入协调成本，需要显式处理中间状态。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 新名词掩盖旧结构\u003c/h2>\u003cp>把 OrderManager 改名为 CommitmentEngine，而条件分支和数据耦合完全没变，不算模型突破。请展示一条旧模型难以说明、新模型自然表达的业务事实，以及因此新增或删除的测试。\u003c/p>\u003c/section>","answer":"“确认必须已在线支付”不再普遍成立，可改成“确认需要有效结算安排”，例如已支付或已批准授信。容量约束、客户授权和账务记录仍须成立。不要把月结当成 payment_status=paid，否则欠款和实际收款被混淆。","quiz":[{"prompt":"深层模型最有价值的结果是？","options":["抽象层数量增加","更自然地解释业务并消除不合理约束","所有需求都不再变化"],"answer":1,"why":"洞察改善解释力与结构，而不是消灭变化。"},{"prompt":"发现更好模型后应当？","options":["立即全量重写","冻结新发现，永不修改","结合迁移风险与反馈选择落地范围"],"answer":2,"why":"模型正确性与实施时机是两个问题。"}],"diagram":"cycle","refs":[],"caseTitle":"企业月结推翻了旧假设","caseContext":"旧模型把“预订已确认”与“已支付”绑定。支持企业月结后，这个等价关系不再成立。","image":"loan-shares"},{"id":"9","n":9,"part":3,"title":"显式概念：把隐藏规则变成可讨论的东西","subtitle":"从“这里有点别扭”发现模型的缺口。","pages":"230–267","tags":["显式约束","过程对象","规格模式","Specification"],"body":"\u003csection>\u003ch2>重点 · 从五个入口找概念\u003c/h2>\u003cp>听领域专家反复使用却未进入代码的词；检查别扭的计算和参数组合；追究不同场景之间的矛盾；读领域资料；用小实验反复试。不要只在已有类之间搬方法，新的概念可能根本没被命名。\u003c/p>\u003cp>例如每次规划路线都传 \u003ccode>origin, destination, deadline, must_pass\u003c/code>，说明“运输要求”可能是一个整体。它不负责实际搬运，而是描述什么样的方案可接受。\u003c/p>\u003c/section>\u003csection>\u003ch2>“只是一个报表”，可能正藏着核心概念\u003c/h2>\u003cp>原书中，开发者把订舱结果理解为数据库里的一组记录：每行保存货物、班次、装货港和卸货港。运输专家却反复说“行程”，运营要用它安排装卸，客服要把它给客户。开发者最初以为行程只是一个打印报表，真正的数据已经在表里了。\u003c/p>\u003cp>转折来自意识到：Itinerary 不是屏幕上的排版，而是业务共同使用的一份运输计划。它由 Leg 组成，每段关联班次、装卸地点和时间。路由服务应该返回这份计划，而不是直接往某张表写数据；订舱应用再把它与委托一起保存，运营也可以通过它理解后续安排。\u003c/p>\u003cp>这次改变没有凭空新增业务事实，却改变了知识的位置。原先散落在 SQL、报表、运营接口中的“如何拼成一趟运输”被命名为 Itinerary。模型从“数据放在哪”向“业务在讨论什么”前进了一步。领域专家觉得理所当然的词，程序员可能已经听过很多遍，却一直没有认真建模。\u003cspan class=\"small muted\">（原书转述，PDF 231–235 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>从别扭的计算中，发现“应计”与“支付”\u003c/h2>\u003cp>另一个例子发生在金融系统。一个利息计算器同时追踪已经产生的利息、已经支付的金额和期间未付余额，状态越来越纠缠。把大方法拆成几个小方法只能暂时缓解，因为“利息产生”和“实际付款”仍被当成同一件事的不同字段。\u003c/p>\u003cp>专家指出，业务分别记录收益的应计与支付。利息可以每天产生，付款却在另一时刻发生；费用也可以按自己的规则应计。引入 Accrual 后，计算可以针对一个期间产生一笔应计记录，支付再形成另一类事实。需要“未付多少”时，由明确的关联与口径计算，而不是让一个含糊余额承担所有历史。\u003c/p>\u003cp>这种拆分的收益不止代码短了。现在可以解释：“今天已经赚取，但尚未收到”“收到的钱补偿哪一段期间”“费用与利息分别记到哪里”。后续加入另一类费用时，也有自然落点。概念显式化的质量，要用新增的解释能力和减少的错误假设衡量。\u003cspan class=\"small muted\">（原书转述，PDF 236–245 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>矛盾是线索，但不必强行统一所有说法\u003c/h2>\u003cp>销售说“客户已经签约”，财务说“这个客户还没有建立”，可能不是任何一方表达不清，而是销售关系与结算账户的生命周期不同。若为了统一而增加十几个布尔字段，一个 Customer 会承担两套独立状态；若直接把两方术语分别保留，又需要说明它们如何对应。\u003c/p>\u003cp>先让每句话回到具体情境：谁在什么时刻、为了什么决定使用这个词？再比较哪些事实可以同时为真。某些矛盾能通过更深概念统一，例如把应计与支付分开；另一些应保留在不同限界上下文中，通过映射合作。模型的目标是准确解释业务，而不是让所有人永远使用一张类图。\u003c/p>\u003cp>行业书籍和既有分析模式可以提供候选概念，但不能替本地业务裁决。同样叫“可用额度”，一家机构可能已经扣除待结算承诺，另一家可能没有；直接移植术语却不核对口径，只会让错得更专业。原书鼓励反复试验，也提醒建模者不要依恋自己的第一次命名。\u003cspan class=\"small muted\">（PDF 242–245 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>显式约束：先给规则起名字，再决定要不要建类\u003c/h2>\u003cp>原书先用桶容量展示最小的改进：把散落在倒水逻辑中的限制提炼成一个命名方法。规则不必一出现就成为独立对象。命名已经让团队能单独讨论“容量约束”，也让调用者不再被计算细节打断。\u003c/p>\u003cp>当规则需要宿主本不该知道的数据、同一规则在多个对象里重复，或业务讨论大量围绕它展开，而代码却藏在条件分支深处时，独立概念才更有价值。例如冷链资格涉及货物要求与箱体能力，放在 Cargo 中会让货物了解设备细节，放在 Container 中又会让箱子了解所有货类；一个有名称的适配规格能让双方保持清晰。\u003c/p>\u003cp>必须同时确定失败语义。原书的桶例子把超出容量的部分限制掉，是特定例子的行为。订单容量不足时不能照搬成“自动少订一点”，因为客户可能要求全部或不接受。相同的数学上限，对不同业务动作可能意味着拒绝、截断、排队或需人工授权；名称和契约必须说清楚。\u003cspan class=\"small muted\">（PDF 246–248 页；订舱对比为教学推演）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>业务过程如何成为模型，而不是再造一个 Manager\u003c/h2>\u003cp>路由是有领域意义的过程：它根据运输要求和网络找到可行计划。搜索算法可能很复杂，仍可以由 Routing Service 隐藏，实现对外返回 Itinerary 的业务能力。这里服务的价值在于承载一个自然的领域动作，而非把几个数据库调用集中到同一类。\u003c/p>\u003cp>有些过程还有独立生命周期。理赔从申请、补资料、核赔到结案，每一步都有责任人和业务可见状态，因而可能需要 Claim 或 ClaimProcess 实体；一次 HTTP 请求内的鉴权、反序列化、加载、提交，则主要是应用编排。不能因为它有多个步骤，就认为需要领域工作流引擎。\u003c/p>\u003cp>判断的关键是：业务人员是否需要追踪这个过程自身，是否关心它的身份、状态、期限和合法转换。若答案是肯定的，过程不该只存在于任务队列和日志中；若不是，一个简洁用例函数可能已经足够。\u003cspan class=\"small muted\">（过程显式化见 PDF 248–249 页；理赔为教学改编）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>Specification 的三种用途，共享的是“什么算满足”\u003c/h2>\u003cp>校验先有候选，再问是否符合要求；筛选面对一组候选，找出符合者；按规格构造则先有要求，再生成满足它的结果。拿冷链举例：校验某只箱子、查询可用箱子、安排清洗与预冷后得到可用箱子，是三种不同工作。共同点是接受条件，执行机制却不同。\u003c/p>\u003cp>下面的教学规格只表达两个明确条件：箱体食品级合格，且其最低可达温度不高于要求温度。负温度的方向容易写反，能到 −25°C 的设备具备达到 −18°C 的能力。实际还要检查容积、维护状态、持续制冷能力和温区相容性，不能把两个字段的判断误当完整冷链认证。\u003c/p>\u003c/section>\u003cpre>\u003ccode>from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass ColdFoodSpec:\n    required_celsius: int\n\n    def is_satisfied_by(self, container) -&gt; bool:\n        return (container.food_grade\n                and container.min_celsius &lt;= self.required_celsius)\n\nspec = ColdFoodSpec(required_celsius=-18)\n# 校验：spec.is_satisfied_by(chosen)\n# 筛选：[c for c in candidates if spec.is_satisfied_by(c)]\n# 构造：planner.prepare_container(spec)，最后仍要按 spec 验证。\u003c/code>\u003c/pre>\u003csection>\u003ch2>从十个候选到一千万个候选，规则不能照搬执行方式\u003c/h2>\u003cp>在内存中循环判断十只箱子很直接；对一千万条记录先全部加载，规则再优雅也会拖垮系统。数据库适配器需要把可下推的规则转换成可用索引和分页的谓词，或者先做安全的粗筛，再对较少候选做精确校验。粗筛不能排除真正符合条件的对象，否则后面的精确校验无法补救。\u003c/p>\u003cp>翻译必须保持语义：SQL 的 NULL、字符串排序、时区和数值精度，可能与内存里的布尔判断不同。内存把未知食品等级当 false，SQL 就不能不加区分地把 NULL 当成已合格；时间边界是包含截止时刻还是严格早于，也必须一致。针对边界候选比较两种实现，比只验证一条 happy path 更有价值。\u003c/p>\u003cp>原书的 SQL 示例同时讨论了表结构泄漏的代价。领域规格不一定需要拼 SQL；可以让基础设施认识受控的规格类型，或在读侧使用独立查询模型。也不必承诺“任意 Python 函数都能翻译成 SQL”。把表达能力限制在业务需要的范围，通常更容易保持正确、可解释与可优化。\u003cspan class=\"small muted\">（原书筛选讨论，PDF 255–260 页；查询一致性为工程补充）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>满足硬约束，并不意味着方案已经最好\u003c/h2>\u003cp>一个装箱或路由求解器可以生成满足规格的结果，却仍然浪费昂贵设备、成本过高或装载效率很低。Specification 描述“可不可以接受”，选择政策描述“在可接受结果里更偏好哪一个”。把冷链资格和低价格一起加权打分，可能让极便宜但不合格的方案胜出，这不是一个可接受的折中。\u003c/p>\u003cp>构造过程也不能通过修改规格让自己过关。例如没有满足 −18°C 的箱子，就把规格放宽到 −4°C；这种改变需要业务重新授权，不能作为求解器内部优化。正确结果可能是“无可行方案”，附上明确的未满足条件，交给人或另一业务流程处理。\u003c/p>\u003cp>校验结果还受时间影响。查询时空闲不代表最终占用时仍空闲；规格判断与资源承诺之间必须有并发协议。把规则独立出来让语义更清楚，并没有自动解决事务、外部系统和实时性。第 18 个阅读单元进一步讨论规格组合、蕴含与剩余条件。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 约束不必全部变成类\u003c/h2>\u003cp>“重量必须为正”写在构造函数中即可；复杂、反复使用、需要与专家讨论的“可运输条件”才可能值得独立为 Specification。抽象成本包括理解、调试和维护，要由独立概念的价值支付。\u003c/p>\u003cp>过程也可能是领域对象，例如需要追踪阶段、负责人和决策的审批。如果只是技术调用顺序，先保留为应用编排；不要把每个 service 方法都包装为 Workflow。\u003c/p>\u003c/section>\u003csection>\u003ch2>重点 · Specification 的三个工作\u003c/h2>\u003cp>校验：这条路线是否符合要求？筛选：哪些路线符合要求？按规格构造：求解器能否生成满足要求的路线？共同部分是“满足的含义”，搜索算法和构造策略可以不同。\u003c/p>\u003cp>规格与候选分离后，规则能独立命名、组合与测试。它不是仓储、查询执行器或万能规则引擎。复杂组合、阈值包含关系和剩余规格将在专题 18 深挖。\u003c/p>\u003c/section>\u003cdiv class=\"code-pair\">\u003cdiv data-lang=\"go\">\u003cpre>\u003ccode>type RouteSpec struct { Destination string }\nfunc (s RouteSpec) IsSatisfiedBy(i Itinerary) bool {\n    return len(i.Legs) &gt; 0 &amp;&amp;\n        i.Legs[len(i.Legs)-1].To == s.Destination\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv data-lang=\"python\">\u003cpre>\u003ccode>@dataclass(frozen=True)\nclass RouteSpec:\n    destination: str\n    def is_satisfied_by(self, itinerary):\n        return bool(itinerary.legs) and (\n            itinerary.legs[-1].to == self.destination)\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003csection>\u003ch2>工程取舍 · 内存规则与 SQL 一致吗？\u003c/h2>\u003cp>对十条路线逐条判断很方便，对千万条数据可能不可行。数据库需要索引、分页和可执行谓词。可以为有限规则树写查询适配器，也可以先用粗筛缩小候选再精确验证，但必须明确空值、时区、大小写和精度语义。\u003c/p>\u003cp>本书自己的早期 SQL 示例也讨论了表结构泄漏的问题。不要照着示例就把表名和 SQL 字符串散落进所有领域对象。为内存判定与查询结果建立一致性样例；复杂搜索也可以由专用读侧负责。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 只返回 false，排查靠猜\u003c/h2>\u003cp>资格规则往往需要解释拒绝原因。可以返回结构化原因，或在简单组合下构造剩余规格；不要为展示一句错误信息就实现一套通用逻辑推理器。保持“判断语义”与“用户文案”分离，方便多端和审计使用。\u003c/p>\u003c/section>","answer":"校验：检查已选箱子；筛选：从可用箱中找满足条件者；构造：安排清洁和设备准备，使候选满足条件，或报告不可达。前两者可共享判断规则；构造还需要可执行动作和成本约束，isSatisfiedBy 并不自动提供求解能力。","quiz":[{"prompt":"每条简单 if 都该提炼规格类吗？","options":["应该，类越多越领域化","不必，先看概念价值、复用和变化","不能用规格类"],"answer":1,"why":"规格是表达独立业务约束的工具，简单规则直接命名也很好。"},{"prompt":"一套内存规格自动适用于 SQL 吗？","options":["自动适用","要验证空值、精度等语义并实现适配","只需把字段名拼接成 SQL"],"answer":1,"why":"查询执行有独立约束。规则语义一致并不意味着实现可以直接复用。"}],"diagram":"spec","refs":["specpaper"],"caseTitle":"同一规则，三种使用方式","caseContext":"冷链食品要求可冷藏且食品卫生合格。系统可能校验已经选择的箱子、筛选可用箱子，或者安排服务使箱子符合条件。"},{"id":"10","n":10,"part":3,"title":"柔性设计：让规则容易组合，也容易看懂","subtitle":"不是预见所有变化，而是降低下一次修改的阻力。","pages":"268–317","tags":["意图接口","无副作用函数","断言","概念轮廓","独立类","操作闭包"],"body":"\u003csection>\u003ch2>六件工具，一起降低理解成本\u003c/h2>\u003cp>原书的 Supple Design 不是“多加接口”。它要求开发者能在不阅读整个实现的情况下使用一个元素，组合行为时可预测，并沿业务自然变化的边界修改。\u003c/p>\u003c/section>\u003csection>\u003ch2>柔性的目标：使用一个概念时，不必把整个系统装进脑中\u003c/h2>\u003cp>假设一个接口叫 \u003ccode>process(data, mode=3)\u003c/code>。调用者不仅要知道 mode 的含义，还得读实现才能确定它是否改数据库、扣余额或发送通知。即使背后拆成十几个设计模式，这个接口仍然很硬：每次使用都要重新理解全部因果链。\u003c/p>\u003cp>柔性设计把理解范围缩小。计算与修改分开，副作用写清，稳定概念能够独立组合，变化沿着有业务意义的边界发生。它不是保证任何需求都不用改代码，而是让改动的影响可推断。原书的六个模式彼此支持：名称表达目的，函数减少副作用，契约说明结果，概念轮廓决定边界，独立类减少依赖，操作闭包促进组合。\u003c/p>\u003cp>这些品质应优先用在复杂且经常变化的关键逻辑上。并非每个后台录入页面都值得构建一套丰富代数，也不需要为了“统一风格”把简单对象改造成抽象框架。\u003cspan class=\"small muted\">（原书第 10 章，PDF 268–270 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>意图揭示接口：名称必须和实际承诺一致\u003c/h2>\u003cp>原书的颜料例子最初提供一个含糊的 paint 方法。看完内部计算才知道它把一种颜料混入另一种。改成 mixIn 让目的更清楚，属性名从字母缩写变成颜色和体积，也减少了猜测。但一个好名字只是开始：它究竟修改谁，参数中的颜料是否被消耗，还没有说清。\u003c/p>\u003cp>迁移到订舱，\u003ccode>check()\u003c/code> 可以表示输入格式检查、资源资格判断或最终接受；这些保证完全不同。\u003ccode>canReserve(snapshot)\u003c/code> 只能回答在给定快照上规则是否满足；\u003ccode>reserve(command)\u003c/code> 则需要说明是仅修改内存，还是完成持久化承诺。名称不能暗示超过实现的保证。\u003c/p>\u003cp>接口应该从调用者的业务句子倒推。调用者想表达“根据现有贷款份额计算本金偿还分配”，就不应被迫拿 Map、遍历每个持有人，再自行重组结果。将低层步骤封装成概念能力，才是有效封装；把它们藏进一个叫 process 的方法并没有同样效果。\u003cspan class=\"small muted\">（原书颜料示例，PDF 270–274 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>无副作用函数：把计算与承诺拆开\u003c/h2>\u003cp>原书的贷款代码一开始在分配本金偿还时，既计算每家应该收到多少钱，又直接减少 Loan 的份额。财务想先预览结果，调用一次却已经改变贷款；想比较两个方案，也无法安全地重复调用。这个方法名字表达了部分意图，行为仍然过载。\u003c/p>\u003cp>第一步重构把计算提取成 \u003ccode>calculatePrincipalPaymentShares\u003c/code>，返回分配结果；再由 \u003ccode>applyPrincipalPaymentShares\u003c/code> 执行状态变化。预览、报表和模拟因此可以复用纯计算。实体仍然有状态，系统也仍然能完成真实交易，只是最复杂的数学部分不再夹带动作。\u003c/p>\u003cp>这种分离没有消除并发窗口：预览基于的贷款份额可能已经变化。应用分配时要校验同一版本，或者重新计算并让业务接受新结果。纯函数保证同样输入的推理可控；提交协议保证这些输入在承诺时仍有意义。二者解决不同问题。\u003cspan class=\"small muted\">（原书重构，PDF 309–311 页；并发说明为工程推演）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>契约：不仅说“会成功”，还要说成功与失败后是什么状态\u003c/h2>\u003cp>对预留舱位，可以写出三个层次：前置条件是数量为正且调用者拥有权限；聚合不变量是已预留量不超过可承诺量；成功后置条件是已预留量增加指定数量，其他订单不变。失败时也应明确：内存是否保持原样，是否可能已经提交，重试应使用什么身份。\u003c/p>\u003cp>原书颜料例子进一步说明，技术上自洽的后置条件也可能误导人。真实混合会消耗原材料，但配方模拟需要保留原料信息。若接口用物理混合的语言却保留原料不变，开发者很容易理解错；可以重新区分颜料数量与颜色计算，让模型的概念自然支撑契约。\u003c/p>\u003cp>契约不等于只写一条 \u003ccode>assert\u003c/code>。Python 优化运行可以移除 assert，关键生产校验应显式拒绝非法输入；测试再验证边界值、失败无部分修改、金额守恒等性质。无法保证的副作用也不能靠文档许诺：已经向外部支付系统发送请求后超时，结果可能未知，应由查询与幂等协议处理。\u003cspan class=\"small muted\">（原书 Assertions，PDF 280–284 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>概念轮廓：在业务真的会分开的地方切开\u003c/h2>\u003cp>把 500 行方法平均拆成五个 100 行方法，得到的可能只是五块仍然不能独立理解的程序。另一个极端是把每一步拆成一个对象，调用者必须了解十几个细碎角色才能完成一个简单动作。原书用概念轮廓寻找“完整而有意义的一块”：它应该能被业务语言命名，也能解释自己的变化。\u003c/p>\u003cp>应计和支付就是一个轮廓。利率规则变化影响如何产生 Accrual，支付渠道变化影响如何记录 Payment；两者过去被塞进同一计算器时，一个变化会拖动另一个。拆开后，业务的新需求更可能落在局部。颜料配方则不一定需要拆到每个化学成分，因为当前使用者是在组合现成颜料，而不是研发新颜料。\u003c/p>\u003cp>轮廓不是永远不变的天然真理。连续几次改动都跨越同一条边界，就值得检查边界是否错误；也可能是新业务真的改变了原来的稳定假设。判断靠变化历史与领域反馈，而不是“每类不得超过多少行”的机械规则。\u003cspan class=\"small muted\">（PDF 284–290 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>独立类：把复杂计算从复杂环境中解放出来\u003c/h2>\u003cp>计算一笔分摊若必须先启动数据库、HTTP 服务、用户会话和任务队列，说明计算的依赖面过大。Share Pie 的运算通常只需要参与者、金额与明确的舍入政策。将它表达为值对象，就能在不加载 Loan 整个世界的情况下理解和验证。\u003c/p>\u003cp>独立并不等于只剩原始类型。把 Money 拆回 int、currency 拆回 string，类型依赖变少了，但币种、精度和舍入这些概念仍然存在，只是藏得更深。真正减少负担是删除无关知识：份额运算无需知道数据库事务，金额运算无需知道登录用户，而不是删除所有有名字的概念。\u003c/p>\u003cp>有些依赖本来就是概念的一部分。路线需要理解航段，不能为达到零依赖而把它变成无类型数组。原书强调尽量消除非必要关系，保留的关系也因此更能说明模型。\u003cspan class=\"small muted\">（PDF 290–292 页）\u003c/span>\u003c/p>\u003c/section>\n\u003csection>\u003ch2>Share Pie 的第二次演化：从局部实体到不可变的数学值\u003c/h2>\u003cp>分离计算和修改后，代码仍然不断遍历 shares，许多规则其实作用于整个分布。于是引入 Share Pie，最初把它视为 Loan 聚合内部的局部实体，提供 increase、decrease。Loan 变简单了，但分布本身仍会原地改变，中间结果不容易自由组合。\u003c/p>\u003cp>进一步的洞察是：若业务关心分布的内容，而不关心“原来那一份分布对象”的身份，就可以把它建成不可变值。增加或减少返回新的 Share Pie，Loan 用新值替换旧值。于是“应用本金偿还”可以读成“贷款份额减去偿还分配”；“增加放款”读成“贷款份额加上本次放款分布”。\u003c/p>\u003cp>这就是操作闭包的价值：两个分布相加减，结果仍是分布，能够继续组合。它指的是运算的输入输出保持在同一种概念中，不是编程语言里捕获变量的闭包函数。不过数学差额可能出现负数；若业务中的有效持有份额禁止负数，就需要区分用于分析的带符号分布与可落账分配，或把减法定义为带前置条件的操作，不能宣称任意相减都能得到有效贷款。\u003cspan class=\"small muted\">（原书连续重构，PDF 311–317 页；类型范围说明为教学补充）\u003c/span>\u003c/p>\u003c/section>\u003cpre>\u003ccode># 教学节选：计算返回新值，修改只发生在明确的实体命令中。\ndef preview_principal_payment(loan, amount):\n    return loan.shares.prorated(amount)\n\ndef apply_principal_payment(loan, distribution):\n    next_shares = loan.shares.minus(distribution)\n    if next_shares.has_negative_amount():\n        raise ValueError(&quot;repayment exceeds an owner&#x27;s outstanding share&quot;)\n    loan.replace_shares(next_shares)\n\n# 分析“实际出资与默认比例的偏离”，结果允许出现负差额：\nexpected = facility.shares.prorated(loan.shares.total())\ndeviation = loan.shares.difference(expected)\u003c/code>\u003c/pre>\u003csection>\u003ch2>声明式设计：能力越强，语义责任也越大\u003c/h2>\u003cp>当 Loan 代码能直接表达“按份额分摊”“将分配从余额中减去”，它已经比手写循环更接近声明业务含义。Specification 的 \u003ccode>cold.and(foodGrade)\u003c/code> 也有类似效果：调用者说明要求，机制负责解释。声明式不一定意味着代码生成器、DSL 或规则引擎。\u003c/p>\u003cp>原书同时讨论了表达语言不够用、生成代码妨碍迭代等风险。若业务只需要 AND，加入 OR、NOT、优先级、脚本调用和任意函数，会显著增加解释、查询翻译、权限与调试成本。可表达的语句越多，系统需要为越多语义组合负责。\u003c/p>\u003cp>比如最低年龄 18 岁蕴含最低年龄 16 岁；反过来不成立。比较两条规格的严格程度，不等于拿当前几个用户各运行一次。对有限参数化规则可以推导，对任意代码则不能简单承诺。声明式能力应沿着实际问题增长，避免把“以后也许有用”变成今天必须维护的语言。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>如何判断重构确实获得了柔性\u003c/h2>\u003cp>看一项具体变化：增加“按实际贷款份额计算一种新费用”。如果调用者可以组合已有纯函数、清楚验证金额守恒，并只在明确的命令中改变状态，说明模型已经提供有用的能力。如果仍需深入多个对象，直接修改内部 Map，再补一组绕过规则的 setter，名称再漂亮也没有解决核心困难。\u003c/p>\u003cp>柔性的证据不是接口数量，而是能否在局部解释行为、用小范围输入验证规则、预测组合后的结果，并把变化限制在相关概念中。Share Pie 的故事把六个模式连在一起：明确概念后，命名、纯计算、契约、低依赖与可组合运算相互加强，最终让复杂交易读起来接近业务陈述。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模式\u003c/th>\u003cth>怎么做\u003c/th>\u003cth>怎样误用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>意图揭示接口\u003c/td>\u003ctd>用 reserve、allocate、satisfies 暴露目的\u003c/td>\u003ctd>命名精美但仍允许任意 setter 绕过规则\u003c/td>\u003c/tr>\u003ctr>\u003ctd>无副作用函数\u003c/td>\u003ctd>报价、比较与计算返回新值\u003c/td>\u003ctd>查询函数顺便占库存或发通知\u003c/td>\u003c/tr>\u003ctr>\u003ctd>断言 / 契约\u003c/td>\u003ctd>清楚写出前置、后置条件与不变量\u003c/td>\u003ctd>把生产校验只放在可关闭的 assert\u003c/td>\u003c/tr>\u003ctr>\u003ctd>概念轮廓\u003c/td>\u003ctd>沿真实概念和变化边界切分\u003c/td>\u003ctd>按代码行数平均拆类\u003c/td>\u003c/tr>\u003ctr>\u003ctd>独立类\u003c/td>\u003ctd>让可独立理解的值与规则少依赖外界\u003c/td>\u003ctd>强行把所有协作拆散成孤岛\u003c/td>\u003c/tr>\u003ctr>\u003ctd>操作闭包\u003c/td>\u003ctd>同类型输入经过运算仍得到同类值\u003c/td>\u003ctd>误解为语言中的闭包函数\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>深挖 · 无副作用，不代表整个系统无状态\u003c/h2>\u003cp>\u003ccode>priceFor(cargo)\u003c/code> 是计算；\u003ccode>reserve(slots)\u003c/code> 是状态变更。让两者边界清楚，组合时就不会因为“看了一眼价格”而锁住库存。需要修改实体时使用意图明确的命令，并记录失败语义。\u003c/p>\u003cp>Python 的 \u003ccode>assert\u003c/code> 在优化模式可能被关闭，Go 没有同等内建断言。业务输入与关键不变量应使用明确校验和错误返回；测试断言用来验证结果，不是生产规则的唯一防线。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · Closure of Operations 操作闭包\u003c/h2>\u003cp>Money + Money 返回 Money，规格 AND 规格返回规格，因而可以继续组合。这是代数意义上输入输出留在同一集合，不是捕获外部变量的 lexical closure。组合仍需明确适用范围：不同币种不直接相加，金额除法需要舍入。\u003c/p>\u003cp>原书在份额模型中继续探索实体与不可变值的选择，表明“实体还是值”可以随理解演化。不要因为第一版加了 ID，就认定它永远需要独立身份。\u003c/p>\u003c/section>\u003csection>\u003ch2>声明式设计 · 描述要求，交给机制执行\u003c/h2>\u003cp>例如“到东京且 12 月 1 日前到达”比在每个调用点拼条件更容易审核。若业务只需要 AND，不必同时实现 OR、NOT、优先级和脚本语言。更强表达力会带来更难的解释、调试与安全限制。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 接口评审的三个问题\u003c/h2>\u003cp>调用者是否必须知道内部算法才能正确调用？同样输入是否会因隐蔽副作用改变外部状态？一个局部业务规则变化会不会迫使无关模块修改？用这三问定位柔性不足，比统计设计模式数量有效。\u003c/p>\u003c/section>","answer":"报价返回金额、适用条件与有效期等值；提交预订时验证有效期或重新计算，并明确差价由用户确认还是按承诺价执行。拆开方法并不自动解决 TOCTOU；需要业务承诺和提交时校验。","quiz":[{"prompt":"操作闭包在本章指什么？","options":["函数捕获外部变量","领域运算结果仍可作为同类运算输入","把所有变量藏起来"],"answer":1,"why":"这是可组合性的代数性质，不是编程语言的闭包。"},{"prompt":"Python assert 能单独保护生产业务规则吗？","options":["能","不能，优化模式可移除，需显式校验","只有加类型注解才能"],"answer":1,"why":"业务校验应有可靠运行语义，测试断言负责验证这种语义。"}],"diagram":"","refs":["specpaper"],"caseTitle":"报价与预留分开后仍有时间窗口","caseContext":"quoteAndHold 同时计算报价并预留舱位。拆开可以消除隐藏副作用，但两次操作之间的价格变化仍需要业务契约处理。"},{"id":"11","n":11,"part":3,"title":"分析模式：借别人的洞察，不抄别人的世界","subtitle":"成熟模型是起点，仍要经过你的业务验证。","pages":"318–333","tags":["分析模式","Account","Entry","Posting Rule"],"body":"\u003csection>\u003ch2>重点 · 分析模式关注业务结构\u003c/h2>\u003cp>原书借助 Fowler 的 Account、Entry、Posting Rule 等概念讨论记账与批量入账。分析模式总结的是某类领域问题的模型及其后果；设计模式更多关注软件对象如何协作。两者可以配合，但层次不同。\u003c/p>\u003cp>例如一个简单余额字段很容易更新，却很难说明“这个余额为什么是这个数”。引入账目、分录和入账规则，可以使来源与更正更明确。这是业务解释能力的提升，不是因为类数量变多。\u003c/p>\u003c/section>\u003csection>\u003ch2>原书中的突破：应计与付款不是一对一关系\u003c/h2>\u003cp class=\"source-note\">原书案例转述：第 11 章 PDF 318–332 页。作者用经过虚构加工的故事解释模型选择，不应当作某个具名公司的生产系统记录。\u003c/p>\u003cp>原来的利息处理模型试图把每次利息计算与一次付款绑定起来。开发者借鉴 Account、Entry、Transaction 后，曾希望用 Transaction 把利息与付款配对。但专家指出，应计是在费用或收益发生时确认它，付款发生在另一个时点，而且两者并非简单的一对一关系。\u003c/p>\u003cp>因此，真正有帮助的不是一次引入全部会计术语，而是保留 Account 与 Entry，把应计与付款区分开：账户汇总相关分录，余额反映其合计结果，历史变化可以单独追踪。误用的 Transaction 概念反而被拿掉。模式帮助团队发现盲点，专家又帮助团队拒绝了不适合的部分。\u003c/p>\u003cp>原书还保留了实现的不完美：数据库规范与 ORM 能力迫使模型产生某些并不理想的细分。分析模式不是允许忽略实现约束的许可证；妥协应明确、局部化，并持续观察它是否阻碍业务表达。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>从“总额是多少”转向“总额为什么是这样”\u003c/h2>\u003cp>下面是海风航运的原创简化应收模型。某客户产生运费 1000 元，后来增加经批准的冷链附加费 200 元，客户支付 800 元。只存 \u003ccode>amount_due = 400\u003c/code> 能回答当前余额，却无法解释来源、顺序和调整依据。\u003c/p>\u003cp>采用分录后，账户依次记录应计 +1000、应计 +200、收款 −800，余额为 400。金额符号在这个教学模型中表示“增加或减少客户欠款”，不能直接与会计科目中的借贷方向画等号。每条分录还应记录身份、发生日期、业务来源与币种。不同币种不能相加后称作余额。\u003c/p>\u003cdiv class=\"model-strip\">\u003cdiv>\u003cstrong>运费应计\u003c/strong>\u003cspan>+1000，运输服务依据\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>附加费应计\u003c/strong>\u003cspan>+200，批准的费用调整\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>客户付款\u003c/strong>\u003cspan>−800，收款事实\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>应收余额\u003c/strong>\u003cspan>400，可追溯到三条记录\u003c/span>\u003c/div>\u003c/div>\u003cp>支付 800 元并不说明“第一张账单已结清”。如果需要指定冲抵哪张账单，还要引入付款分配关系，并定义部分分配、撤销分配等规则。不能把余额为零误认作每个争议都已解决。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>分录不删除，错误也必须有解释\u003c/h2>\u003cp>发现附加费应为 150 元时，可以冲正原 +200，再记入正确 +150，余额变成 350。这样能保留原决定、纠正原因与批准者。若直接把旧分录改成 150，历史账单和昨日余额就会悄悄变化。这里采用不可变已入账分录，是为审计与解释服务；尚未入账的草稿可以采用不同规则。\u003c/p>\u003cpre>\u003ccode>from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Entry:\n    entry_id: str\n    source_id: str\n    currency: str\n    signed_minor_units: int\n\n\ndef balance(entries, currency):\n    if any(e.currency != currency for e in entries):\n        raise ValueError(\"不可混合币种求余额\")\n    return sum(e.signed_minor_units for e in entries)\u003c/code>\u003c/pre>\u003cp>片段使用最小货币单位整数，省略了幂等、授权和存储。实际入账必须防止同一业务来源重复入账；冲正必须引用原分录，限制可冲正范围。余额可以实时求和，也可以缓存，但缓存值需要有清楚的更新协议与对账机制。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>Posting Rule 让入账依据摆到台面上\u003c/h2>\u003cp>原书进一步研究夜间批处理：哪些分录应该生成到哪些目标账户，什么时候触发，规则由谁选择。如果这些知识藏在批处理的循环与 if 中，脚本看似只是搬数据，实际已经承担了领域决策。\u003c/p>\u003cp>在教学案例中，先根据运输事实和合同算出冷链附加费，这一步属于计费规则。费用入账产生 Entry 后，另一条 Posting Rule 可以依据这条来源分录与已约定的代理合同，派生代理佣金台账中的应付分录。两步必须区分：前者把运输事实变成费用，后者显式表达账户之间的派生关系，不能把任何计算函数都叫 Posting Rule。目标台账中的佣金也不应再次增加客户应收。批处理负责触发与提交，规则负责说明采用哪些来源、生成什么金额及写入哪个目标账户。\u003c/p>\u003cp>原书 PDF 328 页区分三种触发：插入分录立即触发；由账户在收到指令时处理新增分录；由外部流程触发规则，再由规则寻找尚未处理的输入分录。第三种适合原书中的批处理选择。它们的差别不仅是快慢，还包括谁识别待处理输入、谁对启动负责。无论采用哪种，重复运行都不应重复生成同一笔派生结果；来源分录、规则版本及处理身份需要有清楚的约定。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>完整复式账本，比“余额加减”多出哪些约束\u003c/h2>\u003cp>上述模型只是客户应收视图。若要成为完整复式账本，还必须明确一笔记账事务涉及哪些账户、同币种借贷是否平衡、入账是否原子、期间何时关闭、跨币种交易怎样表示，以及谁有权限更正。账户体系需要包含所有来源与去向，否则不能宣称满足封闭系统的守恒。\u003c/p>\u003cp>同样，技术数据库事务与会计 Transaction 是不同概念。一次数据库提交可能保存一笔会计事务；分批处理又可能保存多个。相同英文词不会自动建立相同边界。借用成熟模式最重要的工作，是保留概念含义并确认约束，而非复制类图。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>何时值得借鉴，何时停在更简单的模型\u003c/h2>\u003cp>如果页面只是估算运费，用户不会依据它付款，且不需要解释历史调整，一个报价值可能足够。一旦业务需要逐项追溯、部分支付、费用更正和周期对账，分录模型就能把已有复杂度表达出来。它不是制造复杂度的理由。\u003c/p>\u003cp>分析模式带来的收益是少走一些已经有人走过的弯路，但每个业务仍需验证自己的限制。积分有过期，库存有批次和质检状态，现金有资金归属；这些差异可能改变不变量与生命周期。借鉴的是经过推敲的关系与后果，不是要求不同业务共用同一个万能账户。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 模式自带前提\u003c/h2>\u003cp>若借鉴会计式模型，要先说明货币、借贷、平衡范围、冲正、结算时间和审计需求。不能把“余额加减”包成 Entry 就声称实现了完整账本。模型中最宝贵的往往是约束，不是类名。\u003c/p>\u003cp>航运计费可以用费用项目、计费依据和调整记录解释账单。但若只做预估运费展示，引入完整复式记账可能过度。先以用例和风险决定模型深度。\u003c/p>\u003c/section>\u003csection>\u003ch2>原书提醒 · 改结构可以，偷改含义不行\u003c/h2>\u003cp>借来的术语如果在新场景里含义发生根本变化，应明确改名或说明差异。否则熟悉原模式的人会带着错误预期使用它。模式不是可随意贴在任何概念上的信誉标签。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 先写适配说明\u003c/h2>\u003cp>写一页对照：原模式解决的问题、这里相同之处、这里不同之处、保留的不变量、必须新增的约束。拿两条正常场景和两条异常场景验证。特别检查撤销、回补、历史修正和并发处理。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 看见金融词就套账本\u003c/h2>\u003cp>积分可能有过期、赠送、不可兑付等规则，与现金余额并不相同；仓储库存也未必适用完全相同的会计语义。可以借鉴“每次变化可解释”的思想，但要让领域专家确认新概念。\u003c/p>\u003c/section>","answer":"原账单或费用项保留，调整作为单独记录，包含金额、币种、原因、关联原项和授权人；当前应付由明确规则得出。更正通常通过反向记录或新的调整，而非抹掉历史。是否需要完整复式记账取决于业务与审计要求。","quiz":[{"prompt":"分析模式最应该复用什么？","options":["所有类与字段原封不动","解决问题的概念、约束与已知后果","原项目数据库"],"answer":1,"why":"模型要经过新领域的语义验证，复制结构不等于复用洞察。"},{"prompt":"借来的术语含义已经变了，应当？","options":["继续使用以显得专业","改名或清楚说明差异","不需要告诉团队"],"answer":1,"why":"通用语言需要可预测的含义，避免误导已有知识。"}],"diagram":"","refs":[],"caseTitle":"覆盖总额为什么丢失知识","caseContext":"费用调整后，只覆盖 total_amount 无法解释变化原因、原始费用和授权关系。"},{"id":"12","n":12,"part":3,"title":"设计模式：让政策可见，让结构贴合业务","subtitle":"模式应该解释业务，而不是抢走业务的名字。","pages":"334–347","tags":["Strategy","Policy","Composite","Flyweight"],"body":"\u003csection>\u003ch2>重点 · Strategy 也可以叫 Policy\u003c/h2>\u003cp>同样从上海到东京，有客户优先低成本，有客户优先低风险，有客户要求最快到达。将选择目标建模为路由政策，既帮助替换算法，也把业务决策显式表达出来。\u003c/p>\u003cp>若只有一个简单固定规则，普通函数就够。出现多个有业务意义、可独立讨论的选择时，再考虑策略接口。代码中的 RoutePolicy 比 GenericStrategyFactory 更容易与专家对话。\u003c/p>\u003c/section>\u003csection>\u003ch2>路线选择中的变化，到底发生在哪里\u003c/h2>\u003cp class=\"source-note\">原书第 12 章 PDF 335–339 页讨论路由政策；以下候选路线与数值为教学改编。\u003c/p>\u003cp>海风可以给同一票货选择三条路线：A 成本低但慢，B 快但贵，C 转运少、风险较低。如果函数到处判断 \u003ccode>mode == \"fast\"\u003c/code>，每一段搜索、排序与平分处理都要理解所有政策。新增“优先自营航次”时，稳定的搜索流程和可变的商业选择混在一起，修改范围越来越大。\u003c/p>\u003cp>策略模式把可变判断提取出来，但领域建模还要追问：这是业务认可的政策吗？谁选择政策？为什么对这个客户适用？称为 LowestCost 或 EarliestArrival，比 StrategyA 更容易讨论；相应接口表达的不是“任意算法插件”，而是“按某种政策评价可行路线”。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>先过硬约束，再比较软偏好\u003c/h2>\u003cp>要求全程冷链的货物，不应因为便宜就被分配到普通箱。把冷链资格和价格都压成一个总分，会出现低价抵消违规的结果。更稳妥的两阶段设计是：运输规格先判断是否可接受，政策再在可行候选中选择。\u003c/p>\u003cpre>\u003ccode>def choose_itinerary(candidates, specification, ranking_key):\n    feasible = [r for r in candidates\n                if specification.is_satisfied_by(r)]\n    if not feasible:\n        raise ValueError(\"没有满足承诺的路线\")\n    return min(feasible, key=ranking_key)\n\n# 两种政策都返回可比较键；route_id 让平分结果确定。\nlowest_cost = lambda r: (r.cost_minor_units, r.arrival, r.route_id)\nearliest_arrival = lambda r: (r.arrival, r.cost_minor_units, r.route_id)\u003c/code>\u003c/pre>\u003cp>片段展示选择语义，假定候选已使用统一币种和可比较时间。真实的大规模路由搜索可能无法先枚举所有路线；搜索算法需要在生成过程中利用约束剪枝，但仍应保留硬约束与偏好的语义区分。算法怎么执行，可以与业务如何解释结果不同。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>不能相加的量，不要硬凑成一个总分\u003c/h2>\u003cp>原书例子以航段的度量引导优化。适用时要检查可加性：航段费用通常可以求和，但总行程耗时还包括转运等待；风险可能相关，不能简单把百分比相加；“最多两次换船”也不是每段局部选择都能保证的。\u003c/p>\u003cp>如果业务确实愿意在价格与时间间折中，需要明确单位和权重含义，例如愿意为节省一天支付多少费用，而不是任意写 \u003ccode>price + hours * 0.7\u003c/code>。有时分层排序比加权总分更容易解释：先满足承诺，再优先低风险，最后在相同等级中选低价。\u003c/p>\u003cp>策略对象不自动负责政策治理。产生承诺时应能追溯采用了什么政策、什么版本与关键输入；价格表明天改变，不应让昨天的承诺在重新计算时失去依据。是否保存完整决策快照，取决于审计需求与数据规模，但理由必须能够复原。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>Composite 的转折：专家看到的路线不是一串平铺航段\u003c/h2>\u003cp>原书 PDF 341–346 页描述：开发者最初把运输路线看成任意长的航段列表，专家却把它分成逻辑段，不同人员可能在不同时间规划各段。门到门运输既有本地拖车，也有铁路、海运和中转，若每种层级都使用不同遍历方式，生成整个操作计划会越来越复杂。\u003c/p>\u003cp>共同点是：整体路线和子路线都把货物从一个地点移动到另一个地点。可以定义共同的 Route 抽象：叶子表示一段运输，组合表示若干子路线。需要总览的调用者只关心起点、终点和展开后的操作；需要安排门段的人仍能找到对应子路线。统一接口没有抹去业务差异，而是抽出对这类使用者有用的共同语义。\u003c/p>\u003cdiv class=\"model-strip\">\u003cdiv>\u003cstrong>完整运输\u003c/strong>\u003cspan>客户仓库 → 收货仓库\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>逻辑子路线\u003c/strong>\u003cspan>提货、主运输、交付\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>具体航段\u003c/strong>\u003cspan>拖车、铁路、海运等\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003csection>\u003ch2>组合结构必须兑现组合行为\u003c/h2>\u003cp>一个树形结构还不够。组合后，第一段起点应成为整体起点，最后一段终点成为整体终点，相邻子路线的地点与时间必须衔接。费用能否相加取决于是否有跨段折扣；时长不能忽略等待。若每一种查询都需要调用者识别所有内部节点类型，所谓统一接口就没有带来真正的组合能力。\u003c/p>\u003cp>是否允许部分尚未规划，也是重要选择。一个“运输方案草稿”可以留空门段，而一个“已确认行程”可能要求完整。不要为了复用 Composite 而让已确认对象也可以任意缺段；可分别定义草稿与可承诺的行程，或在确认动作处验证完整性。\u003c/p>\u003cp>工程上还应防止循环引用导致无限遍历，并留意过深树结构与重复计算。不可变子路线方便安全共享；可变共享子路线则可能让修改一票货影响其他货物。模式名字本身不替代这些约束。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>技术模式有价值，却不必全变成领域术语\u003c/h2>\u003cp>Flyweight 可以减少重复对象占用，缓存可以减少查询，适配器可以连接外部服务。它们都可能改善实现，但领域专家未必需要使用这些词。只有当模式表达了真实业务概念时，才值得进入通用语言。\u003c/p>\u003cp>选模式时可以先读出它支持的业务句子：“按低成本政策选择可行路线”“整条路线由可独立规划的子路线组成”。如果只能说“便于扩展”和“符合设计原则”，而没有具体变化与协作问题，普通函数与数据结构可能已经足够。模式应该让当前模型更容易理解，不能成为模型需要额外背负的术语。\u003c/p>\u003c/section>\u003cdiv class=\"code-pair\">\u003cdiv data-lang=\"go\">\u003cpre>\u003ccode>type RoutePolicy interface {\n    Score(Route) int // 示例：先明确单位、偏好与平分规则\n}\nfunc Choose(routes []Route, p RoutePolicy) Route {\n    // 示意：按政策排序；空集合与不可行路线须显式处理。\n    return bestFeasible(routes, p)\n}\u003c/code>\u003c/pre>\u003c/div>\u003cdiv data-lang=\"python\">\u003cpre>\u003ccode>def choose_route(routes, score):\n    feasible = [r for r in routes if r.feasible]\n    if not feasible:\n        raise ValueError(&quot;没有可行路线&quot;)\n    return min(feasible, key=score)\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003csection>\u003ch2>重点 · Composite 需要真实的部分—整体含义\u003c/h2>\u003cp>路线可以由子路线或航段构成，组合后的整体也能回答起点、终点、总时间等问题。这类语义适合 Composite。组合还必须保护航段连续性、时间可接续等规则；树状数据不自动满足这些要求。\u003c/p>\u003cp>若只是用树状 UI 展示文件夹，就不必把它解释成核心领域突破。设计模式与领域模型发生联系，是因为业务本身存在对应结构与行为。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 为什么原书还谈 Flyweight？\u003c/h2>\u003cp>Flyweight 可能用于节省内存，但通常是实现层面的选择，不会自然进入业务语言。它有技术价值，却不意味着领域专家必须掌握它。区分“模型概念”与“实现技巧”，团队讨论会更清楚。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 策略接口替代不了规则治理\u003c/h2>\u003cp>可替换算法不能解决规则版本、适用客户、启用时间和回溯解释。若政策会在业务运行中切换，应记录当时采用的版本与重要输入，避免同一笔账今天重新计算得到不同结果却说不清原因。\u003c/p>\u003c/section>","answer":"先按运输规格排除不合格路线，再由策略在可行集合中排序。若无可行方案，返回无法满足，不应选“分数最接近”的违约路线。政策应明确平分、时区、价格单位和版本。","quiz":[{"prompt":"冷链不合格路线但价格最便宜，怎么处理？","options":["高分抵消不合格","先按硬约束剔除，再优化","默认给用户"],"answer":1,"why":"资格与偏好属于不同决策层，不应混成可互相抵消的分数。"},{"prompt":"Flyweight 一定是领域概念吗？","options":["是，所有模式都是","通常是技术优化，需看业务语义","只有 Java 才是"],"answer":1,"why":"技术设计可以服务模型，而不必成为通用语言。"}],"diagram":"spec","quote":["A design pattern should be applied only when it is needed.","只有真正需要时，才应应用一个设计模式。",347],"refs":[],"caseTitle":"便宜不能抵消不合格","caseContext":"两种路由政策分别偏好价格与时效，但冷链资格是不可被分数抵消的硬约束。"},{"id":"13","n":13,"part":3,"title":"向更深洞察重构：把学习变成团队节奏","subtitle":"代码可以很干净，模型仍然可能不对。","pages":"348–353","tags":["探索小组","模型重构","特征测试","渐进迁移"],"body":"\u003csection>\u003ch2>重点 · 三类重构信号\u003c/h2>\u003cp>第一，团队已经理解得更深，但模型落后；第二，重要概念藏在条件分支和参数里；第三，关键部分难以组合，修改牵连过大。它们比“类太长”更贴近模型层面的重构。\u003c/p>\u003cp>原书建议以小范围探索、讨论和代码实验形成共识，不需要专门设立长期建模委员会。最关键的参与者是懂真实业务的人和理解实现代价的人。\u003c/p>\u003c/section>\u003csection>\u003ch2>整洁代码也可能忠实表达了错误模型\u003c/h2>\u003cp class=\"source-note\">原书第 13 章 PDF 348–353 页讨论持续洞察与重构；下述支付、迁移与双写案例属于现代工程教学补充。\u003c/p>\u003cp>一个 Order 类可以命名规范、函数很短、测试齐全，却仍坚持“订单只能有一笔付款”。当客户开始分期支付，开发者增加 first_payment、second_payment、remaining_payment，代码可以继续被重构得很整洁，但概念已经不合适。\u003c/p>\u003cp>此时真正的变化是付款具有自己的身份、发生时间和结果；订单记录应付金额，付款分配说明某笔收款用于冲抵哪项债务。新增概念不一定立即意味着拆服务，也不一定意味着所有旧字段当日删除。它首先改变的是团队如何解释事实。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>比较两个模型，应让同一批事实穿过它们\u003c/h2>\u003cp>旧模型面对“支付超时”可能只保存 failed；新模型需要区分尚不确定与确已失败，因为支付机构可能已经收款。同一笔付款再次通知，不能重复冲抵；用户付多了，也不应偷偷把多余金额丢掉。正常付款、部分付款、重复通知、退款和超额付款一起构成模型的试金石。\u003c/p>\u003cp>讨论的结果不必是一个马上完整实现的财务系统。可以先只支持同币种、单订单关联和人工处理超额，明确保留限制。好的新模型不仅能容纳未来，还要让当前决定清楚。无法解释近期真实问题的远景抽象，没有理由要求团队付出大迁移成本。\u003c/p>\u003cp>原书建议小组用短时讨论、图示与实现实验来探索，必要时隔几天再看。人数与会议长度只是案例经验，关键是同时拥有业务细节和实现反馈。若数次讨论仍毫无收敛，应缩小问题，而不是扩大图纸。\u003c/p>\u003c/section>\n\u003csect
