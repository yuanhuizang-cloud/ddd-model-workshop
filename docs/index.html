AAA8KgJAAAAwKMmAAAAAI+aAAAAADxqAgAAAPCoCQAAAMCjJgAAAACPmgAAAAA8agIAAADwqAkAAADAoyYAAAAAT75uwKR8vdEXAAAAAElFTkSuQmCC"}},"files":{"README.md":"# DDD 模型工坊 · 订舱代码案例\n\n三个实现展示不同层次的业务规则与一致性协议。代码仅依赖标准库，无需联网；测试使用临时数据库。\n\n## Python 3.9+\n\n```sh\ncd python\npython3 -m unittest -v\n```\n\n- `model.py`：容量领域模型与预订命令。\n- `booking.py`：乐观版本、幂等回执、业务状态与 Outbox 的 SQLite 原子提交。\n- `lifecycle.py`：预留、确认、取消、过期、可恢复扫描、单工作者 Relay、Inbox 去重和状态快照投影。\n- `test_booking.py` 与 `test_lifecycle.py`：规则边界、并发争抢、重复命令、回滚、发送后崩溃重发、乱序投影。\n\n生命周期示例中，ACTIVE 和 CONFIRMED 占用容量；CANCELLED 和 EXPIRED 不占容量。确认要求服务端时间严格早于截止时间；取消和过期重复执行不得再次释放。容量、预订、回执和待发事件在本地事务内一起提交。\n\n`lifecycle.py` 使用 SQLite 的 BEGIN IMMEDIATE 串行化写入，与 `booking.py` 的加载快照再条件提交形成对照。不要将 SQLite 的写锁粒度当作 PostgreSQL 等数据库的通用行为。\n\n消息交付用回调连接两个 SQLite 数据库，未接入真实 MQ。Relay 发送后、标记前崩溃会重发；Inbox 与本地投影同事务提交。较新版本覆盖较旧版本只适用于此处的完整状态快照，不能直接用于金额增量事件。\n\n## Go 1.22+\n\n```sh\ncd go\ngo test -race ./...\n```\n\n- `booking.go`：容量规则、值快照、版本检测、幂等与原子内存提交。\n- `booking_test.go`：边界、冲突、并发与重复意图。\n\n内存适配器使用 mutex，进程退出即丢失，不提供持久化消息保证。Go 示例聚焦初始预订；生命周期扩展在 Python 示例中串讲。\n\n## 阅读顺序\n\n先读模型如何表达一条规则，再看提交协议如何保护它，最后沿测试观察失败时间线。网站第 6、19、20 章分别解释聚合边界、一致性机制与完整用例。\n\n## 实现范围\n\n案例是单租户、单航次、整数容量的教学实现，未包括认证授权、退款、履约后取消、真实 MQ、外部支付、规则迁移、分布式时钟协议及生产监控。取消已确认预订是本案例的业务约定，不是所有订舱业务的通则。到期扫描示例面向小数据量，生产需要适当索引、分批、任务领取与监控。\n\n可执行测试验证本实现的协议，不代表其他数据库和基础设施会自动提供相同保证。\n","go/booking.go":"// Package booking 演示领域聚合和内存事务适配器；无持久性保证。\npackage booking\n\nimport (\n\t\"errors\"\n\t\"sync\"\n)\n\nvar ErrRule = errors.New(\"领域规则不满足\")\nvar ErrConflict = errors.New(\"版本冲突\")\nvar ErrKeyReuse = errors.New(\"幂等键参数不同\")\n\ntype Voyage struct {\n\tid                          string\n\tcapacity, reserved, version int\n}\n\nfunc NewVoyage(id string, capacity int) (Voyage, error) {\n\tif id == \"\" || capacity \u003c 0 {\n\t\treturn Voyage{}, ErrRule\n\t}\n\treturn Voyage{id: id, capacity: capacity}, nil\n}\nfunc (v *Voyage) Reserve(slots int) error {\n\tif slots \u003c= 0 || slots > v.capacity-v.reserved {\n\t\treturn ErrRule\n\t}\n\tv.reserved += slots\n\treturn nil\n}\nfunc (v Voyage) Reserved() int { return v.reserved }\n\ntype Command struct {\n\tID, VoyageID string\n\tSlots        int\n}\ntype Event struct {\n\tID, VoyageID             string\n\tSlots, Reserved, Version int\n}\ntype receipt struct {\n\tcommand Command\n\tresult  Event\n}\n\n// Store 的互斥锁仅保护提交边界；领域决策针对快照进行。\n// 生产环境应把版本条件更新、幂等记录、outbox 放在数据库同一事务中。\ntype Store struct {\n\tmu       sync.Mutex\n\tvoyages  map[string]Voyage\n\treceipts map[string]receipt\n\toutbox   []Event\n}\n\nfunc NewStore(v Voyage) *Store {\n\treturn &Store{voyages: map[string]Voyage{v.id: v}, receipts: map[string]receipt{}}\n}\nfunc (s *Store) Load(id string) (Voyage, error) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\tv, ok := s.voyages[id]\n\tif !ok {\n\t\treturn Voyage{}, ErrRule\n\t}\n\treturn v, nil\n}\nfunc (s *Store) replay(cmd Command) (Event, bool, error) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\tr, ok := s.receipts[cmd.ID]\n\tif !ok {\n\t\treturn Event{}, false, nil\n\t}\n\tif r.command != cmd {\n\t\treturn Event{}, true, ErrKeyReuse\n\t}\n\treturn r.result, true, nil\n}\nfunc (s *Store) Commit(v Voyage, expected int, cmd Command) (Event, error) {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\tif r, ok := s.receipts[cmd.ID]; ok {\n\t\tif r.command != cmd {\n\t\t\treturn Event{}, ErrKeyReuse\n\t\t}\n\t\treturn r.result, nil\n\t}\n\tcurrent, ok := s.voyages[v.id]\n\tif !ok || current.version != expected {\n\t\treturn Event{}, ErrConflict\n\t}\n\tv.version = expected + 1\n\tevent := Event{cmd.ID, v.id, cmd.Slots, v.reserved, v.version}\n\ts.voyages[v.id] = v\n\ts.receipts[cmd.ID] = receipt{cmd, event}\n\ts.outbox = append(s.outbox, event)\n\treturn event, nil\n}\nfunc (s *Store) Events() []Event {\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\treturn append([]Event(nil), s.outbox...)\n}\n\n// Book 是应用服务：协调重放、加载、领域行为与提交。\nfunc Book(s *Store, cmd Command) (Event, error) {\n\tif cmd.ID == \"\" || cmd.VoyageID == \"\" || cmd.Slots \u003c= 0 {\n\t\treturn Event{}, ErrRule\n\t}\n\tfor attempt := 0; attempt \u003c 5; attempt++ {\n\t\tif event, found, err := s.replay(cmd); found {\n\t\t\treturn event, err\n\t\t}\n\t\tv, err := s.Load(cmd.VoyageID)\n\t\tif err != nil {\n\t\t\treturn Event{}, err\n\t\t}\n\t\texpected := v.version\n\t\tif err = v.Reserve(cmd.Slots); err != nil {\n\t\t\tif event, found, replayErr := s.replay(cmd); found {\n\t\t\t\treturn event, replayErr\n\t\t\t}\n\t\t\treturn Event{}, err\n\t\t}\n\t\tevent, err := s.Commit(v, expected, cmd)\n\t\tif errors.Is(err, ErrConflict) {\n\t\t\tcontinue\n\t\t}\n\t\treturn event, err\n\t}\n\treturn Event{}, ErrConflict\n}\n","go/booking_test.go":"package booking\n\nimport (\n\t\"errors\"\n\t\"sync\"\n\t\"testing\"\n)\n\nfunc setup(t *testing.T) *Store {\n\tt.Helper()\n\tv, err := NewVoyage(\"V001\", 10)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn NewStore(v)\n}\nfunc TestInvariants(t *testing.T) {\n\tfor _, slots := range []int{-1, 0, 11} {\n\t\tv, _ := NewVoyage(\"v\", 10)\n\t\tif !errors.Is(v.Reserve(slots), ErrRule) {\n\t\t\tt.Fatal(slots)\n\t\t}\n\t}\n\tv, _ := NewVoyage(\"v\", 10)\n\tif v.Reserve(10) != nil || v.Reserved() != 10 {\n\t\tt.Fatal(v)\n\t}\n}\nfunc TestReplayAndMismatch(t *testing.T) {\n\ts := setup(t)\n\tcmd := Command{\"a\", \"V001\", 10}\n\ta, err := Book(s, cmd)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tb, err := Book(s, cmd)\n\tif err != nil || a != b || len(s.Events()) != 1 {\n\t\tt.Fatal(a, b, err)\n\t}\n\t_, err = Book(s, Command{\"a\", \"V001\", 3})\n\tif !errors.Is(err, ErrKeyReuse) {\n\t\tt.Fatal(err)\n\t}\n}\nfunc TestConflict(t *testing.T) {\n\ts := setup(t)\n\ta, _ := s.Load(\"V001\")\n\tb, _ := s.Load(\"V001\")\n\ta.Reserve(6)\n\tb.Reserve(6)\n\tif _, err := s.Commit(a, 0, Command{\"a\", \"V001\", 6}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif _, err := s.Commit(b, 0, Command{\"b\", \"V001\", 6}); !errors.Is(err, ErrConflict) {\n\t\tt.Fatal(err)\n\t}\n}\nfunc TestConcurrentBooking(t *testing.T) {\n\ts := setup(t)\n\tvar wg sync.WaitGroup\n\tresult := make(chan error, 2)\n\tfor _, id := range []string{\"a\", \"b\"} {\n\t\twg.Add(1)\n\t\tgo func(id string) { defer wg.Done(); _, err := Book(s, Command{id, \"V001\", 6}); result \u003c- err }(id)\n\t}\n\twg.Wait()\n\tclose(result)\n\tsuccesses := 0\n\tfor err := range result {\n\t\tif err == nil {\n\t\t\tsuccesses++\n\t\t} else if !errors.Is(err, ErrRule) {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tv, _ := s.Load(\"V001\")\n\tif successes != 1 || v.Reserved() != 6 || len(s.Events()) != 1 {\n\t\tt.Fatal(successes, v)\n\t}\n}\nfunc TestConcurrentDuplicate(t *testing.T) {\n\ts := setup(t)\n\tvar wg sync.WaitGroup\n\tresult := make(chan error, 2)\n\tfor i := 0; i \u003c 2; i++ {\n\t\twg.Add(1)\n\t\tgo func() { defer wg.Done(); _, err := Book(s, Command{\"same\", \"V001\", 10}); result \u003c- err }()\n\t}\n\twg.Wait()\n\tclose(result)\n\tfor err := range result {\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\tif len(s.Events()) != 1 {\n\t\tt.Fatal(s.Events())\n\t}\n}\n","go/go.mod":"module ddd-workshop\n\ngo 1.22\n","python/booking.py":"\"\"\"SQLite 教学适配器：聚合状态、幂等结果、outbox 同事务提交。\n未实现发件器/消费者；持久化不等于消息已送达。\n\"\"\"\nimport json\nimport sqlite3\nfrom model import Book, Voyage, Conflict, RuleViolation\n\n\ndef connect(path):\n    c = sqlite3.connect(path, timeout=5, isolation_level=None)\n    c.execute('PRAGMA busy_timeout=5000')\n    return c\n\n\ndef initialize(path):\n    with connect(path) as c:\n        c.executescript('''\n        CREATE TABLE IF NOT EXISTS voyages (\n          id TEXT PRIMARY KEY, capacity INTEGER NOT NULL CHECK(capacity>=0),\n          reserved INTEGER NOT NULL CHECK(reserved>=0 AND reserved\u003c=capacity),\n          version INTEGER NOT NULL);\n        CREATE TABLE IF NOT EXISTS commands (\n          id TEXT PRIMARY KEY, voyage_id TEXT NOT NULL,\n          slots INTEGER NOT NULL, result TEXT NOT NULL);\n        CREATE TABLE IF NOT EXISTS outbox (\n          id TEXT PRIMARY KEY, payload TEXT NOT NULL);\n        ''')\n        c.execute('INSERT OR IGNORE INTO voyages VALUES (?, ?, ?, ?)',\n                  ('V001', 10, 0, 0))\n\n\ndef load(c, voyage_id):\n    row = c.execute('SELECT id, capacity, reserved, version FROM voyages WHERE id=?',\n                    (voyage_id,)).fetchone()\n    if row is None:\n        raise RuleViolation('航次不存在')\n    return Voyage(*row)\n\n\ndef commit(c, voyage, expected_version, cmd, before_commit=lambda: None):\n    c.execute('BEGIN IMMEDIATE')\n    try:\n        old = c.execute('SELECT voyage_id, slots, result FROM commands WHERE id=?',\n                        (cmd.command_id,)).fetchone()\n        if old:\n            if old[:2] != (cmd.voyage_id, cmd.slots):\n                raise RuleViolation('幂等键复用但参数不同')\n            c.commit()\n            return json.loads(old[2])\n        updated = c.execute('''UPDATE voyages SET reserved=?, version=version+1\n          WHERE id=? AND version=?''',\n          (voyage.reserved, voyage.id, expected_version)).rowcount\n        if updated != 1:\n            raise Conflict('并发版本冲突')\n        result = {'event_id': cmd.command_id, 'type': 'SlotsReserved',\n                  'voyage_id': voyage.id, 'slots': cmd.slots,\n                  'reserved': voyage.reserved, 'version': expected_version + 1}\n        payload = json.dumps(result, ensure_ascii=False)\n        c.execute('INSERT INTO commands VALUES (?, ?, ?, ?)',\n                  (cmd.command_id, cmd.voyage_id, cmd.slots, payload))\n        c.execute('INSERT INTO outbox VALUES (?, ?)', (cmd.command_id, payload))\n        before_commit()  # 测试在提交前注入故障，验证三个写入全部回滚\n        c.commit()\n        return result\n    except BaseException:\n        c.rollback()\n        raise\n\n\ndef book(path, cmd: Book, before_commit=lambda: None):\n    cmd.validate()\n    c = connect(path)\n    try:\n        for _ in range(5):\n            # 重放必须先于领域验证，否则售罄后重试已成功命令会被错误拒绝。\n            old = c.execute('SELECT voyage_id, slots, result FROM commands WHERE id=?',\n                            (cmd.command_id,)).fetchone()\n            if old:\n                if old[:2] != (cmd.voyage_id, cmd.slots):\n                    raise RuleViolation('幂等键复用但参数不同')\n                return json.loads(old[2])\n            v = load(c, cmd.voyage_id)\n            version = v.version\n            try:\n                v.reserve(cmd.slots)\n            except RuleViolation:\n                # 同一命令可能刚被另一个请求提交，先重新确认幂等结果。\n                old = c.execute('SELECT voyage_id, slots, result FROM commands WHERE id=?',\n                                (cmd.command_id,)).fetchone()\n                if old and old[:2] == (cmd.voyage_id, cmd.slots):\n                    return json.loads(old[2])\n                raise\n            try:\n                return commit(c, v, version, cmd, before_commit)\n            except Conflict:\n                continue  # 重新加载并重新校验规则，禁止盲目重放旧快照\n        raise Conflict('重试耗尽；调用方应退避或返回可重试错误')\n    finally:\n        c.close()\n","python/lifecycle.py":"\"\"\"订舱生命周期：领域状态机 + SQLite 原子用例 + 幂等 + Outbox/Inbox。\n所有时间由服务端传入的整数 UTC 秒表示，测试使用逻辑时钟。\n演示为单租户、单航次数据库；无真实 MQ 或付款服务。\n\"\"\"\nfrom dataclasses import dataclass, replace\nimport json\nimport sqlite3\nfrom contextlib import closing\n\n\nclass Rejected(Exception):\n    pass\n\n\n@dataclass(frozen=True)\nclass Reservation:\n    id: str\n    slots: int\n    expires_at: int\n    state: str = 'ACTIVE'\n    version: int = 1\n\n    def change(self, action, now):\n        \"\"\"返回 (新状态, 容量释放量)。未变化的请求不产生新事实。\"\"\"\n        if action == 'confirm':\n            if self.state == 'CONFIRMED':\n                return self, 0\n            if self.state != 'ACTIVE' or now >= self.expires_at:\n                raise Rejected('预留已结束或超过确认截止时间')\n            return replace(self, state='CONFIRMED', version=self.version + 1), 0\n        if action == 'cancel':\n            if self.state in ('CANCELLED', 'EXPIRED'):\n                return self, 0\n            # 本场景允许已确认但尚未履约的预订取消；不涉及退款。\n            return replace(self, state='CANCELLED', version=self.version + 1), self.slots\n        if action == 'expire':\n            if self.state != 'ACTIVE':\n                return self, 0\n            if now \u003c self.expires_at:\n                raise Rejected('尚未到期')\n            return replace(self, state='EXPIRED', version=self.version + 1), self.slots\n        raise Rejected('未知操作')\n\n\n@dataclass(frozen=True)\nclass Command:\n    command_id: str\n    action: str\n    reservation_id: str\n    slots: int = 0\n    expires_at: int = 0\n\n    def fingerprint(self):\n        if not self.command_id or not self.reservation_id:\n            raise Rejected('命令和预订身份不能为空')\n        if self.action not in ('hold', 'confirm', 'cancel', 'expire'):\n            raise Rejected('未知操作')\n        if self.action != 'hold' and (self.slots != 0 or self.expires_at != 0):\n            raise Rejected('只有 hold 接受数量与截止时间')\n        return json.dumps([self.action, self.reservation_id, self.slots,\n                           self.expires_at], separators=(',', ':'))\n\n\ndef connect(path):\n    return sqlite3.connect(path, timeout=10, isolation_level=None)\n\n\ndef initialize(path, capacity=10):\n    if type(capacity) is not int or capacity \u003c 0:\n        raise Rejected('容量必须是非负整数')\n    with closing(connect(path)) as c:\n        c.executescript('''\n        CREATE TABLE IF NOT EXISTS capacity (\n          id INTEGER PRIMARY KEY CHECK(id=1), total INTEGER NOT NULL,\n          reserved INTEGER NOT NULL CHECK(reserved>=0 AND reserved\u003c=total));\n        CREATE TABLE IF NOT EXISTS reservations (\n          id TEXT PRIMARY KEY, slots INTEGER NOT NULL CHECK(slots>0),\n          expires_at INTEGER NOT NULL, state TEXT NOT NULL\n          CHECK(state IN ('ACTIVE','CONFIRMED','CANCELLED','EXPIRED')),\n          version INTEGER NOT NULL);\n        CREATE TABLE IF NOT EXISTS receipts (\n          id TEXT PRIMARY KEY, fingerprint TEXT NOT NULL, result TEXT NOT NULL);\n        CREATE TABLE IF NOT EXISTS events (\n          seq INTEGER PRIMARY KEY AUTOINCREMENT, event_id TEXT UNIQUE NOT NULL,\n          payload TEXT NOT NULL, sent INTEGER NOT NULL DEFAULT 0);\n        CREATE TABLE IF NOT EXISTS inbox (\n          consumer TEXT NOT NULL, event_id TEXT NOT NULL, payload TEXT NOT NULL,\n          PRIMARY KEY(consumer,event_id));\n        CREATE TABLE IF NOT EXISTS projection (\n          consumer TEXT NOT NULL, reservation_id TEXT NOT NULL,\n          version INTEGER NOT NULL, state TEXT NOT NULL,\n          PRIMARY KEY(consumer,reservation_id));\n        ''')\n        c.execute('INSERT OR IGNORE INTO capacity VALUES (1,?,0)', (capacity,))\n\n\ndef execute(path, cmd, now, before_commit=lambda: None):\n    \"\"\"BEGIN IMMEDIATE 先取得写权限，串行化本 SQLite 数据库写入。\n    不能把这种锁粒度当成生产关系数据库的通用结论。\n    \"\"\"\n    fingerprint = cmd.fingerprint()\n    if type(now) is not int:\n        raise Rejected('服务端时间必须为整数秒')\n    with closing(connect(path)) as c:\n        c.execute('BEGIN IMMEDIATE')\n        try:\n            old = c.execute('SELECT fingerprint,result FROM receipts WHERE id=?',\n                            (cmd.command_id,)).fetchone()\n            if old:\n                if old[0] != fingerprint:\n                    raise Rejected('同一幂等键对应不同业务参数')\n                c.commit()\n                return json.loads(old[1])\n            row = c.execute('SELECT id,slots,expires_at,state,version '\n                            'FROM reservations WHERE id=?',\n                            (cmd.reservation_id,)).fetchone()\n            if cmd.action == 'hold':\n                if row:\n                    raise Rejected('预订身份已存在')\n                if type(cmd.slots) is not int or cmd.slots \u003c= 0:\n                    raise Rejected('数量必须为正整数')\n                if type(cmd.expires_at) is not int or cmd.expires_at \u003c= now:\n                    raise Rejected('截止时间必须在未来')\n                changed = c.execute('UPDATE capacity SET reserved=reserved+? '\n                                    'WHERE id=1 AND reserved+?\u003c=total',\n                                    (cmd.slots, cmd.slots)).rowcount\n                if changed != 1:\n                    raise Rejected('容量不足')\n                new = Reservation(cmd.reservation_id, cmd.slots, cmd.expires_at)\n                c.execute('INSERT INTO reservations VALUES (?,?,?,?,?)',\n                          (new.id,new.slots,new.expires_at,new.state,new.version))\n            else:\n                if not row:\n                    raise Rejected('预订不存在')\n                original = Reservation(*row)\n                new, released = original.change(cmd.action, now)\n                changed = new != original\n                if changed:\n                    c.execute('UPDATE reservations SET state=?,version=? WHERE id=?',\n                              (new.state,new.version,new.id))\n                    c.execute('UPDATE capacity SET reserved=reserved-? WHERE id=1',\n                              (released,))\n            result = {'reservation_id':new.id, 'state':new.state,\n                      'version':new.version, 'changed':bool(changed)}\n            if changed:\n                event = {'event_id':cmd.command_id,'type':'ReservationStateChanged',\n                         'schema_version':1,'reservation_id':new.id,'state':new.state,\n                         'version':new.version,'occurred_at':now}\n                c.execute('INSERT INTO events(event_id,payload) VALUES (?,?)',\n                          (cmd.command_id,json.dumps(event,sort_keys=True)))\n            c.execute('INSERT INTO receipts VALUES (?,?,?)',\n                      (cmd.command_id,fingerprint,json.dumps(result)))\n            before_commit()\n            c.commit()\n            return result\n        except BaseException:\n            c.rollback()\n            raise\n\n\ndef consume(path, event, consumer='booking-screen', before_commit=lambda: None):\n    \"\"\"状态快照投影：版本更大才覆盖。不能用于金额增量/必须逐件处理的事件。\"\"\"\n    required = {'event_id','type','schema_version','reservation_id','state','version'}\n    if not required \u003c= event.keys() or event['schema_version'] != 1:\n        raise Rejected('不支持的消息契约')\n    if (event['type'] != 'ReservationStateChanged'\n            or event['state'] not in ('ACTIVE','CONFIRMED','CANCELLED','EXPIRED')\n            or type(event['version']) is not int or event['version'] \u003c 1\n            or not event['event_id'] or not event['reservation_id']):\n        raise Rejected('非法状态消息')\n    payload = json.dumps(event,sort_keys=True)\n    with closing(connect(path)) as c:\n        c.execute('BEGIN IMMEDIATE')\n        try:\n            old = c.execute('SELECT payload FROM inbox WHERE consumer=? AND event_id=?',\n                            (consumer,event['event_id'])).fetchone()\n            if old:\n                if old[0] != payload:\n                    raise Rejected('同一事件身份对应不同载荷')\n                c.commit()\n                return False\n            c.execute('INSERT INTO inbox VALUES (?,?,?)',\n                      (consumer,event['event_id'],payload))\n            c.execute('''INSERT INTO projection VALUES (?,?,?,?)\n              ON CONFLICT(consumer,reservation_id) DO UPDATE SET\n              version=excluded.version,state=excluded.state\n              WHERE excluded.version>projection.version''',\n              (consumer,event['reservation_id'],event['version'],event['state']))\n            before_commit()\n            c.commit()\n            return True\n        except BaseException:\n            c.rollback()\n            raise\n\n\ndef relay_once(path, deliver, after_send=lambda: None):\n    \"\"\"单工作者示例；实际网络交付发生在数据库事务之外。\n    deliver 返回表示下游已持久接收；若返回后崩溃，下次会重复发送。\n    \"\"\"\n    with closing(connect(path)) as c:\n        rows = c.execute('SELECT seq,payload FROM events WHERE sent=0 ORDER BY seq').fetchall()\n    for seq, payload in rows:\n        deliver(json.loads(payload))\n        after_send()\n        with closing(connect(path)) as c:\n            c.execute('UPDATE events SET sent=1 WHERE seq=?', (seq,))\n    return len(rows)\n\n\ndef expire_due(path, now):\n    \"\"\"定期可恢复扫描；执行时再次判断，查询后确认成功不会被覆盖。\"\"\"\n    with closing(connect(path)) as c:\n        due = c.execute(\"SELECT id FROM reservations WHERE state='ACTIVE' \"\n                        'AND expires_at\u003c=?', (now,)).fetchall()\n    for (reservation_id,) in due:\n        # 在本示例中 ID 永不重用，故截止任务的业务键稳定。\n        execute(path, Command('expiry:'+reservation_id,'expire',reservation_id),now)\n    return len(due)\n","python/model.py":"\"\"\"DDD 教学：领域对象不依赖数据库。单位是不可拆分的舱位。\"\"\"\nfrom dataclasses import dataclass\n\n\nclass RuleViolation(ValueError):\n    pass\n\n\nclass Conflict(Exception):\n    pass\n\n\n@dataclass(frozen=True)\nclass Book:\n    command_id: str\n    voyage_id: str\n    slots: int\n\n    def validate(self):\n        if not self.command_id or not self.voyage_id:\n            raise RuleViolation('命令 ID 和航次 ID 不能为空')\n        if type(self.slots) is not int or self.slots \u003c= 0:\n            raise RuleViolation('舱位必须是正整数')\n\n\n@dataclass\nclass Voyage:\n    id: str\n    capacity: int\n    reserved: int = 0\n    version: int = 0\n\n    def __post_init__(self):\n        if (type(self.capacity) is not int or type(self.reserved) is not int\n                or self.capacity \u003c 0 or not 0 \u003c= self.reserved \u003c= self.capacity):\n            raise RuleViolation('无效航次状态')\n\n    def reserve(self, slots: int):\n        if type(slots) is not int or slots \u003c= 0:\n            raise RuleViolation('舱位必须是正整数')\n        if slots > self.capacity - self.reserved:\n            raise RuleViolation('舱位不足')\n        self.reserved += slots\n","python/test_booking.py":"import os\nimport tempfile\nimport unittest\nfrom concurrent.futures import ThreadPoolExecutor\nfrom booking import initialize, connect, load, commit, book\nfrom model import Book, Voyage, Conflict, RuleViolation\n\n\nclass BookingTests(unittest.TestCase):\n    def setUp(self):\n        self.tmp = tempfile.TemporaryDirectory()\n        self.path = os.path.join(self.tmp.name, 'booking.sqlite')\n        initialize(self.path)\n\n    def tearDown(self):\n        self.tmp.cleanup()\n\n    def test_domain_boundaries(self):\n        for slots in [0, -1, True, 1.5, 11]:\n            with self.assertRaises(RuleViolation):\n                Voyage('v', 10).reserve(slots)\n        v = Voyage('v', 10)\n        v.reserve(10)\n        self.assertEqual(v.reserved, 10)\n\n    def test_replay_even_when_full(self):\n        cmd = Book('a', 'V001', 10)\n        self.assertEqual(book(self.path, cmd), book(self.path, cmd))\n        with connect(self.path) as c:\n            self.assertEqual(c.execute('SELECT count(*) FROM outbox').fetchone()[0], 1)\n\n    def test_key_mismatch(self):\n        book(self.path, Book('a', 'V001', 2))\n        with self.assertRaises(RuleViolation):\n            book(self.path, Book('a', 'V001', 3))\n\n    def test_stale_version(self):\n        with connect(self.path) as c:\n            a, b = load(c, 'V001'), load(c, 'V001')\n            a.reserve(6)\n            b.reserve(6)\n            commit(c, a, 0, Book('a', 'V001', 6))\n            with self.assertRaises(Conflict):\n                commit(c, b, 0, Book('b', 'V001', 6))\n\n    def test_atomic_rollback(self):\n        def fail():\n            raise RuntimeError('提交前故障')\n        with self.assertRaises(RuntimeError):\n            book(self.path, Book('a', 'V001', 4), fail)\n        with connect(self.path) as c:\n            self.assertEqual(load(c, 'V001').reserved, 0)\n            for table in ['commands', 'outbox']:\n                self.assertEqual(c.execute(f'SELECT count(*) FROM {table}').fetchone()[0], 0)\n\n    def test_concurrent_no_overbooking(self):\n        def attempt(i):\n            try:\n                book(self.path, Book(str(i), 'V001', 6))\n                return True\n            except RuleViolation:\n                return False\n        with ThreadPoolExecutor(max_workers=2) as pool:\n            self.assertEqual(sum(pool.map(attempt, range(2))), 1)\n        with connect(self.path) as c:\n            self.assertEqual(load(c, 'V001').reserved, 6)\n\n    def test_concurrent_duplicate(self):\n        with ThreadPoolExecutor(max_workers=2) as pool:\n            results = list(pool.map(lambda _: book(self.path, Book('same', 'V001', 10)), range(2)))\n        self.assertEqual(results[0], results[1])\n        with connect(self.path) as c:\n            self.assertEqual(c.execute('SELECT count(*) FROM outbox').fetchone()[0], 1)\n\n\nif __name__ == '__main__':\n    unittest.main(verbosity=2)\n","python/test_lifecycle.py":"import json\nimport tempfile\nimport unittest\nfrom concurrent.futures import ThreadPoolExecutor\nfrom pathlib import Path\nfrom lifecycle import (Command, Rejected, connect, initialize, execute,\n                       consume, relay_once, expire_due)\nfrom contextlib import closing\n\n\ndef fail():\n    raise RuntimeError('模拟进程在关键窗口崩溃')\n\n\nclass LifecycleTests(unittest.TestCase):\n    def setUp(self):\n        self.temp = tempfile.TemporaryDirectory()\n        self.db = str(Path(self.temp.name)/'booking.db')\n        self.consumer = str(Path(self.temp.name)/'consumer.db')\n        initialize(self.db, 10)\n        initialize(self.consumer)\n\n    def tearDown(self):\n        self.temp.cleanup()\n\n    def query(self, sql, db=None):\n        with closing(connect(db or self.db)) as c:\n            return c.execute(sql).fetchall()\n\n    def hold(self, rid='R1', slots=4, deadline=100):\n        return execute(self.db,Command('hold:'+rid,'hold',rid,slots,deadline),0)\n\n    def test_confirm_cancel_releases_once(self):\n        self.hold()\n        execute(self.db,Command('confirm','confirm','R1'),50)\n        execute(self.db,Command('cancel','cancel','R1'),60)\n        again = execute(self.db,Command('cancel-again','cancel','R1'),61)\n        self.assertFalse(again['changed'])\n        self.assertEqual(self.query('SELECT reserved FROM capacity'),[(0,)])\n        self.assertEqual(self.query('SELECT count(*) FROM events'),[(3,)])\n\n    def test_replay_precedes_capacity_and_clock_validation(self):\n        cmd = Command('hold','hold','R1',10,100)\n        first = execute(self.db,cmd,0)\n        self.assertEqual(execute(self.db,cmd,200),first)\n        with self.assertRaises(Rejected):\n            execute(self.db,Command('hold','hold','R1',9,100),0)\n\n    def test_late_confirmation_rejected_even_without_scheduler(self):\n        self.hold()\n        with self.assertRaises(Rejected):\n            execute(self.db,Command('confirm','confirm','R1'),100)\n        self.assertEqual(expire_due(self.db,100),1)\n        self.assertEqual(expire_due(self.db,100),0)\n        self.assertEqual(self.query('SELECT reserved FROM capacity'),[(0,)])\n\n    def test_confirmed_is_not_expired(self):\n        self.hold()\n        execute(self.db,Command('confirm','confirm','R1'),99)\n        execute(self.db,Command('expire','expire','R1'),100)\n        self.assertEqual(self.query('SELECT state FROM reservations'),[('CONFIRMED',)])\n        self.assertEqual(self.query('SELECT reserved FROM capacity'),[(4,)])\n\n    def test_atomic_rollback(self):\n        with self.assertRaises(RuntimeError):\n            execute(self.db,Command('hold','hold','R1',5,100),0,fail)\n        for table in ('reservations','receipts','events'):\n            self.assertEqual(self.query('SELECT count(*) FROM '+table),[(0,)])\n        self.assertEqual(self.query('SELECT reserved FROM capacity'),[(0,)])\n\n    def test_capacity_under_concurrent_different_intents(self):\n        def attempt(i):\n            try:\n                self.hold(str(i),1)\n                return True\n            except Rejected:\n                return False\n        with ThreadPoolExecutor(max_workers=8) as pool:\n            results=list(pool.map(attempt, range(20)))\n        self.assertEqual(sum(results),10)\n        self.assertEqual(self.query('SELECT reserved FROM capacity'),[(10,)])\n\n    def test_concurrent_same_intent(self):\n        cmd=Command('same','hold','R1',4,100)\n        with ThreadPoolExecutor(max_workers=8) as pool:\n            results=list(pool.map(lambda _:execute(self.db,cmd,0),range(12)))\n        self.assertTrue(all(x==results[0] for x in results))\n        self.assertEqual(self.query('SELECT reserved FROM capacity'),[(4,)])\n        self.assertEqual(self.query('SELECT count(*) FROM events'),[(1,)])\n\n    def test_expiry_racing_confirmation_at_deadline(self):\n        self.hold()\n        def call(action):\n            try:\n                return execute(self.db,Command(action,action,'R1'),100)['state']\n            except Rejected:\n                return 'REJECTED'\n        with ThreadPoolExecutor(max_workers=2) as pool:\n            outcomes=list(pool.map(call,['confirm','expire']))\n        self.assertEqual(outcomes,['REJECTED','EXPIRED'])\n        self.assertEqual(self.query('SELECT reserved FROM capacity'),[(0,)])\n\n    def test_send_then_crash_replays_without_duplicate_business_effect(self):\n        self.hold()\n        deliver=lambda e:consume(self.consumer,e)\n        with self.assertRaises(RuntimeError):\n            relay_once(self.db,deliver,fail)\n        self.assertEqual(self.query('SELECT sent FROM events'),[(0,)])\n        self.assertEqual(relay_once(self.db,deliver),1)\n        self.assertEqual(self.query('SELECT count(*) FROM inbox',self.consumer),[(1,)])\n        self.assertEqual(self.query('SELECT version,state FROM projection',self.consumer),[(1,'ACTIVE')])\n\n    def test_inbox_and_projection_rollback_together(self):\n        self.hold()\n        e=json.loads(self.query('SELECT payload FROM events')[0][0])\n        with self.assertRaises(RuntimeError):\n            consume(self.consumer,e,before_commit=fail)\n        self.assertEqual(self.query('SELECT count(*) FROM inbox',self.consumer),[(0,)])\n        self.assertEqual(self.query('SELECT count(*) FROM projection',self.consumer),[(0,)])\n        self.assertTrue(consume(self.consumer,e))\n\n    def test_out_of_order_snapshots_keep_newer_state(self):\n        self.hold()\n        execute(self.db,Command('cancel','cancel','R1'),50)\n        events=[json.loads(r[0]) for r in self.query('SELECT payload FROM events ORDER BY seq DESC')]\n        for e in events:\n            consume(self.consumer,e)\n        self.assertEqual(self.query('SELECT version,state FROM projection',self.consumer),[(2,'CANCELLED')])\n\n    def test_event_identity_must_not_change_payload(self):\n        self.hold()\n        e=json.loads(self.query('SELECT payload FROM events')[0][0])\n        consume(self.consumer,e)\n        with self.assertRaises(Rejected):\n            consume(self.consumer,dict(e,state='CANCELLED'))\n\n    def test_invalid_quantity_and_cancelled_cannot_confirm(self):\n        for slots in [0,-1,True,1.5]:\n            with self.assertRaises(Rejected):\n                self.hold('bad',slots)\n        self.hold()\n        execute(self.db,Command('cancel','cancel','R1'),50)\n        with self.assertRaises(Rejected):\n            execute(self.db,Command('confirm','confirm','R1'),60)\n\n\nif __name__ == '__main__':\n    unittest.main()\n"}}</script><script>'use strict';
const D=JSON.parse(document.getElementById('course-data').textContent),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='ddd-model-workshop-v1';let persistence=true,state={version:2,lessons:{},interviews:{},language:'go',last:'1'},toastTimer;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if([1,2].includes(parsed.version)&&parsed.lessons&&typeof parsed.lessons==='object'){state={...state,...parsed,version:2};for(const st of Object.values(state.lessons)){if(st&&typeof st==='object'&&typeof st.read!=='boolean')st.read=Number.isInteger(st.score)&&st.score>=2;}}}localStorage.setItem(KEY,JSON.stringify(state));}catch{persistence=false;}
const parts=['','Ⅰ · 运用领域模型','Ⅱ · 模型的构建块','Ⅲ · 向更深洞察重构','Ⅳ · 战略设计','Ⅴ · 专题与工程案例'];
function lessonState(id){return state.lessons[id]??={read:false,bookmark:false};}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{persistence=false;toast('浏览器未允许保存；请导出学习备份，避免关闭后丢失。');}updateProgress();}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3600);}
function navigate(route){if(location.hash==='#'+route)render();else location.hash=route;}
function route(){return decodeURIComponent(location.hash.slice(1)||'home');}
function passed(){return D.lessons.filter(l=>state.lessons[l.id]?.read===true).length;}

function updateProgress(){const n=passed();$('#progress-text').textContent=`${n} / ${D.lessons.length}`;$('#progress-fill').style.width=(n/D.lessons.length*100)+'%';}
function renderNav(){let out='';for(let i=1;i<=5;i++){out+=`<div class="nav-group">${parts[i]}</div>`;out+=D.lessons.filter(l=>l.part===i).map(l=>`<a class="chapter-link ${route()==='lesson/'+l.id?'active':''}" href="#lesson/${l.id}" ${route()==='lesson/'+l.id?'aria-current="page"':''}><span class="num">${String(l.n).padStart(2,'0')}</span><span>${esc(l.title.split('：')[0])}</span><span class="check">${state.lessons[l.id]?.read?'✓':state.lessons[l.id]?.bookmark?'☆':''}</span></a>`).join('');}$('#chapter-nav').innerHTML=out;updateProgress();}
function footer(){return `<footer class="footer"><span>DDD 模型工坊<br>从业务语言到模型，从模型到工程。</span><span><a href="#sources">参考文献</a> · <a href="#terms">概念索引</a> · <a href="#review">阅读记录</a><br>已读标记保存在当前浏览器。</span></footer>`;}
function langToggle(){return `<div class="lang-toggle" role="group" aria-label="示例语言"><button data-action="language" data-lang-value="go" class="${state.language==='go'?'active':''}" aria-pressed="${state.language==='go'}">Go</button><button data-action="language" data-lang-value="python" class="${state.language==='python'?'active':''}" aria-pressed="${state.language==='python'}">Python</button></div>`;}
function imageBlock(key){const a=D.images[key];return `<details class="original" open><summary>图解 · ${esc(a.caption)}</summary><div class="figure-scroll"><img src="${a.src}" alt="${esc(a.caption+'。'+a.explain)}" data-action="image" data-key="${key}" tabindex="0" role="button" aria-label="放大图解"></div><figcaption>${esc(a.explain)}</figcaption></details>`;}
function heroSVG(){return `<svg viewBox="0 0 580 280" role="img" aria-label="上海到东京的货物运输：要求、计划、事实三种模型"><title>一票货物，三个不同的问题</title><path d="M65 175 C175 175 165 80 280 100 S405 170 515 80" fill="none" stroke="#80c9d1" stroke-width="2" stroke-dasharray="6 7"/><circle cx="65" cy="175" r="8" fill="#e5a633"/><circle cx="280" cy="100" r="7" fill="#93c4ff"/><circle cx="515" cy="80" r="8" fill="#e5a633"/><text x="42" y="210" fill="#e9f5ff" font-size="17">上海</text><text x="253" y="65" fill="#b5d6ef" font-size="13">中转港</text><text x="491" y="116" fill="#e9f5ff" font-size="17">东京</text><g transform="translate(306,167)"><path d="M0 27 H145 L126 53 H26 Z" fill="#cde6ff"/><rect x="35" y="4" width="28" height="23" rx="2" fill="#62b2bb"/><rect x="67" y="4" width="28" height="23" rx="2" fill="#8eb8fa"/><rect x="99" y="4" width="25" height="23" rx="2" fill="#e5a633"/><path d="M20 26 V0 H31 V26" fill="#e9f5ff"/><path d="M0 64 Q17 57 34 64 T68 64 T102 64 T140 64" fill="none" stroke="#4c809d" stroke-width="2"/></g><rect x="40" y="24" width="142" height="64" rx="8" fill="#ffffff0d" stroke="#ffffff20"/><text x="54" y="50" font-size="11" fill="#8fb6d3">CARGO / C-1024</text><text x="54" y="73" font-size="14" fill="#e6f4ff">一票需要冷链的货物</text></svg>`;}
function home(){return `<div class="hero"><div><div class="eyebrow">Domain-driven design / 领域驱动设计</div><h1>从一票货物，<br>理解一个<span>领域。</span></h1><p class="intro">一票冷链货物要改目的地，牵动的是地址、运输计划，还是已经作出的承诺？跟随航运、贷款与记账案例，理解业务规则怎样长成模型，再走进 Go / Python 的实现。</p><div class="actions"><button class="primary" data-action="continue">继续阅读 →</button><a href="#review" class="small">已读 ${passed()} / 20</a></div><p class="small muted" style="margin-top:18px">Eric Evans 原书主线 · 战略设计 · 工程实践</p></div><div class="hero-visual"><div class="eyebrow">Case file 001 · 海风订舱</div>${heroSVG()}<div class="hero-tabs"><button class="active" data-action="hero-tab" data-index="0">运输要求</button><button data-action="hero-tab" data-index="1">运输计划</button><button data-action="hero-tab" data-index="2">处理事实</button></div><p id="hero-caption" class="hero-caption">要求：全程冷链，送到东京。它描述什么样的结果可以接受。</p></div></div><div class="concept-thesis"><span>一个贯穿全书的问题</span><h2>业务变化时，为什么有的代码只改一处，<br>有的代码却要修改整个系统？</h2><p>答案藏在模型里：它有没有表达真正的业务概念，有没有把必须一起成立的规则放在一起，又有没有承认不同团队看待同一件事的方式不同。</p></div><div class="route-heading"><h2>循着问题，深入模型</h2><span class="small muted">自由阅读 · 按需标记已读</span></div><div class="route-grid">${[['01—03','业务与共同语言','从电路板的知识发现开始，看业务对话如何改变代码中的概念。','1'],['04—07','模型进入代码','厘清身份、值与行为，沿航运案例推导聚合、工厂、仓储和事务。','4'],['08—13','让模型随着理解演化','跟踪贷款份额、规格与记账模型，理解一次重构为什么值得做。','8'],['14—17','边界、核心与团队','根据协作条件选择上下文关系，集中核心投入，让大型系统逐步演进。','14'],['18—20','规格、故障与完整用例','把规则落到并发、幂等、消息、取消与过期的具体失败时间线上。','18'],['面经与答案','高级工程师的设计表达','从真实面经主题出发，阅读参考回答、设计取舍与连续追问。','interview']].map(([range,t,p,id])=>`<a class="route-card" href="#${id==='interview'?'interview':'lesson/'+id}"><span class="range">${range}</span><h3>${t} ↗</h3><p>${p}</p></a>`).join('')}</div><section class="source-card" style="margin-top:28px"><h2>三个视角，读懂同一个系统</h2><div class="learning-lenses"><div><h3>业务视角</h3><p>承诺了什么？允许哪些例外？失败后由谁承担责任？先把这些问题说清，再决定类和表。</p></div><div><h3>模型视角</h3><p>什么必须保持身份？什么只是一个值？哪些规则必须在同一边界内成立？</p></div><div><h3>工程视角</h3><p>两个请求同时到达、提交后断网、消息重复时，模型中的承诺如何继续成立？</p></div></div><div class="actions"><a href="#lesson/1">从第一章开始 →</a><a href="#terms">按概念查阅</a><a href="#sources">参考文献</a></div></section>${!persistence?'<div class="notice">当前浏览器不允许保存已读标记，可在阅读记录页导出备份。</div>':''}${footer()}`;}

function caseReading(l){return `<section class="case-reading"><div class="eyebrow">Worked example / 案例解析</div><h2>${esc(l.caseTitle||'把概念放回具体场景')}</h2><p>${esc(l.caseContext||'下面用本章场景说明规则、边界和实现取舍。')}</p><p>${esc(l.answer)}</p><h3>容易混淆的地方</h3>${l.quiz.map(q=>`<div class="reading-insight"><h4>${esc(q.prompt)}</h4><p><strong>${esc(q.options[q.answer])}。</strong>${esc(q.why)}</p></div>`).join('')}</section>`;}
function lesson(l){state.last=l.id;save();let sectionIndex=0;const body=l.body.replace(/<h2>(.*?)<\/h2>/g,(_,t)=>`<h2 id="s-${l.id}-${++sectionIndex}">${t}</h2>`),heads=[...body.matchAll(/<h2 id="([^"]+)">(.*?)<\/h2>/g)];return `<div class="lesson-grid"><article class="article"><header class="lesson-header"><div class="eyebrow">${parts[l.part]} / ${String(l.n).padStart(2,'0')}</div><h1>${esc(l.title)}</h1><p class="subtitle">${esc(l.subtitle)}</p><div class="meta"><span>${l.n<=17?`Evans 第 ${l.n} 章 · PDF ${l.pages} 页 · 原书主线`:esc(l.pages)}</span></div><div>${l.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="reading-tools">${langToggle()}${readButton(l.id)}<a class="small" href="#reading-end" data-anchor="reading-end">到本章末尾 ↓</a></div></header>${l.quote?`<blockquote class="quote"><p>“${esc(l.quote[0])}”</p><p>${esc(l.quote[1])}</p><cite>Eric Evans · PDF 第 ${l.quote[2]} 页 · 课程自译</cite></blockquote>`:''}${l.diagram?`<figure class="diagram">${D.diagrams[l.diagram]}<figcaption>原创中文示意 · ${esc(l.tags.slice(0,3).join(' / '))}</figcaption></figure>`:''}<details class="chapter-outline"><summary>本章目录 · ${heads.length} 个主题</summary><nav>${heads.map(([_,id,t])=>`<a href="#${id}" data-anchor="${id}">${t}</a>`).join('')}</nav></details>${body}${l.image?imageBlock(l.image):''}${caseReading(l)}<div class="reading-end" id="reading-end"><span class="read-status" data-read-label="${l.id}">${lessonState(l.id).read?'本章已读':'本章未标记已读'}</span>${readButton(l.id)}<span class="small muted">可随时撤销。</span></div><div class="source-inline"><strong>本章出处与延伸</strong><p>${l.n<=17?`主要依据 Evans 原书第 ${l.n} 章，PDF 文件第 ${l.pages} 页。`:l.n===18?'依据 Eric Evans 与 Martin Fowler 的 Specifications，PDF 第 1–19 页。':'原创工程案例及现代实现补充。'}</p>${l.refs.map(id=>{const s=D.sources.find(x=>x.id===id);return `<a target="_blank" rel="noopener" href="${s.url}">${esc(s.title)} ↗</a>`;}).join('')}</div><nav class="lesson-pagination">${l.n>1?`<a href="#lesson/${l.n-1}">← 上一章 · ${esc(D.lessons[l.n-2].title.split('：')[0])}</a>`:'<a href="#home">← 阅读目录</a>'}${l.n<20?`<a href="#lesson/${l.n+1}">下一章 · ${esc(D.lessons[l.n].title.split('：')[0])} →</a>`:'<a href="#interview">阅读面试参考答案 →</a>'}</nav></article><aside class="lesson-aside"><h3>本章目录</h3><nav class="toc">${heads.map(([_,id,t])=>`<a href="#${id}" data-anchor="${id}">${t}</a>`).join('')}<a href="#reading-end" data-anchor="reading-end">阅读标记</a></nav><div class="actions">${langToggle()}${readButton(l.id)}<button data-action="bookmark" data-id="${l.id}" aria-pressed="${!!lessonState(l.id).bookmark}">${lessonState(l.id).bookmark?'★ 已收藏':'☆ 收藏'}</button><button data-action="print">打印本章</button></div><p class="aside-source">完整源码可在<a href="#lab">代码案例</a>直接阅读。</p></aside></div>${footer()}`;}
function readButton(id){return `<button class="${lessonState(id).read?'':'primary'}" data-action="read" data-id="${id}" aria-pressed="${!!lessonState(id).read}">${lessonState(id).read?'✓ 已读 · 撤销':'标记为已读'}</button>`;}
function review(){return `<div class="page-heading"><div class="eyebrow">Reading history</div><h1>读到哪里，就记到哪里。</h1><p>已读 ${passed()} / 20。进入章节不会自动标记；点击“标记为已读”即可，随时可以撤销。</p></div><div class="toolbar"><button data-action="export" class="primary">导出阅读备份</button><button data-action="import">导入备份</button><button data-action="print-course">连续阅读 / 打印全部章节</button></div><p class="small muted">记录保存在当前浏览器。可导出备份，在其他浏览器导入后继续阅读。</p>${D.lessons.map(l=>`<div class="list-row"><div class="row-main"><h3><a href="#lesson/${l.id}">${esc(l.title)}</a></h3><p>${l.n<=17?'原书 PDF '+l.pages+' 页':'补充专题'}${lessonState(l.id).bookmark?' · 已收藏':''}</p></div><div class="row-actions">${readButton(l.id)}</div></div>`).join('')}${footer()}`;}

const realInterviews=[['长沙秋招面经合集','2023-11-21 · 牛客 · 个人回忆','上海爱数等面试涉及 DDD 与三层设计、对象生命周期及微服务划分。','https://www.nowcoder.com/discuss/556438629988450304'],['游卡后端一面面经','2025-08-30 · 牛客 · Go','记录了“是否了解领域驱动设计”的基础询问；没有提供 DDD 深入追问与标准答案。','https://www.nowcoder.com/discuss/791234897946939392?sourceSSR=post'],['分享面经攒人品－社招 Golang','2024-07-01 · 牛客 · 自述四年经验','WPS 技术三面涉及 DDD 与 MVC 的区别，以及服务拆分是否合理。','https://www.nowcoder.com/discuss/631514581503926272?sourceSSR=enterprise'],['2023 年社招面经','2023 年 3 月 · 力扣','同花顺一面涉及 DDD 与领域消息发送，二面再次讨论 DDD 理解。','https://leetcode.cn/discuss/post/3vLNFY/']];
function interviewPage(){return `<div class="page-heading"><div class="eyebrow">Interview reading</div><h1>面经与参考答案。</h1><p>直接阅读业务问题、建模决定、工程取舍和失败分析。真实面经主题与原创追问分别标注。</p></div><div class="note-band"><strong>来源与答案</strong><span>4 篇面经是求职者自述，不代表固定题库。以下 8 题答案由本课程原创，不是公司标准答案，参考回答中的项目场景为教学示例。</span></div><details class="original"><summary>查看 4 篇面经原始出处</summary>${realInterviews.map(([t,d,p,u])=>`<div class="source-card"><div class="eyebrow">${d}</div><h3><a target="_blank" rel="noopener" href="${u}">${t} ↗</a></h3><p>${p}</p></div>`).join('')}</details>${D.interviews.map(q=>`<article class="interview" id="interview-${q.id}"><div class="eyebrow">${String(q.id).padStart(2,'0')} / ${esc(q.kind)}</div><h2>${esc(q.title)}</h2><div class="interview-source">${q.links.length?q.links.map(([t,u])=>`<a target="_blank" rel="noopener" href="${u}">${esc(t)} ↗</a>`).join(''):'课程原创延伸问题。'}</div><div class="answer">${q.body}</div></article>`).join('')}${footer()}`;}
function sourcesPage(){const sha='8ecfcdf05b1462c4757bd2dcac9086c78e9f7791',repo='https://github.com/ThreeDotsLabs/wild-workouts-go-ddd-example/blob/'+sha+'/';return `<div class="page-heading"><div class="eyebrow">Further reading / 参考文献</div><h1>从一个问题，<br>读到更深的地方。</h1><p>Evans 原书建立建模与战略主线；Specifications 深入规则表达；Go / Python 材料连接实现、事务与消息。</p></div><div class="reading-paths"><a href="#source-reference" data-anchor="source-reference">模型与概念 →</a><a href="#source-go" data-anchor="source-go">Go 工程实践 →</a><a href="#source-cosmic" data-anchor="source-cosmic">Python 工程实践 →</a><a href="#source-meituan24" data-anchor="source-meituan24">系统演进 →</a></div>${D.sources.map(s=>`<section class="source-card" id="source-${s.id}"><div class="eyebrow">${esc(s.type)}</div><h2><a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)} ↗</a></h2><p>${esc(s.note)}</p><p class="coverage"><strong>关联章节：</strong>${esc(s.coverage)}</p><p><strong>阅读重点：</strong>${esc(s.next)}</p>${s.extra?`<a class="small" href="${s.extra}" target="_blank" rel="noopener">原始 PDF ↗</a>`:''}</section>`).join('')}<section class="source-card"><div class="eyebrow">Go / Source walkthrough</div><h2>沿一个命令读 Wild Workouts</h2><p><a href="${repo}internal/trainer/domain/hour/hour.go" target="_blank" rel="noopener">Hour 工厂与重建</a>把新预约的约束与持久化恢复区分开；<a href="${repo}internal/trainer/domain/hour/repository.go" target="_blank" rel="noopener">Repository 更新回调</a>把加载、修改和保存组织成一个协议；<a href="${repo}internal/trainings/app/command/approve_training_reschedule.go" target="_blank" rel="noopener">改期审批用例</a>展示应用层怎样协调规则与依赖。</p><p>阅读时关注：新建对象的时间规则是否应原样用于历史恢复；回调是否会重试；外部服务成功后，本地提交失败应由什么协议恢复。这些问题比目录中有多少个 interface 更能说明边界设计的质量。</p><p class="small muted">源码链接固定到提交 8ecfcdf，便于对照相同版本。</p></section>${imageBlock('reference')}<section class="source-card"><h2>书目与图文出处</h2><p>Eric Evans，<em>Domain-Driven Design: Tackling Complexity in the Heart of Software</em>，2003。章节标注采用 567 页英文重排 PDF 文件页码。Eric Evans 与 Martin Fowler，<em>Specifications</em>，规格专题论文。中文正文为教学讲解；短引文保留英文并附译文。</p><p>中文图解由本项目原创，用于解释模型关系；章节保留原书及参考文献出处。DDD Reference（2015）全景图：© Eric Evans，<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>。海风订舱的代码与业务细节属于教学案例。</p></section>${footer()}`;}
const glossary=[['领域模型','为特定业务目的选择的概念、规则及关系，不是现实的完整复制。',1],['通用语言','领域专家与开发共同使用、在模型语境内含义一致的语言。',2],['模型驱动设计','模型与实现互相约束、共同演化，让代码表达关键概念。',3],['应用服务','编排用例、协调领域操作与提交，避免独占业务规则。',4],['领域服务','表达不自然属于单个实体或值对象的领域操作。',5],['实体','依靠连续身份区分，同一对象的属性可以随时间变化。',5],['值对象','按相关属性定义相等，通常不可变，封装值的约束。',5],['模块','用有凝聚力的领域概念组织代码与知识。',5],['聚合 / 聚合根','围绕一致性不变量形成的对象单元，由根控制外部访问。',6],['不变量','操作完成或事务提交后必须成立的业务条件。',6],['工厂','隐藏复杂创建，返回完整有效的对象；重建需保留历史身份。',6],['仓储','以聚合访问语义屏蔽存储实现，不等于每表一个 DAO。',6],['乐观锁','提交时检测版本是否变化；冲突后需要重新决策。',6],['要求 / 计划 / 事实','想实现什么、准备怎么做、实际发生什么，不能混成一个状态。',7],['深层模型','用更贴合领域的概念解释业务，可能撤销错误约束。',8],['规格模式','分离候选与满足条件的规则，用于校验、选择或按要求构造。',9],['意图揭示接口','接口名称与契约揭示目的，调用者不必读实现猜行为。',10],['无副作用函数','计算不暗中改变外部状态，便于推理和组合。',10],['概念轮廓','沿有意义的概念与变化边界切分，而非机械拆分代码。',10],['操作闭包','同类领域值运算后仍得到同类值，可继续组合。',10],['分析模式','可借鉴的领域概念、约束与后果，需适配新业务。',11],['Policy / Strategy','把业务政策显式表达为可选择的行为或算法。',12],['Composite','当领域具有部分—整体语义时，对组合与叶子统一处理。',12],['限界上下文','语言与模型保持一致的适用边界，区别于部署单元。',14],['上下文映射','描述真实模型边界、关系、影响方向及协作责任。',14],['防腐层','把外部含义翻译成本地含义，避免本地模型被污染。',14],['共享内核','团队小范围共同维护的模型与代码，需要共同变更纪律。',14],['发布语言','跨上下文共享的明确交换语义，不仅是字段格式。',14],['伙伴关系','双方交付相互依赖，需要协调计划与集成；Reference 后续条目。',14],['泥球','承认并圈定模型混杂区域，防止混乱扩散；Reference 后续条目。',14],['核心领域','本业务差异化与竞争力所在，决定建模投入重点。',15],['通用子域','非差异化业务能力，可采用成熟方案；不强制平台化。',15],['内聚机制','封装复杂机制，避免细节遮蔽领域表达。',15],['知识级别','一组领域对象描述规则或类型，另一组按其约束运行。',16],['Subsumption','用逻辑蕴含与集合包含判断规则谁更严格，避免术语方向歧义。',18],['剩余规格','保留尚未满足的逻辑要求，重新规划时还需新的初始条件。',18],['工作单元 UoW','一次业务用例提交与回滚的边界或协作协议。',19],['领域事件','领域专家关心的已发生事实；不同于命令和技术异常。',19],['幂等','同一次业务意图的重试不重复产生效果，需明确键作用域。',19],['Outbox','本地事务原子写入业务状态和待发消息，仍需处理重复。',19],['Saga','跨边界业务流程及补偿；补偿是新动作，不是物理回滚。',19],['CQRS','读写使用不同模型或职责，不自动要求微服务或不同数据库。',19],['事件溯源','以事件序列作为权威状态来源，区别于普通事件通知。',19]];
function termsPage(query=''){const term=query.toLowerCase();return `<div class="page-heading"><div class="eyebrow">Concept index</div><h1>把名词接回问题。</h1><p>点击概念回到具体章节。一个定义只是入口，下面链接到相应的场景与反例。</p></div><div class="term-grid">${glossary.filter(x=>x.join(' ').toLowerCase().includes(term)).map(([t,d,n])=>`<a class="term" href="#lesson/${n}"><h3>${esc(t)} ↗</h3><p>${esc(d)}</p><span class="tag">第 ${n} 单元</span></a>`).join('')}</div>${footer()}`;}
function labPage(){return `<div class="page-heading"><div class="eyebrow">Engineering / 一次提交背后的规则</div><h1>规则写对了，<br>为什么仍然会超卖？</h1><p>先观察两份旧快照的竞争，再到 Go / Python 代码里复现。网页动画是概念模拟；真实测试在本地代码包运行。</p></div><div class="lab-panel"><h2>场景 01 · 两个请求抢同一段容量</h2><p class="small muted">容量 10，初始已预留 4；A/B 都读取版本 v7，各自申请 4。</p><div class="lab-controls"><label><input id="lock-mode" type="checkbox" checked> 提交时检查版本（乐观锁）</label><button class="primary" data-action="run-race">运行这次竞争</button><button data-action="reset-race">重置</button></div><div class="capacity" id="slots">${Array.from({length:10},(_,i)=>`<span class="slot ${i<4?'used':''}" title="舱位 ${i+1}"></span>`).join('')}</div><div class="lab-log" id="race-log" role="status">初始：reserved=4，capacity=10，version=7。\n两个请求准备读取同一快照。</div><p class="small muted" style="margin-top:16px">关闭版本校验时，演示的是覆盖写导致的“账面预留 8，但累计承诺 12”；不是每种数据库写法都产生相同结果。原子条件增量更新是另一种可评估方案。</p></div><div class="lab-panel"><h2>场景 02 · 冷链规格组合</h2><p class="small">要求：食品卫生合格，并且最低可达温度 ≤ −18°C。这里只模拟设备能力，不判断不同货物的混装温区。</p><div class="lab-controls"><label for="temp">箱子最低可达温度 <output id="temp-value">−20°C</output></label><input id="temp" type="range" min="-30" max="10" value="-20"><label><input id="food" type="checkbox" checked> 食品卫生合格</label></div><div id="spec-result" class="feedback" role="status">满足：两项硬约束同时成立。</div></div><div class="lab-panel"><div class="eyebrow">Runnable reference / 无第三方依赖</div><h2>可阅读、可运行的完整代码。</h2><div class="lab-grid"><div><h3>Go · 内存事务适配器</h3><p class="small">Go 1.22+。值快照、版本检测、原子内存提交与命令回放。<strong>进程退出即丢数据</strong>，不是持久 Outbox。</p><pre><code>cd go\ngo test -race ./...</code></pre></div><div><h3>Python · SQLite 事务</h3><p class="small">Python 3.9+。状态、容量、幂等回执与待发事件同事务；生命周期案例包含取消、过期、重复消费与乱序投影。SQLite 写锁不代表其他数据库的并发性能。</p><pre><code>cd python\npython3 -m unittest -v</code></pre></div></div><div class="actions"><a class="primary" style="padding:9px 15px;border-radius:8px" href="ddd-code-examples.zip" download>下载完整代码 ZIP</a><button data-action="download-all">下载源码合集 TXT</button></div><p class="small muted" style="margin-top:14px">ZIP 需与 HTML 放在同一目录；若只保留 HTML，可用下方单文件下载重建目录。源码已经内嵌，无需联网。</p><div class="notice">代码按三个层次阅读：Go 内存适配器展示乐观并发；Python booking.py 展示 SQLite 原子提交；lifecycle.py 串起确认、取消、过期、Outbox 和 Inbox。消息交付用回调连接两个数据库，未接入真实 MQ 或外部支付。</div><div class="files">${Object.keys(D.files).map(k=>`<button class="file-btn" data-action="download-file" data-file="${esc(k)}">↓ ${esc(k)}</button>`).join('')}</div></div><div class="lab-panel lab-source"><h2>完整参考实现与测试</h2><p class="small muted">可直接展开完整源码与测试，结合正文理解实现。章节中的短代码片段可能省略类型、导入或边界；这里展示可运行包里的完整文件。</p>${Object.entries(D.files).map(([k,v])=>`<details><summary>${esc(k)}</summary><pre><code>${esc(v)}</code></pre></details>`).join('')}</div><div class="lab-panel"><h2>六种保护机制失效时会发生什么</h2><ol class="small"><li>去掉版本条件：陈旧快照测试应失败，解释丢更新。</li><li>跳过幂等参数比对：同一键不同数量应被错误接受。</li><li>在幂等重放前做容量校验：满额成功后的重试会被错拒。</li><li>把 outbox 写入搬到事务外：注入崩溃，观察消息意图丢失。</li><li>取消只减总数而不检查预订状态：重复请求会多释放容量。</li><li>消费者只在内存去重：重启后重复事件可能再次产生业务效果。</li></ol><a href="#lesson/20">阅读订舱案例解析 →</a></div>${footer()}`;}
function searchPage(query){const s=query.trim().toLowerCase(),found=D.lessons.filter(l=>(l.title+' '+l.subtitle+' '+l.tags.join(' ')+' '+l.body+' '+l.answer+' '+l.caseContext).toLowerCase().includes(s));return `<div class="page-heading"><div class="eyebrow">Search / 全文检索</div><h1>“${esc(query)}”</h1><p>找到 ${found.length} 个阅读单元。搜索范围包含正文、概念、代码片段和案例解析。</p></div><div class="search-results">${found.map(l=>{let text=l.body.replace(/<[^>]*>/g,' ').replace(/\s+/g,' '),i=text.toLowerCase().indexOf(s),excerpt=i>=0?text.slice(Math.max(0,i-30),i+115):l.subtitle;return `<a class="list-row" href="#lesson/${l.id}"><div><h3>${String(l.n).padStart(2,'0')} · ${esc(l.title)}</h3><p>${esc(excerpt)}</p></div></a>`;}).join('')||'<div class="empty">换一个词试试，例如“上下文”“不变量”“并发”或“规格”。</div>'}</div>${footer()}`;}
function render(){const r=route();let html;if(r.startsWith('lesson/')){const l=D.lessons.find(x=>x.id===r.split('/')[1]);html=l?lesson(l):home();}else if(r==='review')html=review();else if(r==='interview')html=interviewPage();else if(r==='sources')html=sourcesPage();else if(r==='lab')html=labPage();else if(r==='terms')html=termsPage();else if(r.startsWith('search/'))html=searchPage(r.slice(7));else html=home();$('#app').innerHTML=html;document.body.dataset.language=state.language;renderNav();$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===r));$('#search').value=r.startsWith('search/')?r.slice(7):'';$('#app').querySelectorAll('pre').forEach(pre=>{const b=document.createElement('button');b.className='copy-code';b.textContent='复制代码';b.dataset.action='copy';pre.before(b);});$('.sidebar').classList.remove('open');$('.menu-btn').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'instant'});document.title=(r.startsWith('lesson/')?D.lessons.find(l=>l.id===r.split('/')[1])?.title+' · ':'')+'DDD 模型工坊';}
function download(name,text,type='text/plain;charset=utf-8'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function updateSpec(){const t=Number($('#temp').value),food=$('#food').checked;$('#temp-value').textContent=t+'°C';const ok=t<=-18&&food;$('#spec-result').className='feedback'+(ok?'':' wrong');$('#spec-result').textContent=ok?'满足：两项硬约束同时成立。':'不满足：'+[t>-18?'设备无法达到 −18°C':null,!food?'食品卫生条件不合格':null].filter(Boolean).join('；')+'。';}
document.addEventListener('click',async e=>{const anchor=e.target.closest('[data-anchor]');if(anchor){e.preventDefault();const target=document.getElementById(anchor.dataset.anchor);target?.scrollIntoView({behavior:'smooth'});if(anchor.dataset.anchor==='main')target?.focus();return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;if(a==='menu'){$('.sidebar').classList.toggle('open');el.setAttribute('aria-expanded',$('.sidebar').classList.contains('open'));}
else if(a==='continue')navigate('lesson/'+(state.last||'1'));
else if(a==='hero-tab'){const texts=['要求：全程冷链，送到东京。它描述什么样的结果可以接受。','计划：经中转港换船，再抵达东京。它可以被替换，也可能不再满足要求。','事实：货物刚在上海装船。以后改变目的地，也不能改写这一段历史。'];$$('.hero-tabs button').forEach(b=>b.classList.toggle('active',b===el));$('#hero-caption').textContent=texts[Number(el.dataset.index)];}
else if(a==='language'){state.language=el.dataset.langValue;document.body.dataset.language=state.language;$$('[data-action=language]').forEach(b=>{b.classList.toggle('active',b.dataset.langValue===state.language);b.setAttribute('aria-pressed',b.dataset.langValue===state.language);});save();}
else if(a==='bookmark'){const st=lessonState(id);st.bookmark=!st.bookmark;save();renderNav();if(route()==='review')render();else{el.textContent=st.bookmark?'★ 已收藏':'☆ 收藏';el.setAttribute('aria-pressed',st.bookmark);}}
else if(a==='image'){const im=D.images[el.dataset.key];$('#big-image').src=im.src;$('#big-image').alt=im.caption;$('#image-caption').textContent=im.caption;$('#image-dialog').showModal();}
else if(a==='close-image')$('#image-dialog').close();
else if(a==='read'){const st=lessonState(id);st.read=!st.read;save();renderNav();$$('[data-action=read]').filter(b=>b.dataset.id===id).forEach(b=>{b.textContent=st.read?'✓ 已读 · 撤销':'标记为已读';b.classList.toggle('primary',!st.read);b.setAttribute('aria-pressed',st.read);});$$('[data-read-label]').filter(b=>b.dataset.readLabel===id).forEach(b=>b.textContent=st.read?'本章已读':'本章未标记已读');if(route()==='review')render();}
else if(a==='print')window.print();
else if(a==='copy'){const text=el.nextElementSibling?.innerText||'';try{await navigator.clipboard.writeText(text);toast('代码已复制。');}catch{const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();toast(ok?'代码已复制。':'无法自动复制，请选中代码手动复制。');}}
else if(a==='export')download('DDD阅读备份.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');
else if(a==='import')$('#import-file').click();
else if(a==='print-course'){$('#app').innerHTML=`<h1>DDD 模型工坊 · 连续阅读</h1><p>业务语言、战术建模、战略设计与工程案例。</p><div class="toolbar"><button data-action="print">打印 / 另存为 PDF</button><button data-action="back">返回目录</button></div>`+D.lessons.map(l=>`<article class="article chapter-print"><h1>${l.n}. ${esc(l.title)}</h1><p class="small muted">${l.n<=17?'Evans 第 '+l.n+' 章 · PDF ':''}${esc(l.pages)}</p>${l.diagram?`<figure class="diagram">${D.diagrams[l.diagram]}</figure>`:''}${l.body}${l.image?imageBlock(l.image):''}${caseReading(l)}</article>`).join('');document.body.dataset.language=state.language;window.scrollTo(0,0);}
else if(a==='back')render();
else if(a==='run-race'){const lock=$('#lock-mode').checked;$('#race-log').textContent='① A/B 读取：reserved=4，version=7。\n② 两者本地校验 4+4≤10，均通过。\n③ A 提交：reserved=8，version=8。\n'+(lock?'④ B 条件更新 version=7：0 行，冲突。\n⑤ B 重新读取 8，再预留 4：超过容量，拒绝。\n结果：只新增一笔承诺，已预留 8 / 10。':'④ B 无版本校验，覆盖写 reserved=8。\n⑤ 两个请求都宣称新增预留 4。\n结果：账面 8，累计承诺 4+4+4=12，账实不符！');$('#slots').innerHTML=Array.from({length:10},(_,i)=>`<span class="slot ${i<8?'used':''}" title="账面舱位 ${i+1}"></span>`).join('');}
else if(a==='reset-race'){$('#race-log').textContent='初始：reserved=4，capacity=10，version=7。\n两个请求准备读取同一快照。';$('#slots').innerHTML=Array.from({length:10},(_,i)=>`<span class="slot ${i<4?'used':''}"></span>`).join('');}
else if(a==='download-file'){const key=el.dataset.file;if(Object.hasOwn(D.files,key))download(key.split('/').pop(),D.files[key]);}

});
document.addEventListener('input',e=>{if(e.target.id==='temp')updateSpec();});
document.addEventListener('change',e=>{if(e.target.id==='food')updateSpec();});
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q)navigate('search/'+encodeURIComponent(q));else navigate('home');}});
let searchTimer;$('#search').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(()=>{if(!q){renderNav();return;}const hits=D.lessons.filter(l=>(l.title+l.tags.join(' ')+l.body+l.answer+l.caseContext).toLowerCase().includes(q.toLowerCase()));$('#chapter-nav').innerHTML=`<div class="nav-group">找到 ${hits.length} 章 · 回车看全文结果</div>`+hits.map(l=>`<a class="chapter-link" href="#lesson/${l.id}"><span class="num">${String(l.n).padStart(2,'0')}</span>${esc(l.title.split('：')[0])}</a>`).join('');},180);});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('文件过大');const obj=JSON.parse(await file.text());if(![1,2].includes(obj.version)||!obj.lessons||typeof obj.lessons!=='object')throw Error('备份格式不正确');for(const l of D.lessons){const s=obj.lessons[l.id];if(!s||typeof s!=='object')continue;const clean={read:typeof s.read==='boolean'?s.read:(Number.isInteger(s.score)&&s.score>=2),answers:{},draft:typeof s.draft==='string'?s.draft.slice(0,100000):'',checks:Array.isArray(s.checks)?s.checks.filter(x=>Number.isInteger(x)&&x>=0&&x<3):[],score:Number.isInteger(s.score)&&s.score>=0&&s.score<=3?s.score:null,due:Number.isFinite(s.due)&&s.due>0?s.due:null,bookmark:s.bookmark===true,reviews:Number.isInteger(s.reviews)&&s.reviews>=0?s.reviews:0};for(let i=0;i<l.quiz.length;i++)if(Number.isInteger(s.answers?.[i])&&s.answers[i]>=0&&s.answers[i]<3)clean.answers[i]=s.answers[i];if(Array.isArray(s.history))clean.history=s.history.filter(x=>typeof x.draft==='string'&&typeof x.date==='string').slice(-50).map(x=>({draft:x.draft.slice(0,100000),date:x.date.slice(0,50)}));state.lessons[l.id]=clean;}for(const q of D.interviews){const s=obj.interviews?.[q.id];if(s&&typeof s==='object')state.interviews[q.id]={draft:typeof s.draft==='string'?s.draft.slice(0,100000):'',evidence:typeof s.evidence==='string'?s.evidence.slice(0,100000):'',scores:Array.from({length:4},(_,i)=>Number.isInteger(s.scores?.[i])&&s.scores[i]>=0&&s.scores[i]<=2?s.scores[i]:0)};}if(['go','python'].includes(obj.language))state.language=obj.language;save();render();toast('阅读记录已合并。');}catch(err){toast('导入失败：'+err.message);}e.target.value='';});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('img[data-action=image]')){e.preventDefault();e.target.click();}if(e.key==='Escape'){$('.sidebar').classList.remove('open');$('.menu-btn').setAttribute('aria-expanded','false');}});

window.addEventListener('hashchange',render);render();
</script></body></html>
