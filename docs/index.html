ion>\u003ch2>历史数据不符合新不变量时，不能假装它干净\u003c/h2>\u003cp>新增 Payment 后，旧订单的 paid_amount 只能告诉我们总额，未必能恢复每笔支付的身份与时间。直接把每笔订单伪造成一笔历史付款，会制造并不存在的事实。可以导入明确标记来源的期初已收款余额，或根据支付对账记录恢复可核验的流水；不能恢复的部分要保留不确定性。\u003c/p>\u003cp>同时盘点状态：是否有已取消却已收款的订单、负数金额、重复回调、跨币种混算？有些是错误数据，有些是旧模型曾经允许的合法情况。迁移规则要区分修复、保留和人工核对。新代码拒绝历史对象加载，只会把建模问题转成线上故障。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>双写最容易在“看似成功”时埋下分叉\u003c/h2>\u003cp>为了过渡，服务可能先更新旧订单总额，再插入新付款记录。若第二步失败，旧系统显示已付款，新系统却查不到事实；如果重试只重复第二步，又可能生成重复记录。把两次写放在一个函数里，不代表它们原子。\u003c/p>\u003cp>同一数据库内，可以把相关写入纳入同一事务，并用稳定的来源身份防止重复；跨存储时，需要指定一个权威写入来源，通过可靠变更日志或事件同步到另一侧。这样承认短暂差异，同时拥有可恢复的传播与对账机制。关键是任何阶段都能说清哪边具有裁决权。\u003c/p>\u003cdiv class=\"model-strip\">\u003cdiv>\u003cstrong>扩展\u003c/strong>\u003cspan>新增结构与兼容入口\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>回填\u003c/strong>\u003cspan>保留来源并校验历史\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>比对\u003c/strong>\u003cspan>影子读取、业务口径对账\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>切换\u003c/strong>\u003cspan>确定唯一权威与回退边界\u003c/span>\u003c/div>\u003c/div>\u003cp>新模型切换为权威后，继续允许旧版本写旧字段，可能把新事实覆盖掉。部署顺序、兼容窗口和旧实例退出条件同样属于迁移设计；“数据库字段还在”不等于旧程序仍可安全运行。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>影子运行应比较语义，不能只比较 JSON\u003c/h2>\u003cp>旧模型与新模型的表示不同，逐字段相等往往毫无意义。可以比较可观察业务结果：同一组已确认收款能解释出多少未结余额，重复通知是否改变结果，取消后哪些承诺仍然有效。差异分成新模型修复的旧缺陷、历史数据问题和新模型错误，不能一律自动接受或自动拒绝。\u003c/p>\u003cp>回放真实数据时还要防止产生真实副作用。影子计算可以读取事实、生成候选决定，但不能再次扣款、发送履约指令或重复通知客户。先隔离执行环境和输出通道，再讨论比较准确率。\u003c/p>\u003cp>验收证据既包括规则正确，也包括迁移可恢复：回填重跑是否重复、处理中断能否续传、对账差异能否定位来源。模型设计让行为更可解释，运行方案让这种解释在失败时仍然成立。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>回退不总是把代码版本退回去\u003c/h2>\u003cp>如果新模型已接收旧程序无法表达的部分付款，直接部署旧代码会丢失语义。真正可行的回退可能是暂停新入口、保留新账务处理、恢复旧的展示路径；也可能需要事先编写转换与补偿。每个阶段的退出方案要与已经产生的数据相匹配。\u003c/p>\u003cp>原书同时提醒不要在发布前夕贸然重构，也不要用技术炫耀代替领域洞察。风险控制不意味着永远等待完美证明，而是让一次变化有清楚的问题、有限的范围、可观察的收益和恢复办法。模型越能表达关键事实，后续的变化就越少依赖难以解释的补丁。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 一次两小时的探索\u003c/h2>\u003cp>选择最近一张真实需求单。前 20 分钟复述业务与例外；接着提出两个候选模型；用三条测试或一个代码尖峰比较；最后写决策记录。时间只是本课程建议，不是原书规定的仪式。\u003c/p>\u003cp>决定记录包括：问题、约束、候选方案、取舍、未知项、验证方式与撤销条件。若两种模型暂时难分优劣，保留更易回退且能获得反馈的方案。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 从旧模型迁移到新模型\u003c/h2>\u003cp>先固定重要现有行为，再建立新模型的核心测试。对数据做清点：是否存在不符合新不变量的历史状态？对接口做兼容：旧请求怎么翻译？对流程做切换：在途订单采用哪个版本？\u003c/p>\u003cp>采用分流、影子计算或逐入口切换时，别忽略双写一致性。数据库扩展—迁移—收缩可以降低部署耦合，但必须提供对账和回退策略。本段是工程补充，具体方案依赖系统状态。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 借重构顺手改全部技术栈\u003c/h2>\u003cp>同时改模型、语言、数据库与部署方式，问题出现时难以定位，也难以回退。先缩小变量。重构的验收标准应是特定业务行为更清晰、缺陷更少或修改成本下降，而不是“用了新框架”。\u003c/p>\u003c/section>\u003csection>\u003ch2>让专家看懂模型差异\u003c/h2>\u003cp>准备一个“之前 / 之后”的业务故事：以前取消部分货物要改三个状态，现在明确取消某个预订项并释放对应资源。若只能展示目录变化，说明你还没有说明模型收益。\u003c/p>\u003c/section>","answer":"确认付款与订单状态语义；清点旧记录并建立特征测试；增加独立付款记录及累计约束；兼容旧入口并分批切换；对账后收缩旧字段。真实收款发生后不能只回滚软件，应保留事实并以明确业务流程处理差异。","quiz":[{"prompt":"模型重构最可靠的收益证据是？","options":["目录更符合模板","具体业务变化更容易表达与验证","新增更多接口"],"answer":1,"why":"模型改进要回到业务复杂性与可维护性，而不是形式。"},{"prompt":"新模型不兼容历史数据怎么办？","options":["加载时偷偷修改所有记录","制定迁移、兼容或人工修复策略","忽略历史"],"answer":1,"why":"重建不应捏造新事实。历史异常需要明确处理。"}],"diagram":"","refs":["meituan24","go"],"caseTitle":"从单笔付款到部分付款","caseContext":"支持分次付款会改变付款与订单的关系。迁移既要处理新模型，也要处理历史状态和已经收款的事实。"},{"id":"14","n":14,"part":4,"title":"限界上下文：允许世界有多个正确模型","subtitle":"同一个词，可以在不同边界里拥有不同的精确定义。","pages":"356–420","tags":["限界上下文","上下文映射","ACL","共享内核","发布语言","持续集成"],"body":"\u003csection>\u003ch2>重点 · Bounded Context 是语义的一致性边界\u003c/h2>\u003cp>销售的“客户”关注商机，运输的“客户”关注收发货角色，结算的“客户”关注法律主体。每种模型都可以正确；问题来自无声混用。限界上下文明确模型在哪些代码、团队协作和用法范围内有效。\u003c/p>\u003cp>子域描述业务问题空间的一部分；限界上下文界定具体模型的适用范围；模块组织代码；微服务是部署与运行单元。它们可能相关，却不能按名称一一画等号。一个模块化单体可以有多个上下文，一个上下文也可能跨多个进程。\u003c/p>\u003c/section>\u003csection>\u003ch2>从三个“订单”看见边界\u003c/h2>\u003cp class=\"source-note\">原书依据：第 14 章，PDF 356–420 页。海风冷链航运为教学改编案例；API、事件版本及迁移运行机制为工程补充。\u003c/p>\u003cp>海风的销售、履约、结算都在谈订单。销售说“确认了”，意思是客户接受报价；履约说“确认了”，意思是运力已落实，可以执行；结算说“确认了”，意思是应收依据已核定。如果共用一个 \u003ccode>order.status=CONFIRMED\u003c/code>，每个团队都能写出看似正确的代码，组合起来却会把尚未获得舱位的货物当作已经承诺运输。\u003c/p>\u003cp>修复起点不是把状态枚举扩成三十项。先分别写出三个模型所回答的问题：销售决定承诺什么价格与条件；履约决定是否能按条件运送；结算决定谁在何时应付多少钱。销售的报价版本、履约的舱位预留、结算的应收分录各自有明确规则。订单号可以成为关联标识，但相同标识不意味着必须共享同一个对象。\u003c/p>\u003cp>这也解释了为什么按部门名称机械拆服务会失败：一个小团队可能同时维护多个模型，两个团队也可能因为共同维护承诺而必须频繁整合。边界需要同时解释语言、规则、使用范围与维护关系。部署在一起不会自动混淆语义，部署到不同机器也不会自动产生清晰边界。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>从一次变更识别模型冲突\u003c/h2>\u003cp>新增“企业月结”时，销售允许先确认报价后付款，履约仍需信用可用且有舱位，结算则按账期形成应收。假如三方都依赖 \u003ccode>is_paid\u003c/code> 决定能否确认，这次变更会横扫整个系统。它暴露的是把付款事实、信用政策和运输承诺绑在一个概念中。\u003c/p>\u003cp>可以把“报价已接受”“承运已承诺”“应收已入账”分开命名，再定义它们的衔接。销售接受不直接证明承运成功；履约返回拒绝或待确认时，销售如何向客户展示，要成为明确契约。边界不是把问题藏到网络另一端，而是让不同决定的权威清晰可见。\u003c/p>\u003cp>原书以“盲人摸象”说明：不同模型可能各自捕捉到有效部分。想统一它们，往往需要发现一个更深的新模型，而不是让一方的词汇统治全部系统。因此，遇到两个“客户”不应马上抽取全公司的 \u003ccode>Customer\u003c/code> 基类。一个对象代表签约主体，另一个代表现场收货人时，强行统一只会制造大量可空字段。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>上下文图上的线，必须附带责任\u003c/h2>\u003cdiv class=\"model-strip\" role=\"img\" aria-label=\"上下文之间的语义影响\">\u003cdiv>\u003cstrong>承运人平台\u003c/strong>\u003cspan>拥有运输跟踪事实\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>履约上下文\u003c/strong>\u003cspan>负责事实翻译与异常处置\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>客户通知上下文\u003c/strong>\u003cspan>负责通知策略与送达记录\u003c/span>\u003c/div>\u003c/div>\u003cp>一条有用的连接要写明交换什么、谁定义含义、谁承受变化以及谁维护翻译。承运人是跟踪协议的上游；海风主动调用它的查询接口，并不会使海风变成语义上游。业务影响方向与 HTTP 请求方向是两个维度。\u003c/p>\u003cp>现状图还应承认不舒服的事实：结算夜间直接读取旧库、某个共享状态没有唯一负责人、通知靠人工导表。把这些画成整洁的事件总线会掩盖真实迁移成本。关系模式用于解释和改进现实，不是给连线贴漂亮标签。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>关系模式的选择，是合作条件的选择\u003c/h2>\u003cp>\u003cstrong>共享内核\u003c/strong>适合双方确实愿意共同维护的小块模型。例如履约和报价共同依赖“温控区间”的交集语义，双方同意其变化必须联审，并运行双方测试。这不是把所有 DTO 放进 \u003ccode>common\u003c/code>。共享范围越大，协调成本越高；版本号只能标出差异，不能消除共同决策的需要。\u003c/p>\u003cp>\u003cstrong>客户—供应商\u003c/strong>要求下游需求真正进入上游计划。内部运力团队承诺支持履约所需的容量确认、变更通知和兼容窗口时，这个关系才成立。如果上游只按自己的目标排期，下游口头称自己是客户也没有用。验收例子、发布通知和争议处理路径，比架构图上的“合作”两个字更可靠。\u003c/p>\u003cp>\u003cstrong>遵奉者\u003c/strong>可以是理性方案：成熟的通用服务语义已经适用，海风没有足够收益去维护另一套模型，直接采用它能减少复杂度。相反，承运人把“交给末端”叫作 delivered，而海风核心承诺要求“收件人签收”，遵奉会破坏关键含义，此处翻译的成本值得承担。\u003c/p>\u003cp>\u003cstrong>各行其道\u003c/strong>适合没有足够集成价值的能力，例如一个小型内部培训报名工具无需加入订舱模型。\u003cstrong>开放主机服务\u003c/strong>解决多个使用方稳定接入的问题；\u003cstrong>发布语言\u003c/strong>解决交换内容的共同语义。一个稳定 HTTP 地址不等于发布语言，字段还需要单位、时区、状态定义、身份规则与兼容策略。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>把防腐层拆开看：连接、适配与翻译\u003c/h2>\u003cp>承运人原始接口返回 \u003ccode>{status: \"D\", at: \"2026-03-02T09:00:00+09:00\"}\u003c/code>。它的文档明确 D 表示交给末端合作方。连接代码负责认证、超时与重试；适配代码把杂乱接口包装为可调用的能力；语义翻译把 D 解释为本地的“已移交末端”。三种职责可以放在少量函数中，不必为了名字机械生成三层类。\u003c/p>\u003cpre>\u003ccode># Python：语义翻译片段；连接与持久化由调用方负责\nfrom dataclasses import dataclass\nfrom datetime import datetime\n\n@dataclass(frozen=True)\nclass CarrierFact:\n    kind: str\n    occurred_at: datetime\n\ndef translate_carrier_status(code: str, occurred_at: datetime) -&gt; CarrierFact:\n    if occurred_at.tzinfo is None or occurred_at.utcoffset() is None:\n        raise ValueError(\"承运事实必须携带时区\")\n    kinds = {\"D\": \"HandedToLastMile\", \"POD\": \"ProofOfDeliveryReceived\"}\n    if code not in kinds:\n        raise ValueError(\"未知承运状态，需要核对协议\")\n    return CarrierFact(kinds[code], occurred_at)\n\u003c/code>\u003c/pre>\u003cp>未知状态不能默认当作运输中或签收。工程上可以保留原始载荷、来源事件身份、收到时间和翻译版本，把无法解释的事实送入可重试或人工核对流程。收到签收凭证也不一定等于全部履约规则完成：本地模型仍需检查凭证身份、货物对应关系与有效性。\u003c/p>\u003cp>最危险的防腐层失败是“翻译器开始做决定”。例如它为了减少异常，遇到缺失签收时间就填当前时间；或自动补齐本地要求而外部从未给出的收件人身份。这会把未知变成伪事实。翻译可以重组和解释已有信息，不能替业务创造证据。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>同一上下文的持续集成，包含语言整合\u003c/h2>\u003cp>两位开发者分别增加 \u003ccode>confirm()\u003c/code> 与 \u003ccode>approve()\u003c/code>，测试全绿，但一个表示授信通过，另一个表示承运承诺。若团队认为两者只是同义词，模型已经分裂。Evans 所说的持续集成包括频繁合并代码、自动验证，以及不断修正共同理解；只自动构建镜像不够。\u003c/p>\u003cp>一条可操作的整合记录应把改变连接起来：术语“确认预订”现定义为运力和信用条件同时满足；相关领域方法、拒绝原因、验收例子、事件含义随之调整。若两个团队无法接受同一定义，要重新讨论边界，而不是长期靠注释维持两个方言。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>边界的迁移：先准备协作，再搬代码\u003c/h2>\u003cp>原书讨论从共享内核走向完整整合，强调这会改变团队结构和语言。一个稳妥起点是选择小范围共同概念，建立共同所有权与测试，验证整合节奏，再逐步扩大。若两边服务的用户群本来就需要不同概念，不应因为共享代码容易就合并上下文。\u003c/p>\u003cp>替换遗留系统则可沿业务功能逐段转移权威。先让新履约读取旧承运事实并翻译，再让一类冷链预订由新模型决策；旧系统仍承担未迁移业务。每一段要标明哪个系统可以写、如何核对结果、失败后如何恢复。迁移中防腐层可能先扩大后缩小，这不等于失败，而是共存阶段需要承担的工作。\u003c/p>\u003cp>工程补充：影子读取适合比较新旧解释，影子执行涉及占舱、扣款等副作用时必须隔离。回退代码不等于回退已发生的承诺；切换后发生的新业务事实，需要明确兼容、补偿或人工承接方式。上下文迁移最终改变的是业务责任，数据库搬家只是其中一环。\u003c/p>\u003c/section>\u003csection>\u003ch2>边界验证需要三种不同证据\u003c/h2>\u003cp>第一种是结构契约：状态字段是否存在、时间格式是否可解析、未知枚举如何处理。第二种是语义契约：承运人的 D 到底表示哪种交接，报价有效期从生成还是接受开始计算。第三种是运行契约：事件可能重复或乱序，接口超时后如何查清结果。这三种验证互相补充，字段完全兼容也可能产生严重业务误解。\u003c/p>\u003cp>例如承运人重复发送同一交接事件时，本地应识别这是同一事实；晚到事件需要保留其发生时间，而不是因为收到得晚就覆盖最新运输事实。若外部更正已报告事件，要明确原记录与更正之间的关联，不能无声改写历史。防腐层的长期维护既要追踪接口版本，也要追踪外部含义的改变。\u003c/p>\u003cp>判断边界是否有效，可以观察改变一侧模型时另一侧需要理解多少内部知识。若每次承运人增加一个内部状态都要求客户通知模块修改分支，翻译责任仍在泄漏。理想不是完全没有影响，而是变化能够在明确的位置被解释、接受或拒绝。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 边界怎么找？\u003c/h2>\u003cp>看语言何时变义、规则何时不同、数据权威归谁、团队如何协作以及变化是否同步。把同一张“订单”在销售、履约、结算中的必要字段和不变量分别写出来，通常比先讨论数据库拆分更有效。\u003c/p>\u003cp>不要让共享数据库成为共享语义的借口。上下文间若直接读对方私有表，就形成了隐蔽契约：字段迁移、状态解释与数据延迟都会传播。可以在单库阶段保持清楚的数据所有权和接口，再按需要演进。\u003c/p>\u003c/section>\u003csection>\u003ch2>重点 · Context Map 先画现状\u003c/h2>\u003cp>上下文图标明模型、连接方式、上游/下游、翻译责任和团队关系。它不是一张愿景图，也不是简单的服务调用拓扑。先承认哪些旧系统无法改变，哪些接口事实由别人控制，才有可执行的路线。\u003c/p>\u003cp>上游表示对下游的模型或契约施加影响，不等于网络请求箭头方向。下游调用上游 API 时，请求箭头和影响方向可能让人混淆；务必写图例。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>原书关系模式\u003c/th>\u003cth>适用情形\u003c/th>\u003cth>代价 / 边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Shared Kernel 共享内核\u003c/td>\u003ctd>两个团队小范围共同维护模型与代码\u003c/td>\u003ctd>共同改动与集成纪律；不能无限扩大\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Customer / Supplier 客户—供应商\u003c/td>\u003ctd>下游需求能进入上游计划，双方协商契约\u003c/td>\u003ctd>需要真实协作承诺，不是单方面自封客户\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conformist 遵奉者\u003c/td>\u003ctd>下游无影响力，选择直接适应上游模型\u003c/td>\u003ctd>节省翻译成本，牺牲自身表达自由\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anticorruption Layer 防腐层\u003c/td>\u003ctd>保护本地模型，翻译外部含义\u003c/td>\u003ctd>维护映射、失败语义和兼容版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Separate Ways 各行其道\u003c/td>\u003ctd>集成价值低于成本，允许独立解决\u003c/td>\u003ctd>可能重复工作；要确认业务真的不需协作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open Host Service 开放主机服务\u003c/td>\u003ctd>上游为多个使用方提供稳定接入协议\u003c/td>\u003ctd>需要管理协议演化，避免逐客定制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Published Language 发布语言\u003c/td>\u003ctd>上下文之间用有明确语义的交换格式\u003c/td>\u003ctd>不只 JSON 字段，还需单位、时间、状态含义\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>深挖 · 防腐层不是 HTTP Client 的新名字\u003c/h2>\u003cp>外部系统说 Delivered 指交给末端承运人，本地说 Delivered 指收件人签收。防腐层要把外部状态翻译为 HandedToCarrier，或者明确“无法确定最终签收”。仅把 snake_case 改 camelCase 并未保护语义。\u003c/p>\u003cp>可以由 facade、adapter、translator 等组成；不必都建成单独类。防腐层不能编造缺失事实。外部只给“处理中”，本地也许必须保留 Unknown/Pending，并用查询、对账或人工处理消除不确定。\u003c/p>\u003c/section>\u003csection>\u003ch2>原书的 Continuous Integration 不只跑 CI\u003c/h2>\u003cp>同一上下文中的模型变化需要频繁整合：代码、测试、术语和共同理解都要更新。每天绿色构建而团队对“确认”的定义不同，模型仍在分裂。共享内核尤其需要限制范围和协同节奏。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 边界测试与演化\u003c/h2>\u003cp>契约测试验证字段、单位、状态和兼容规则；翻译测试验证语义；集成测试验证认证、超时、重复与实际协议。接口返回 200 不代表业务理解一致。\u003c/p>\u003cp>合并上下文需要团队与语言逐步融合；拆分需要契约与数据所有权；替换遗留系统需要翻译和分阶段切换。将目录复制到新仓库，只改变了物理位置。先明确边界后再决定部署，通常更容易获得反馈。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 每接一个系统都造庞大 ACL\u003c/h2>\u003cp>成熟且符合本地语义的组件可以选择遵奉；低价值集成可以各行其道。防腐层的成本要由模型差异和变化风险支付。没有业务语义冲突时，简单适配器可能足够。\u003c/p>\u003c/section>\u003csection>\u003ch2>2015 Reference 补充 · Partnership 与 Big Ball of Mud\u003c/h2>\u003cp>官方速查将\u003cstrong>伙伴关系\u003c/strong>和\u003cstrong>泥球\u003c/strong>标为原书之后加入：前者强调双方交付相互依赖，后者承认并圈定模型混杂的区域。课程例子：订舱和运力团队必须共同上线新品时，应明确联合计划；遗留共享库语义混乱时，先标出现状并保护新边界。二者都不是一种 HTTP 协议。见官方 PDF 第 37、45 页。\u003c/p>\u003c/section>","answer":"路线优化提供开放接口与明确发布语言，订舱把运输要求转换为图搜索请求并验证结果。第三方承运人的 delivered 经防腐层转为 HandedToLastMileCarrier；不能映射为本地 SignedByRecipient。标明谁是状态权威及未知状态处理。","quiz":[{"prompt":"一个限界上下文必须对应一个微服务吗？","options":["必须","不必，语义边界与部署边界不同","必须至少三个服务"],"answer":1,"why":"部署还受性能、团队和运维约束影响。上下文首先解决模型一致性。"},{"prompt":"防腐层最关键的价值是？","options":["减少 HTTP 请求数","保护本地模型，明确翻译外部语义","把外部字段统一转为字符串"],"answer":1,"why":"技术协议适配只是一部分，语义翻译才是保护模型的核心。"}],"diagram":"contexts","refs":["fowler","reference"],"image":"contexts","caseTitle":"同一个 delivered，两个不同含义","caseContext":"第三方承运人的 delivered 表示交给末端承运人，本地系统的签收却表示收件人已收到。"},{"id":"15","n":15,"part":4,"title":"精炼：把最好的注意力给核心领域","subtitle":"核心不是“最底层”，而是业务取胜的地方。","pages":"421–458","tags":["核心领域","通用子域","领域愿景","突出核心","内聚机制","分离核心"],"body":"\u003csection>\u003ch2>重点 · Core Domain 由业务战略决定\u003c/h2>\u003cp>如果一家物流公司的优势是复杂冷链路线与履约保障，这可能是核心；账号登录虽然重要，却通常不构成差异化。另一家身份服务公司的登录能力恰好可能是核心。不能用技术难度或代码行数给核心排序。\u003c/p>\u003cp>最有经验的人如果都去造自研框架，核心业务只能由缺少支持的团队处理，DDD 的重心就倒置了。核心需要持续学习和优秀设计，不只是架构图中涂一种颜色。\u003c/p>\u003c/section>\u003csection>\u003ch2>从一个真实的投资问题开始\u003c/h2>\u003cp class=\"source-note\">原书依据：第 15 章，PDF 421–458 页。以下以海风冷链的教学案例推演精炼过程；投入排序与运行指标为工程补充。\u003c/p>\u003cp>海风有三项同时到来的需求：让登录支持更多身份源，做一套通用计费规则引擎，准确判断多段冷链运输是否可以承诺。三件事都能做得很复杂，但复杂并不是核心领域的判据。假设客户选择海风，是因为它能在转运、温控与时效同时受约束时给出可信承诺，并在异常后解释责任与安排恢复，那么第三项直接关系公司的竞争方式。\u003c/p>\u003cp>核心不是永远固定的一块代码。创业初期的优势也许是人工服务和渠道，软件模型只承担支撑；随着业务转向自动承诺与动态恢复，核心可能改变。识别核心时要问的是“什么能力做得不同，会改变客户选择或经营结果”，而不是“哪个团队想获得最多资源”。\u003c/p>\u003cp>原书对资源错配的提醒很具体：技术人员容易偏爱定义清楚的通用问题，例如时区处理，投入大量精力后核心业务模型仍然模糊。正确做法不是低估时区，而是把它隔离、可靠地解决，把持续学习的注意力留给差异化业务。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>一页领域愿景，怎样真正影响决定\u003c/h2>\u003cp>海风的领域愿景可以写成一段可用于争议判断的话：系统为高价值温敏货物形成可解释的运输承诺；承诺必须同时关联服务要求、可用能力和允许的风险；发生偏差时，保留事实与原承诺，支持有依据的恢复决策。它还应说明当前边界，例如暂不负责全行业运价预测，也不承担所有承运人的内部调度。\u003c/p>\u003cp>这段话不是宣传语。遇到“先报低价再人工兜底”的方案，可以检查它是否破坏可信承诺；遇到“把所有航段算法做成统一插件平台”，可以检查它是否直接推进当前价值。愿景把技术争论重新连接到业务目的，也允许随着真实认识改变而修订。\u003c/p>\u003cp>愿景不应藏着未经证实的效果数字。可以提出要减少错误承诺，但不能在未测量前写成已经降低一半。清楚区分业务目标、模型假设与观测结果，团队才知道哪些地方还需要学习。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>先突出核心，再分离核心\u003c/h2>\u003cp>假设现有 \u003ccode>ShippingService\u003c/code> 有两千行：读取客户资料、校验温控要求、调用图算法、拼接 SQL、计算通知文案、更新预订、调用报表。直接重构整个类风险很高。先在现状图中标出三个关键概念：\u003ccode>ServiceRequirement\u003c/code> 表达要求，\u003ccode>TransportPromise\u003c/code> 表达承诺，\u003ccode>RecoveryDecision\u003c/code> 表达偏差后的选择。\u003c/p>\u003cp>“突出核心”可以只是一份短小的概念与交互说明，链接到相关代码，并说明为何这三个概念共同决定价值。它允许新人绕开大量技术细节先理解业务。文档越像第二份完整代码，维护越困难；它应保留核心关系、主要不变量和导航，而不是复制每个字段。\u003c/p>\u003cdiv class=\"model-strip\" role=\"img\" aria-label=\"精炼核心的渐进步骤\">\u003cdiv>\u003cstrong>标出概念\u003c/strong>\u003cspan>识别承诺与恢复的关键决定\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>整理接口\u003c/strong>\u003cspan>把外部数据变成明确输入\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>分离实现\u003c/strong>\u003cspan>让核心只依赖必要能力\u003c/span>\u003c/div>\u003c/div>\u003cp>然后才开始“分离核心”：把承诺判断聚合到有业务名字的模块，移走通知格式与数据库操作，使外部依赖以清楚的能力出现。例如核心需要的是“候选运输能力”，不是某张遗留运力表的二十个字段。每次分离都用既有业务案例验证，避免搬动文件后留下同样的隐蔽耦合。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>为什么分离时会发现新知识\u003c/h2>\u003cp>原书的航运精炼案例在整理核心时进一步明确，客户协议应当约束具体处理步骤。这个变化说明精炼不是文件整理：当注意力集中到“按客户要求可靠交付”上，之前隐藏的规则会变得明显。\u003c/p>\u003cp>海风也会遇到类似问题。初版只检查整条路线标记为冷链；进一步推演发现，转运等待区可能没有温控能力。此时要求必须作用到每一个会影响温度的处理步骤，而不仅是船舶或整条路线标签。新的核心关系可以是“服务要求约束运输与停留步骤”，并要求每个步骤提供符合条件的证据。\u003c/p>\u003cp>这时应让模型承认不确定：缺少等待区数据时，结果可能是待核实，而不是默认通过。一个漂亮的核心 API 如果把未知条件吞掉，会把业务风险藏得更深。精炼的成功标准，是重要决定更容易被解释和验证。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>通用子域与内聚机制，为什么不能混为一谈\u003c/h2>\u003cp>通用子域仍描述业务，例如标准身份管理、地址规范化或通常的会计能力。它可以有自己的概念与规则，只是没有必要为当前公司的差异化重新发明。采用成熟产品时仍需评价语义适配、可用性、退出成本和集成边界；“通用”不意味着“随便选一个”。\u003c/p>\u003cp>内聚机制则封装解决某类计算问题的手段。例如图路径搜索接受节点、边与成本，返回候选路径；它并不自动知道客户承诺、禁止转运、温控证据是什么。核心模型负责把业务问题正确表达为搜索约束，并解释结果。把复杂算法隐藏在一个 \u003ccode>Utils.calculate()\u003c/code> 中既没有明确能力，也没有减少理解成本。\u003c/p>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>部分\u003c/th>\u003cth>海风中的含义\u003c/th>\u003cth>变化的主要原因\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>核心模型\u003c/td>\u003ctd>什么运输可以承诺，偏差后怎样恢复\u003c/td>\u003ctd>客户价值与业务认识改变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>通用子域\u003c/td>\u003ctd>成熟的身份、标准账务等业务能力\u003c/td>\u003ctd>相关业务规则与产品能力改变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内聚机制\u003c/td>\u003ctd>图搜索、约束求解、数学运算\u003c/td>\u003ctd>算法与性能要求改变\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>同一个算法在另一家公司可能就是核心竞争力。因此这张表只适用于当前业务假设，不能变成“算法永远属于基础设施”的定律。判断关注的是知识和差异化在哪里，而不是文件扩展名或技术难度。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>机制怎样接受业务问题，又不吞掉业务含义\u003c/h2>\u003cp>用图算法寻找最短路径时，初版只把航段价格作为边权。它能算出一条很便宜的路线，却可能包含六小时无温控转运。修复不是让通用图算法直接读取客户合同，而是让核心先把不满足硬约束的候选排除，再让搜索机制优化可行方案。结果返回后仍要确认它满足当前要求与有效时间，特别是能力数据已经变化时。\u003c/p>\u003cp>假如硬约束之间存在复杂组合，简单删边也可能不够。例如整程最多一次换装是路径级约束，单条边自己无法决定。此时应选择能表达该问题的搜索状态或约束机制，保持“为什么这条路线可接受”的领域解释，而不是为了继续使用熟悉算法而悄悄放宽规则。\u003c/p>\u003cp>这就是内聚机制的边界：它承担一个有清晰数学或算法性质的问题，核心承担业务语义与正确建模。抽出机制既没有消灭复杂性，也不代表全部逻辑都能变成配置；它只是把不同性质的知识放在更合适的位置。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>抽象核心：保留重要关系，而非抽空业务\u003c/h2>\u003cp>海运与铁路具有不同的班次、装载和异常处理，但海风可能反复使用一组稳定关系：服务要求限制候选方案，承诺固定被接受的条件，实际事实用于判断偏差，恢复决定重新安排未来动作。把这些关系提炼为小而清晰的接口，有助于理解不同业务形态的共同结构。\u003c/p>\u003cp>危险的抽象是 \u003ccode>Thing\u003c/code>、\u003ccode>Rule\u003c/code>、\u003ccode>Action\u003c/code> 三个万能对象。它们几乎可以描述任何系统，也因此没有表达运输的重要知识。好的抽象应保留不能随意替换的语义，例如承诺与事实不能互相覆盖，恢复计划只能改变未来的安排。\u003c/p>\u003cp>抽象核心也不是提前规定全部扩展点。若新增铁路业务每次都要求修改公共接口并添加特例标志，说明共性可能还没有稳定。可以保持两个较清楚的具体模型，通过翻译协作，等真正的共性出现再提炼。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>把设计重点落到人和日常工作\u003c/h2>\u003cp>精炼会影响人员安排。最懂运输限制的人不能只在启动会议出场；有能力进行模型设计的开发者也不应全被抽去造框架。核心团队需要持续接触拒绝承诺、改路失败、客户争议等高信息量案例，因为这些反例会改变模型。\u003c/p>\u003cp>工程中可以用三类信号检查投入是否有效：新增业务条件需要修改哪些概念，事故是否集中在同一类隐含规则，专家与开发者能否用同一组词解释结果。这些信号比“拆出了多少服务”“减少多少行代码”更接近精炼目的。代码缩短可能来自丢失规则，也可能来自更好的表达，需要结合行为判断。\u003c/p>\u003cp>支撑部分仍然必须可靠。账号安全、数据备份、准确记账等能力即使不构成差异化，也不能降格为可忽略。战略区别在于投入方式：成熟问题优先采用可靠方案、明确契约和运营保障；核心不确定性则需要更多建模、实验和优秀设计者的持续参与。\u003c/p>\u003c/section>\u003csection>\u003ch2>重点 · Generic Subdomains 不等于必须造通用平台\u003c/h2>\u003cp>成熟、非差异化的业务能力可以采购、采用现成方案、外包或用简单方式实现。通用子域仍是有业务语义的领域，例如结算中的标准功能；它不等同于数据库连接池这种技术机制。\u003c/p>\u003cp>先权衡集成与定制成本。为了未来复用，把一个内部小功能设计成多租户万能平台，可能消耗了比直接解决问题更多的资源。原书明确区分“通用”与“必须可复用”。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>精炼手段\u003c/th>\u003cth>最小动作\u003c/th>\u003cth>适合解决的问题\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Domain Vision Statement 领域愿景\u003c/td>\u003ctd>一页说明价值、差异化与范围\u003c/td>\u003ctd>大家不知道设计为何服务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Highlighted Core 突出核心\u003c/td>\u003ctd>在文档/代码图中标出关键概念\u003c/td>\u003ctd>核心淹没在实现细节中\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cohesive Mechanisms 内聚机制\u003c/td>\u003ctd>把复杂计算/解析机制独立封装\u003c/td>\u003ctd>技术细节遮蔽领域表达\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Segregated Core 分离核心\u003c/td>\u003ctd>把核心概念与支持部分明确分开\u003c/td>\u003ctd>业务核心难以独立理解和演进\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Abstract Core 抽象核心\u003c/td>\u003ctd>提炼多个情形的稳定基本关系\u003c/td>\u003ctd>特例太多，核心思想难以看清\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>深挖 · 内聚机制与通用子域\u003c/h2>\u003cp>路线搜索算法作为可替换图算法，可能是内聚机制；运输时效承诺如何定义和权衡可能属于核心领域。算法是否核心要看企业差异化来源，不能固定认定“算法全是基础设施”。\u003c/p>\u003cp>分离核心也有成本：模型转换、协作边界和重复概念。先突出核心、写愿景就能产生价值，不必马上重构出独立服务。抽象核心要由多次真实场景提炼，不是预设万能基类。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 给投资排序\u003c/h2>\u003cp>列出各业务能力的差异化贡献、变化频度、失败影响和当前理解缺口。优先对核心高变化部分建模，对通用稳定部分保持简单。用具体需求验证排序，战略变化后重新评估。\u003c/p>\u003c/section>\u003csection>\u003ch2>踩坑 · 支撑部分不重要？\u003c/h2>\u003cp>非核心仍可能有严重可靠性与合规要求。精炼意味着不同的投入方式，不是允许质量失控。支付接入未必是差异化核心，但错误收款不可接受，应该用成熟机制、契约和对账保证。\u003c/p>\u003c/section>","answer":"路线承诺与温控异常处置可能是核心，应投入业务专家与强建模能力；登录可用成熟方案；账单可能是支持或通用能力，但仍需高质量和对账。若独特计费能力是竞争优势，账单也可能进入核心，需要业务战略验证。","quiz":[{"prompt":"核心领域等于技术最难的部分吗？","options":["是","不一定，要看业务差异化","等于所有底层库"],"answer":1,"why":"核心由业务价值与战略界定，技术难度只影响实现成本。"},{"prompt":"通用子域应该？","options":["都自研成框架","根据成本选择现成方案或适度实现","完全不测试"],"answer":1,"why":"通用不强迫复用化，也不降低可靠性底线。"}],"diagram":"core","refs":["meituan24"],"caseTitle":"核心取决于公司靠什么取胜","caseContext":"对以高价值冷链可解释履约为卖点的公司，路线承诺、登录、账单和温控异常处置的投入方式不应相同。"},{"id":"16","n":16,"part":4,"title":"大尺度结构：给系统秩序，留模型生长","subtitle":"结构应帮助理解，不能成为全系统的紧身衣。","pages":"459–506","tags":["演化秩序","系统隐喻","职责分层","知识级别","可插拔框架"],"body":"\u003csection>\u003ch2>重点 · Evolving Order 演化的秩序\u003c/h2>\u003cp>大型系统需要共同组织方式，否则局部模型难以组合。但一套不适合领域的大结构，比没有结构更糟。原书强调从真实经验中形成秩序，保持修改与放弃的可能性。\u003c/p>\u003cp>上下文划语义边界，精炼分投入重点，大尺度结构给跨局部的组织原则。三者互补，不能用一个大目录结构代替另两个问题。\u003c/p>\u003c/section>\u003csection>\u003ch2>一个越来越难读懂的调度系统\u003c/h2>\u003cp class=\"source-note\">原书依据：第 16 章，PDF 459–506 页。运输产品与承诺版本案例为教学改编；代码仅示意领域关系，发布与持久化机制另行设计。\u003c/p>\u003cp>海风扩展到船舶、铁路和仓库后，局部模块都能解释自己的代码，跨模块讨论却开始失控。有人把船的冷藏能力叫“规则”，有人把客户要求叫“配置”，还有人把实时温度叫“状态”。所有内容都可以塞进一个“运输管理”模块，但这个名字没有告诉开发者谁依赖谁、变化发生在哪一层。\u003c/p>\u003cp>大尺度结构给出的不是全部类图，而是少量共同原则，让一个新概念到来时有可理解的位置。例如“设备具备什么能力”“现在发生了什么”“计划应该怎样选择”是不同性质的问题。结构若能解释这种差异，就能帮助团队协调；若只要求目录长得整齐，它不会产生同样的价值。\u003c/p>\u003cp>Evans 强调演化的秩序：从已有设计中观察规律，把有效规律明确化，再让实践修正它。它不是没有约束，也不是先规划一个永不改变的总架构。好的约束帮助局部设计，坏的约束迫使业务伪装成架构喜欢的形状。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>职责分层：能力、运行、政策与决策支持\u003c/h2>\u003cp>海风可以尝试四种领域职责。能力层描述船、站点、设备和航线能提供什么；运行层记录货物在哪里、如何被处理、设备当前是否可用；政策层表达哪些选择可接受；决策支持层比较候选方案，帮助人或系统做出计划。这里的“层”不是页面、服务、数据库那套技术分层，它们都可能位于领域模型内部。\u003c/p>\u003cdiv class=\"model-strip\" role=\"img\" aria-label=\"运输领域的职责分层\">\u003cdiv>\u003cstrong>能力\u003c/strong>\u003cspan>可用设施与运输能力\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>运行\u003c/strong>\u003cspan>实际装卸与在途事实\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>政策与决策\u003c/strong>\u003cspan>约束选择、安排未来\u003c/span>\u003c/div>\u003c/div>\u003cp>一个具体例子是超温：传感器或人工核验发现货物已经超温，运行模型必须能够记录这个事实。不能因为政策说“不允许超温”，就拒绝事实写入，让系统假装一切正常。政策随后根据事实决定隔离、检验、改路或报告。\u003c/p>\u003cp>这带来依赖与通知的区别。运行模型不需要直接依赖某一种客户赔付政策；它可以产生明确的事实通知，由政策侧解释。事件只是可选的通信机制之一，关键是低层如实表达世界，高层决定如何响应。对延迟、重复和丢失的处理属于运行协议，不能因为画了层次就认为自动得到保证。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>结构也可能错：让反例挑战层次\u003c/h2>\u003cp>假如团队把“能力”理解成绝对稳定的静态主数据，就会被船舶检修、临时断电和站点关闭击穿。需要区分设施的设计能力与某个时间区间内可兑现的能力，而不是为每个例外在上层偷偷覆盖字段。\u003c/p>\u003cp>如果所有政策都只能从上向下单向调用，而异常处置必须收到运行反馈，架构就需要允许一种明确的反馈路径。反馈不意味着随意形成双向源码依赖。可以用事实、查询结果或稳定的接口传递信息，让各层保留自己的责任。\u003c/p>\u003cp>原书提醒，没有适用的结构时，不合适的结构比没有更糟。一个小型固定线路订舱模块也许不需要四层领域职责；它只需要清楚的不变量和接口。大尺度原则应给复杂部分秩序，同时允许简单部分保持简单。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>知识级别：让规则本身成为受约束的对象\u003c/h2>\u003cp>海风开始销售三种运输产品：冷藏标准、冷冻加急、药品专线。把这些写死成三个子类最初很直观，但运营随后需要调整允许温度、转运次数和服务组合。如果每次都发版，变化成本高；如果把所有条件变成任意 JSON，又可能配置出无法解释的产品。\u003c/p>\u003cp>知识级别在这两端之间提供结构。\u003ccode>ServiceDefinition\u003c/code> 描述一个产品版本允许的温度区间、转运上限及必要证据；\u003ccode>ShipmentCommitment\u003c/code> 是按该定义形成的具体承诺。前者约束后者。知识级别不是任意元编程，它仍由普通领域对象构成，而且有自己的不变量。\u003c/p>\u003cp>原书通过员工类型、工资和退休计划展示同类思路：员工类型决定员工可采用的规则组合。类型对象由有权限的人调整，具体员工由日常业务人员维护。两种角色操作不同层次，不能因为都落在数据库就混成同一类配置表。\u003c/p>\u003cpre>\u003ccode># Python：两个领域层次；发布、版本查找与持久化省略\nfrom dataclasses import dataclass\nfrom decimal import Decimal\n\n@dataclass(frozen=True)\nclass ServiceDefinition:\n    code: str\n    version: int\n    min_c: Decimal\n    max_c: Decimal\n    max_transfers: int\n\n    def __post_init__(self):\n        if self.version &lt; 1 or self.min_c &gt; self.max_c or self.max_transfers &lt; 0:\n            raise ValueError(\"无效的运输产品定义\")\n\n    def allows(self, min_c: Decimal, max_c: Decimal, transfers: int) -&gt; bool:\n        return (self.min_c &lt;= min_c &lt;= max_c &lt;= self.max_c\n                and 0 &lt;= transfers &lt;= self.max_transfers)\n\n@dataclass(frozen=True)\nclass ShipmentCommitment:\n    tracking_id: str\n    definition_code: str\n    definition_version: int\n\u003c/code>\u003c/pre>\u003cp>这段代码中，具体运输的承诺温度范围必须被产品允许范围包含，转运次数也不能超限。它只说明类型与实例的约束关系。创建承诺时仍需查找正确版本、验证实际能力、保存承诺内容，并确定温度字段究竟描述货物要求还是运输承诺；不能把二者都叫“温度”后随意互换。\u003c/p>\u003cp>例如产品定义允许 2–8°C，某票货物只允许 3–5°C。产品支持这种更窄的承诺，并不证明任意一台支持 2–8°C 的设备都能稳定兑现 3–5°C；还必须根据具体设施的控制能力和运行证据判断。知识级别表达允许哪些业务组合，现实能力决定此刻哪些组合真的可交付。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>可配置不等于可以悄悄改写历史\u003c/h2>\u003cp>产品第 3 版允许两次转运，第 4 版只允许一次。昨天接受的订单应该怎样执行？若代码每次都读取最新定义，昨天合法的承诺可能今天突然非法。这个问题必须由业务决定：旧承诺继续沿用原条件，还是必须迁移并获得客户重新确认。\u003c/p>\u003cp>一种常见设计是定义发布后不可变，新变化生成新版本，承诺引用形成时的版本并保存必要快照。快照不是万能答案：如果只存产品名而没有关键条款，旧定义下线后仍无法解释历史；如果重复所有配置，则需要治理冗余与证据来源。\u003c/p>\u003cp>还要区分新产品规则与外部强制限制。旧合同可以保留原承诺，但设施已经故障时不能继续执行不可能的运输；规则有效性、现实能力和补救义务需要分别建模。把所有问题归结为“锁定旧配置”会让系统忽略真实世界的变化。\u003c/p>\u003cp>配置发布也需要明确授权、验证、审计和回退。回退定义只影响后续选择，不会自动撤销已确认订单。若运营必须理解复杂表达式、循环和副作用才能安全配置，知识级别已经滑向难以维护的编程语言，需要重新收紧表达能力。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>可插拔组件框架：稳定的是业务协议\u003c/h2>\u003cp>当海运、铁路和仓储都有成熟的能力接口，可以把共同交互提炼出来，例如查询某时间区间的能力、请求预留、确认结果、释放指定预留。一个组件可以是本地代码，也可以封装外部系统；插件并不天然意味着动态加载或单独部署。\u003c/p>\u003cp>难点在于“共同”的含义。海运返回可承诺容量，某铁路接口只返回估计可用量，若共同接口都叫 \u003ccode>Available()\u003c/code>，替换后业务保证就发生了变化。应明确结果的保证等级、有效期和失败语义，而不是只要求实现相同函数签名。\u003c/p>\u003cp>框架的抽象核心一旦被许多组件依赖，修改成本很高。核心业务还在快速探索时，过早固定统一协议可能把发现新模型的能力锁住。先让两三个真实实现暴露稳定共性，再提炼协议，比从一个实现猜测未来全部扩展点更可靠。\u003c/p>\u003cp>协议变化要考虑老组件。把“预留成功”从暂占五分钟改为无限期承诺，即使字段完全不变也是破坏性语义变化。可以新增明确的新操作或版本，规定旧组件能力边界，让调用者根据能力选择。用默认值悄悄兼容，会把无法满足的保证转移给运行现场。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>系统隐喻与最小约束\u003c/h2>\u003cp>把海风比作“运输指挥台”，有助于解释信息汇聚与异常处理，但它也可能误导团队，以为所有决定必须由一个中央对象作出。隐喻只是沟通工具，不能盖过业务证据。它最好能被一句话说清适用之处和失真之处。\u003c/p>\u003cp>一套有用的大尺度结构最终应很短：实际事实不因不符合计划而被拒绝；承诺引用明确的业务条件；政策使用能力与运行事实作决定；外部组件必须履行可解释的契约。每条原则都能在具体设计中找到理由，也能被反例修正。它的价值是让开发者在新增场景时知道如何推理，而不是让所有模块使用相同数量的目录。\u003c/p>\u003c/section>\u003csection>\u003ch2>System Metaphor 系统隐喻\u003c/h2>\u003cp>隐喻可以帮助团队快速理解，例如把调度系统比作“指挥台”。但隐喻必然有失真处：它可能暗示所有决策集中，而真实业务需要多个自治团队。记录隐喻适用的部分，别强迫所有对象配合比喻演戏。\u003c/p>\u003c/section>\u003csection>\u003ch2>Responsibility Layers 职责分层\u003c/h2>\u003cp>领域内部可能区分能力、运营、决策/政策：船舶与港口能做什么，当前运输如何执行，未来计划如何选择。这种分层强调高层依赖低层提供的能力与事实。\u003c/p>\u003cp>它与第 4 章的 UI / Application / Domain / Infrastructure 不同。后者分技术职责，前者组织领域模型。把两套维度混成同一个目录，容易出现概念层与技术层交叉污染。\u003c/p>\u003c/section>\u003csection>\u003ch2>Knowledge Level 知识级别\u003c/h2>\u003cp>当一组对象描述规则与类型，另一组对象依据这些描述运行，就出现知识级别。比如产品定义规定可选运输服务和限制，具体订单按某个定义版本接受校验。它不等于随处使用反射或把全部规则放进 JSON。\u003c/p>\u003cp>配置仍然是行为的一部分，必须有类型约束、版本、权限、审核和迁移。修改服务定义后，旧订单按旧规则还是新规则执行？这是领域决策，不是“读取最新配置”能自动回答的。\u003c/p>\u003c/section>\u003csection>\u003ch2>Pluggable Component Framework 可插拔组件框架\u003c/h2>\u003cp>当模型与协作协议足够成熟，可以允许替换实现或组合组件。收益是复用与扩展；风险是抽象过早固化，核心领域变化反而被框架锁死。\u003c/p>\u003cp>先验证两个或更多真实变化场景的共同点，再提炼稳定协议。若所谓扩展点每次都要加特殊参数，说明抽象边界仍未找到，不该继续堆插件钩子。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 用最小约束换共同理解\u003c/h2>\u003cp>约束应能解释为什么存在：例如规划依赖已公布的运输能力，能力模型不反向依赖某一个报价页面。把依赖规则写在图和评审准则里，工具检查只覆盖真正稳定的边界。\u003c/p>\u003cp>不要求每个模块都使用同样结构；局部简单时保持简单。架构不是为了让所有目录对称，而是让团队在变化时知道哪里可以独立行动。\u003c/p>\u003c/section>","answer":"产品定义形成版本化规则；新订单绑定当时版本并校验。历史订单按已承诺版本履行，或走显式变更流程并重新确认。产品定义不能静默篡改已发生事实。技术配置发布要配合兼容验证与回退。","quiz":[{"prompt":"本章职责分层与第 4 章技术分层是否相同？","options":["完全相同","不同，本章强调领域职责秩序","都只是文件夹名字"],"answer":1,"why":"两个不同组织维度可以并存，但不能混淆。"},{"prompt":"可插拔框架何时最值得投入？","options":["需求还没清楚时","稳定模型与真实替换需求已被验证时","只有一个固定流程时"],"answer":1,"why":"过早框架化会固化错误抽象，增加核心演化成本。"}],"diagram":"","refs":["reference"],"caseTitle":"规则配置不能悄悄改写承诺","caseContext":"运输产品新增“必须全程冷链”。新规则定义和已存在订单之间，需要明确的版本与生效范围。"},{"id":"17","n":17,"part":4,"title":"战略合流：把模型、团队与交付连起来","subtitle":"最后一章不是总结术语，而是做出一项可执行决定。","pages":"507–520","tags":["战略设计","现状评估","组织协作","反馈","最小主义"],"body":"\u003csection>\u003ch2>三张图，回答三个不同问题\u003c/h2>\u003cp>上下文图：谁与谁共享什么含义，跨界如何协作？核心图：最值得投入的业务能力是什么？大尺度结构：局部模型如何形成可理解的整体？一张微服务拓扑不能完整回答这三问。\u003c/p>\u003cp>战略设计从评估现状开始：现在真实的边界在哪里、术语有何冲突、核心是否被技术细节淹没、团队是否有足够能力和反馈路径。先知道站在哪里，再决定往哪里走。\u003c/p>\u003c/section>\u003csection>\u003ch2>把一次业务变化放到三种视角里\u003c/h2>\u003cp class=\"source-note\">原书依据：第 17 章，PDF 507–520 页。以下上线与迁移路径为工程教学案例，不是原书项目成效的复述。\u003c/p>\u003cp>海风准备增加“企业月结冷链承诺”：客户不必先付款，但必须在信用额度内获得可兑现的冷链运力。团队马上面临三类问题。信用系统、订舱系统和履约系统中的“确认”含义是否相同？竞争优势主要来自授信，还是来自可信运输与异常恢复？产品规则、具体承诺和运行事实怎样组织？\u003c/p>\u003cp>上下文图回答第一类问题，避免把授信通过当作已经占到舱位；精炼回答第二类问题，避免把全部人力投入通用授信接口；大尺度结构回答第三类问题，避免规则版本、承诺和实际运输混在同一状态字段中。三个视角互相影响，但不能彼此替代。\u003c/p>\u003cp>例如选择单体部署，并没有回答信用与履约是否应共享模型；选择微服务，也没有回答取消时如何释放信用与舱位。真正的战略决定必须最终落到具体业务行为与协作责任。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>评估现状：先找到最有信息量的矛盾\u003c/h2>\u003cp>原书的起点是现状评估，包括上下文图、语言、核心、技术条件和团队能力。海风可以从一条实际流程观察：客服接受报价后，预订服务写“成功”；信用服务稍后拒绝额度；夜间任务再撤销预订。客户收到的“成功”究竟是什么承诺？如果团队给出三种回答，这比目录是否符合某种架构规范更值得先解决。\u003c/p>\u003cp>现状证据还包括调用链、失败工单、人工补偿记录与实际数据所有权。图上标着一个系统负责预订，实际客服后台可以直接改其表，真正的边界就比图更复杂。模型讨论需要把这种旁路纳入视野，否则新设计会被旧操作立即破坏。\u003c/p>\u003cp>评估的结果不是全系统整改清单，而是一个可控的问题。例如先让月结客户预订明确区分“申请已收到”“资源已承诺”和“申请被拒绝”，并规定对应的客户提示。这个选择会同时牵引语言、状态、接口与运行监控。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>先形成一条完整的业务链\u003c/h2>\u003cp>一个足够小但完整的实现范围，可以只支持指定客户组、指定航线与一种冷链产品，却要走通申请、信用判断、舱位预留、承诺确认和失败呈现。只实现领域类而不接入失败路径，无法验证模型是否真的改善业务。\u003c/p>\u003cp>假设信用与运力各有自己的原子边界，不能用一个普通本地事务同时提交。团队需要决定业务允许什么中间状态：可以先占信用和舱位，全部成功后形成承诺；某一步失败则释放已获得的资源。也可以由业务接受短暂待确认状态。哪一种成立，要看承诺成本和资源规则，而不是根据技术模板选名字。\u003c/p>\u003cdiv class=\"model-strip\" role=\"img\" aria-label=\"月结预订的业务决策链\">\u003cdiv>\u003cstrong>申请已收到\u003c/strong>\u003cspan>身份、产品与意图明确\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>资源处理中\u003c/strong>\u003cspan>信用与运力各自确认\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>承诺或拒绝\u003c/strong>\u003cspan>对客户给出可解释结果\u003c/span>\u003c/div>\u003c/div>\u003cp>工程补充：跨边界流程需要持久状态、稳定操作身份、可重试步骤和恢复入口。超时只说明调用方暂时不知道结果，不等于对方拒绝。释放也可能失败，不能把补偿当作必然成功的魔法撤销。中间状态、查询与对账是业务流程的一部分，不应只存在于日志里。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>渐进迁移：每一步只保留一个决定权威\u003c/h2>\u003cp>新旧系统并存时，最先明确的不是怎么同步两张表，而是谁有权接受承诺。可以先只把一组新订单路由给新模型，旧订单仍由旧系统负责；共享查询通过翻译提供统一视图。订单归属必须可识别，客服操作也必须遵守它。\u003c/p>\u003cp>为了验证新模型，可以先让它读取同一组事实，计算“如果由新模型决定，会得到什么结果”，与旧结果比较。差异不一定说明新模型错了，也可能暴露旧规则或新理解的错误；需要业务专家判定。影子计算不能真的占舱或扣款，否则所谓验证会制造额外业务。\u003c/p>\u003cp>切流条件应该具体，例如同一输入的关键决策差异已经解释，资源回收可以恢复，客服能够处理待确认订单，历史数据可以被准确识别。回退条件也要具体：哪些新订单能继续由新系统完成，哪些需要人工接管，能否阻止新的申请进入。简单切回旧代码不保证旧系统理解新状态。\u003c/p>\u003cp>原书反对冻结的总体蓝图，并不意味着没有目标。目标可以清楚，实施路线则根据每一步学到的知识调整。某个边界迁移后发现协作成本增加，应重新评估模型和组织条件，而不是为了维持最初图纸继续投入。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>一份有用的决定记录\u003c/h2>\u003cp>“采用事件驱动架构”太宽泛，难以被验证。更有用的记录可以写成：月结订单首先处于待确认；只有获得信用和舱位的有效承诺后才对客户确认；同步等待超过窗口后转入可查询的处理中状态；取消与确认竞争时，由预订流程的当前版本决定哪个转换成功。\u003c/p>\u003cp>同一记录还应说明未选方案。例如没有把信用和全部航次并入一个大聚合，因为归属、加载规模和并发热点差异太大；没有把 HTTP 超时直接当失败，因为对方可能已提交；没有承诺无条件自动补偿，因为部分外部步骤缺少可靠撤销能力。\u003c/p>\u003cp>这种记录保留了假设、业务代价和重新评估信号。它不是为当前选择寻找永久正确的证明，而是让后来者知道决定依据。外部系统新增幂等查询接口，或月结流量变成瓶颈时，团队便能判断哪些前提已经变化。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>战略由谁决定：集中协调与一线发现相连\u003c/h2>\u003cp>原书讨论两种有价值的形成方式：有良好沟通能力的应用团队逐步形成共同秩序；或由面向应用团队的架构团队协助协调。两者共同点是战略建立在真实开发反馈上。架构师可以帮助跨团队看见重复问题，但不能仅靠职位代替业务理解。\u003c/p>\u003cp>海风可以让履约负责人、信用负责人、资深开发者与业务专家一起决定跨边界契约。履约团队负责承运承诺语义，信用团队负责额度判断语义；跨边界状态与失败处理由双方共同确认。实现团队仍然需要足够设计能力，不能被降格为按照总图填代码的人。\u003c/p>\u003cp>意见冲突时，用一组具体场景而非术语投票。例如客户在确认过程中取消、信用已释放但舱位未释放、承运人补发旧事件。能解释这些场景的方案，比“我们必须事件驱动”更有说服力。暂时无法达成一致的条件要保留为显式假设，并安排验证。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>六项原则如何变成日常动作\u003c/h2>\u003cp>\u003cstrong>让决定抵达团队\u003c/strong>，意味着决定进入代码接口、业务例子和日常讨论，而不只是架构会议纪要。\u003cstrong>吸收反馈\u003c/strong>，意味着开发者发现规则导致无解状态时，可以推动修改规则。\u003cstrong>允许演化\u003c/strong>，意味着关键契约有版本与迁移方式，而不是宣布以后永远不变。\u003c/p>\u003cp>\u003cstrong>保留应用团队的优秀设计者\u003c/strong>，保证最难的业务规则有人真正理解。\u003cstrong>保持最小主义与谦逊\u003c/strong>，意味着每个跨团队约束都要证明自己减少了多少理解成本，又限制了什么。\u003cstrong>对象专精而开发者通才\u003c/strong>，意味着对象责任清楚，但人要越过组织边界了解上下游，架构师写应用代码，开发者也理解运行与业务。\u003c/p>\u003cp>这些原则互相支撑。若决定只能由中央团队修改，反馈就很难吸收；若优秀设计者都离开应用团队，一线就很难提出有质量的替代方案；若每次反馈都要求推倒全部结构，团队又会失去协作的稳定基础。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>衡量收益：把模型质量与运行质量连接\u003c/h2>\u003cp>上线后要观察真实行为，而不是数模式数量。模型层面可看：一个新温控规则是否局部表达，团队解释“承诺”是否一致，历史决策能否追溯到当时条件。工程层面可看：并发冲突后是否正确重判，重复请求是否形成重复承诺，待确认状态停留多久，对账能否找出资源泄漏。\u003c/p>\u003cp>还需要区分技术成功率与业务结果。接口返回成功只说明申请被接受时，不能用它证明承诺完成；补偿任务执行成功也不一定证明外部资源已经释放。指标名称应与领域语言对齐，例如“承诺形成耗时”“超时待核实数量”“未完成资源回收数量”，而不是只有通用 HTTP 延迟。\u003c/p>\u003cp>统计前先确定口径、样本范围和基线，再判断变化。业务量、产品复杂度和人员变化都可能影响指标。若没有足够数据，可以如实记录具体案例改善和仍存在的风险，不必把每次重构包装成百分比收益。\u003c/p>\u003c/section>\n\u003csection>\u003ch2>在必要之处保持简单\u003c/h2>\u003cp>并非所有业务都需要同样的建模强度。一个稳定的内部地址维护页面可能只需清楚的校验与权限；复杂承诺才需要更丰富的模型。用 DDD 改造简单功能不会自动产生价值，反而可能增加导航与协作成本。\u003c/p>\u003cp>当团队缺少关键领域知识，优先补上能回答问题的人和真实案例；当系统经常丢数据，先修复可靠性基础；当跨团队没有合作条件，选择能在当前关系下成立的边界。战略设计的成熟，不是能够为所有地方套上同一套结构，而是能说明哪些地方值得深挖、哪些地方应该克制，以及什么证据会使当前决定改变。\u003c/p>\u003c/section>\u003csection>\u003ch2>原书的六项提醒\u003c/h2>\u003cp>把战略传达到整个团队；吸收开发和业务反馈；允许架构演化；不要从应用团队抽走全部优秀设计者；保持最小主义与谦逊；让对象各司其职，让开发者保持全面。\u003c/p>\u003cp>这意味着架构角色应帮助交付团队解决实际问题。若架构规则只有中央团队能解释，应用团队既无法挑战也无法验证，它就很难形成真正的共同模型。\u003c/p>\u003c/section>\u003csection>\u003ch2>工程落地 · 一个四周试点计划\u003c/h2>\u003cp>第 1 周：选一个规则复杂且范围可控的用例，访谈并画现状；第 2 周：统一关键语言、定义不变量和验收例子；第 3 周：做可运行薄切片并验证并发/失败路径；第 4 周：小范围接入、对账、回顾和决定是否扩大。这个节奏是课程建议，可按项目调整。\u003c/p>\u003cp>用基线观察改动影响范围、缺陷类型、规则理解分歧与交付耗时。不要凭一次演示就宣称“效率提升 50%”。定量数据需要真实测量，定性反馈也要保留来源与情形。\u003c/p>\u003c/section>\u003csection>\u003ch2>深挖 · 什么时候应暂停投入？\u003c/h2>\u003cp>若问题主要是简单 CRUD、团队缺少领域专家、当前核心风险是基础可靠性，重建复杂模型未必是最优投入。可以先稳定系统、补业务例子和术语，再决定建模范围。DDD 不是必须全公司一次上线的方法包。\u003c/p>\u003c/section>\u003csection>\u003ch2>从术语走向设计取舍\u003c/h2>\u003cp>你应该能解释：为什么选这个聚合边界；为什么另一个方案没有选；哪些约束用事务保障；跨界失败如何呈现；模型如何演化。术语只是压缩沟通的工具，证据与反例才让决定可信。\u003c/p>\u003cp>后面的规格、并发与订舱案例继续讨论这些取舍。换一个业务领域时，不能只替换类名，还需要重新发现规则和不变量。\u003c/p>\u003c/section>","answer":"示例：试点企业月结预订，范围限制为一个客户群；核心是信用与运输承诺协同；订舱与结算各自拥有状态；容量不超卖必须原子保证。先验证 3 条场景和 2 个故障窗口，再比较缺陷与修改范围。若无法获得结算专家反馈，暂缓扩大。","quiz":[{"prompt":"战略设计的起点通常是什么？","options":["画完理想微服务图","评估真实模型、边界与团队现状","选最流行框架"],"answer":1,"why":"战略必须面对实际能力和约束，才能形成可执行路径。"},{"prompt":"怎样证明 DDD 试点有收益？","options":["目录看起来专业","观察具体业务变更、缺陷和协作成本的变化","模式数量增加"],"answer":1,"why":"改善要通过真实案例和基线评估，不能凭术语或主观漂亮程度宣称。"}],"diagram":"strategy","quote":["Objects are specialists; developers are generalists","让对象各司其职，让开发者保持全面。",518],"refs":["meituan24"],"caseTitle":"一个可控制范围的模型试点","caseContext":"假设选择企业月结预订作为试点。范围、规则、协作方和验证证据要能彼此对应。"},{"id":"18","n":18,"part":5,"title":"规格模式：从布尔判断到剩余条件","subtitle":"把“什么算满足”与“如何找到、构造结果”分开，再理解规则组合与推理的边界。","pages":"Specifications 1–19","tags":["组合规格","Subsumption","剩余规格","规则解释"],"body":"\u003csection>\u003ch2>从一句“适合冷链”拆出三个问题\u003c/h2>\u003cp>海风接到一批冷冻食品，要求箱体具备食品卫生资格，能够在运输条件下维持 −18°C。运营人员手上可能已经有一个箱子，也可能只有一张可用设备清单，还可能需要安排清洗、预冷等服务。三种情况都围绕同一个“满足条件”，实际执行动作却不同。\u003c/p>\u003cp>校验回答“这个候选能不能用”；筛选回答“这些候选里哪些能用”；按规格构造回答“怎样安排操作，得到一个能用的结果”。把规格命名为 ColdFoodRequirement，是给判定依据一个位置；它不因此拥有查询数据库、预约清洗工和生成整条路线的全部责任。\u003c/p>\u003cp>例如预订提交时需要对选中的箱子作最终校验，列表页需要先把条件交给查询适配器缩小候选集合，调度服务则可以寻找“清洗后即可合格”的设备。三者共用业务含义，各自采用合适的算法和成本模型。这正是 Evans 与 Fowler 在 Specifications 开篇区分的三种用途。\u003c/p>\u003c/section>\u003csection>\u003ch2>硬编码、参数化、组合：每多一步，都要获得真实能力\u003c/h2>\u003cp>第一版规则完全固定，可以直接用一个函数：食品级且制冷能力达标。这不比建一个只有 isSatisfiedBy 方法的类更低级。第二版开始支持 −18°C、−25°C 等不同产品时，把阈值参数化，可以避免每个温度都产生一个子类。\u003c/p>\u003cp>第三版才出现“食品级且低温”或“医药资格且温度区间匹配”等运营组合，此时才需要显式规则树。叶子负责一个可理解的判断，内部节点负责 AND、OR、NOT。树的价值是可组合、可展示、可版本化；代价是必须定义空组合、未知条件、错误解释和兼容策略。\u003c/p>\u003cp>如果只是用函数闭包组合规则，通常无法安全地把闭包反编译成 SQL。需要数据库翻译时，应选择受控的规则表示，例如带类型和参数的节点，再为内存解释器与查询适配器分别实现同一语义。不要接受任意 Python 表达式或拼接用户 SQL 来换取“灵活”。\u003c/p>\u003c/section>\u003cpre>\u003ccode># 规则结构是数据，执行规则是解释器。示意：仅支持两个叶子和 AND。\nrule = {&quot;op&quot;: &quot;and&quot;, &quot;items&quot;: [\n    {&quot;op&quot;: &quot;food_grade&quot;},\n    {&quot;op&quot;: &quot;min_temperature&quot;, &quot;at_most&quot;: -18},\n]}\n\ndef matches(rule, box):\n    if rule[&quot;op&quot;] == &quot;and&quot;:\n        return all(matches(x, box) for x in rule[&quot;items&quot;])\n    if rule[&quot;op&quot;] == &quot;food_grade&quot;:\n        return box.food_grade is True\n    if rule[&quot;op&quot;] == &quot;min_temperature&quot;:\n        return box.min_temperature &lt;= rule[&quot;at_most&quot;]\n    raise ValueError(&quot;未知规则类型&quot;)  # 未知不能偷偷当作通过\n\u003c/code>\u003c/pre>\u003csection>\u003ch2>一条规则，两种执行器，怎样避免语义分叉\u003c/h2>\u003cp>内存判断 food_grade is True，数据库列却可能是 NULL；SQL 中 NULL 参与布尔运算会得到未知值。若 Python 把缺失属性默认成 False，而 SQL 编译器随意使用 NOT，两种解释器就可能得出不同结果。时间边界、时区、字符串大小写和金额舍入也有类似问题。\u003c/p>\u003cp>一个可用的工程协议是：先约束合法输入域，再为每个规则节点规定空值和边界含义。把同一组候选分别送入内存解释器和真实数据库查询，比较返回的身份集合。这里验证的是业务含义一致，不是 SQL 字符串长得一样。\u003c/p>\u003cp>筛选也不等于预留。列表查询显示“可用”，只能说明查询时符合条件。提交预订仍须在资源的写入边界重新验证可用性，或者检查一个带期限的有效承诺。否则规格对象写得再漂亮，两个用户仍可能选中同一份资源。\u003c/p>\u003c/section>\u003csection>\u003ch2>规格蕴含：比较的不是对象，而是允许的集合\u003c/h2>\u003cp>设 A 表示“从长滩出发，目的地位于加利福尼亚州”；B 表示“从长滩出发，到纽波特海滩”。知道纽波特海滩属于加州以后，满足 B 的路线一定满足 A，所以 B ⇒ A。合同接受 A，订单要求 B，这一地点条件可以相容；它不自动证明价格、货物种类和运输日期也满足合同。\u003c/p>\u003cp>最容易犯的错误是只比较参数大小。例如最低年龄 18 比 16 严格，但“最高允许温度 −18”与“最低允许温度 −18”方向不同。规则的比较方法必须知道业务量的意义。不能给所有参数化规格实现一个“参数越大越严格”的通用父类。\u003c/p>\u003cp>任意代码形式的规则通常不能自动证明蕴含关系。受限语言可以支持有限推理：同类数值区间比较、地点集合包含、AND 条件化简。遇到无法证明的关系，应返回“未知”，而不是当作不相容或已满足。证明能力与业务判断能力是两种不同接口。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>规格\u003c/th>\u003cth>允许结果\u003c/th>\u003cth>可推出的结论\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>年龄 ≥ 18\u003c/td>\u003ctd>[18,+∞)\u003c/td>\u003ctd>蕴含年龄 ≥ 16\u003c/td>\u003c/tr>\u003ctr>\u003ctd>温区 [−20,−16]\u003c/td>\u003ctd>允许温度的交集\u003c/td>\u003ctd>与 [2,8] 无交集，不能同温混装\u003c/td>\u003c/tr>\u003ctr>\u003ctd>经盐湖城且到芝加哥\u003c/td>\u003ctd>同时满足两个路线约束\u003c/td>\u003ctd>蕴含到芝加哥；反向不成立\u003c/td>\u003c/tr>\u003ctr>\u003ctd>食品级或医药级\u003c/td>\u003ctd>任一资格成立即可\u003c/td>\u003ctd>不蕴含两种资格都成立\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>剩余规格：历史完成了什么，未来还欠什么\u003c/h2>\u003cp>论文的路线案例要求香港出发，到芝加哥，经盐湖城卸一部分货，并在西雅图清关。货到西雅图、清关完成后，铁路因天气中断。正确的重规划不会删掉历史，也不会让货重新回香港。它先区分已完成约束与仍需满足的约束，再为新的出发状态补上条件。\u003c/p>\u003cp>“香港出发”与“西雅图清关”已经由事实满足；“到芝加哥”与“经盐湖城”仍然存在。新的路线搜索还必须知道当前位置是西雅图、当前时间以及可用运力。剩余规格不包含全部规划输入，规划器也不是规格对象本身。\u003c/p>\u003cp>对于 AND，保留尚未完成的子条件很直观。对于“经 A 或经 B”，两者都未经过时，剩余要求仍是二选一，不能化成必须经过 A 和 B。对于“从未离开冷链”，某段历史缺失可能意味着证据不足；未来冷藏不能抵消过去的失温。因此剩余条件需要时间语义和证据语义，不是把错误文案放进数组。\u003c/p>\u003c/section>\u003csection>\u003ch2>解释拒绝时，也是在设计模型\u003c/h2>\u003cp>“不满足条件”对客服没有帮助；“设备缺食品资格”和“温控记录缺少 13:00—13:30 的证据”代表不同处理路径。可以把判定结果定义为通过、拒绝、证据不足，附稳定的原因代码和相关事实。展示层再把原因代码转成中文说明。\u003c/p>\u003cp>不要把所有判断都升级成三值逻辑。如果业务已经保证数据完备，两值判定更简单。但一旦涉及外部采样或第三方证书，模型必须明确“没有观察到违规”是否等同于“已证明合规”。这是业务决策，不能由程序员悄悄使用默认值代替。\u003c/p>\u003cp>规则更新也需要可解释性。预订应保留适用的产品与规则版本，或者保存作出承诺所依据的必要事实。新规则上线后，查询旧订单为什么被接受，不能只拿今天的规则重新算一遍。这一工程补充把规格模式连接到第 16 章的知识级别与版本问题。\u003c/p>\u003c/section>","answer":"B⇒A；17 岁满足 A 而不满足 B，故 A 不蕴含 B。若要求海运或空运，两个分支当前均未满足，剩余仍是二选一，不能化成 AND。需要保留逻辑结构及已经发生的事实。","quiz":[{"prompt":"B 要求经长滩，A 不要求经停。正确关系是？","options":["A⇒B","B⇒A","A=B"],"answer":1,"why":"B 更严格，B 的所有解也是 A 的解；反向存在不经长滩的反例。"},{"prompt":"货已到西雅图，计算剩余路线时还要？","options":["只删去已满足条件即可","添加当前起点并保留尚未满足的逻辑结构","清除所有历史事件"],"answer":1,"why":"剩余要求并不会自动编码现在的位置。新计划需要新的初始条件。"}],"diagram":"spec","refs":["specpaper"],"image":"spec","caseTitle":"用一个反例看清规格蕴含","caseContext":"A 要求年龄至少 16 岁，B 要求至少 18 岁。包含方向可以用 17 岁这个反例判断；OR 规则也不能机械收集全部失败分支。"},{"id":"19","n":19,"part":5,"title":"一致性工程：让规则经得起重试与崩溃","subtitle":"沿失败时间线理解事务、幂等、消息、Saga、CQRS 与事件溯源。","pages":"现代工程扩展","tags":["Unit of Work","Outbox","幂等","Saga","CQRS","事件溯源"],"body":"\u003csection>\u003ch2>从一次超时开始：结果未知是一种独立状态\u003c/h2>\u003cp>客户端提交预订后等了三秒，没有收到回复。此刻可能根本没有到达服务器，可能事务正在执行，也可能数据库已经提交，只是响应丢失。网络层的“超时”无法告诉业务是哪一种。直接换一个请求 ID 重试，等于宣布“这是一个新的购买意图”，可能占用两次舱位。\u003c/p>\u003cp>系统需要一个稳定命令身份，以及能够查询原结果的回执。回执和业务变化同事务保存：这样一旦查到成功回执，就能把原来承诺的结果返回给客户端。相同键带着不同数量不能复用；相同参数使用不同键也不应一概去重，因为客户可能真的需要买两次。\u003c/p>\u003cp>幂等范围必须明确。单租户示例可直接用 command_id；多租户生产环境通常需要租户、调用方或业务类型参与唯一键，鉴权也必须先于回放，防止把别人的结果返回出去。清理回执之前还应知道允许多久重试、离线任务最多积压多久。删除太早会把晚到重试变成新请求。\u003c/p>\u003c/section>\u003csection>\u003ch2>“先查再改”为什么保护不了并发\u003c/h2>\u003cp>A 和 B 各自读取容量 10、已预留 4，随后都判断新增 4 合法。领域对象没有犯算术错误；错误在于把各自成立的快照当成同一个可以同时兑现的事实。应用需要把“根据什么状态作出决定”与提交联系起来。\u003c/p>\u003cp>乐观方案保存 version=7 的前提，UPDATE 时要求版本仍为 7。A 成功后，B 的条件更新影响 0 行，这意味着决策依据已过期。B 必须重读，再发现 8+4 超出容量；把旧 reserved=8 再存一次，不叫重试业务，而是丢弃 A 的写入。\u003c/p>\u003cp>悲观方案在决定前取得资源锁，或者让数据库执行带条件的原子增量。不同机制保护的是不同范围：单行版本号无法自然保护两个独立行的总和约束；数据库行级 CHECK 也看不到任意其他行。遇到“同一客户当天所有预订总量不能超过额度”，需要找到共同的配额权威，或明确采用怎样的事务隔离与锁协议。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>机制\u003c/th>\u003cth>保护什么\u003c/th>\u003cth>需要继续解决什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>幂等回执\u003c/td>\u003ctd>同一意图重复到达\u003c/td>\u003ctd>不同意图的并发争抢\u003c/td>\u003c/tr>\u003ctr>\u003ctd>乐观版本\u003c/td>\u003ctd>防止旧快照覆盖新状态\u003c/td>\u003ctd>冲突后的重新决策与重试成本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>条件原子增量\u003c/td>\u003ctd>单个资源上的数量边界\u003c/td>\u003ctd>其他资源与预订状态的原子协调\u003c/td>\u003c/tr>\u003ctr>\u003ctd>行锁/串行写入\u003c/td>\u003ctd>受保护范围内的决策顺序\u003c/td>\u003ctd>锁等待、死锁、锁顺序与热点\u003c/td>\u003c/tr>\u003ctr>\u003ctd>消息去重\u003c/td>\u003ctd>同一事件对本地业务的重复影响\u003c/td>\u003ctd>外部 RPC、乱序、遗漏与未知结果\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>Unit of Work：把成功定义成完整的业务提交\u003c/h2>\u003cp>预订状态保存成功，幂等回执却没有保存，那么响应丢失后的重试仍然可能再次执行。待发消息没保存，其他上下文就可能一直不知道这笔承诺。对于同一本地数据库，三个写入应成为同一个提交结果。\u003c/p>\u003cp>工作单元可以用对象表示，也可以是事务上下文或回调协议。关键是由用例定义提交时机，由同一个连接或会话承载相关写入。仓储负责访问聚合；若每个仓储都自行 commit，调用者就很难撤销前半段成功。默认回滚、显式提交有助于让异常路径清楚。\u003c/p>\u003cp>但不要把数据库事务包住所有事情。事务内等待支付网关、发送邮件或调用不稳定承运商接口，会延长锁占用，而且远端成功仍不能随本地回滚撤销。先确定外部行为究竟是在查询信息、形成承诺，还是执行不可逆动作，再决定使用本地记录、幂等命令和后续流程来协调。\u003c/p>\u003c/section>\u003csection>\u003ch2>Outbox 的完整时间线：消息一定可能重复\u003c/h2>\u003cp>本地事务先保存预订和待发事件。Relay 读取待发记录，发送给下游，拿到持久接收确认后，再将记录标记为已发送。业务事务中没有 MQ 网络调用，网络失败时仍保留了发送义务。\u003c/p>\u003cp>最关键的崩溃点是“下游已经接收，而 sent 尚未写入”。重启后这条记录还在待发队列，再发一次是正确的恢复行为。如果先把 sent 改成 1 再发送，虽然看似杜绝了重复，却会在崩溃时永久漏发。可靠性的代价是接收方必须理解重复。\u003c/p>\u003cp>单个 relay 可以按序处理，多个 relay 则还需要领取协议、租约、分区或其他并发机制，并处理租约到期后的重复。重试退避、积压告警和失败接管决定系统能否收敛。最老未发送记录的年龄，往往比待发总数更能暴露“某条业务卡住”的问题。\u003c/p>\u003c/section>\u003csection>\u003ch2>Inbox 去重：去重记录与业务效果必须一起提交\u003c/h2>\u003cp>消费者先查 event_id 是否存在，再执行业务，最后写去重记录，这三个独立动作之间有竞争窗口。两个消费者实例可能同时查到“不存在”；也可能业务已生效，进程却死在记录去重之前。\u003c/p>\u003cp>对于同一个消费数据库，应在一个事务内争取唯一键 (consumer,event_id)，更新本地业务状态，再提交。只有提交成功才确认消息；如果提交后确认丢失，下次投递会看到去重记录，安全地结束。本地记录使用 consumer 名称参与身份，是因为两个不同订阅者都可能合法地处理同一事实。\u003c/p>\u003cp>如果业务效果是调用外部短信、银行或邮件服务，本地 Inbox 事务无法包住远端结果。仍需要对方幂等键、可查询的业务流水，或者再写一个本地发送义务。单纯加一张去重表不能保证所有外部世界的“恰好一次”。\u003c/p>\u003c/section>\u003csection>\u003ch2>乱序不能统一处理：快照可跳跃，增量通常不可跳跃\u003c/h2>\u003cp>假设展示页先收到版本 3 的“已取消”，后收到版本 2 的“已确认”。如果消息携带完整的目标展示状态，消费者只接受更高版本，就可以防止页面倒退。生命周期示例采用的就是这种状态快照投影。版本号比较的是同一预订，不是不同预订的全局大小。\u003c/p>\u003cp>但余额变化事件“加 100”和“减 20”不能简单丢弃低版本。如果先处理减 20，再因为版本较老而跳过加 100，最后余额就错了。增量消费者可能需要按序缓冲、检查缺口、重新读取权威快照或从日志补齐。选择哪一种取决于事件语义与恢复能力，不能把一段通用 if version 代码复制到所有消费者。\u003c/p>\u003cp>时间戳也不能代替顺序协议。不同机器时钟会漂移，消息排队时间不同，记录时间与业务发生时间不同。事件至少应带稳定事件身份、业务对象身份、契约版本，以及业务真正需要的时间；需要顺序保证时另设明确序列或前置版本。\u003c/p>\u003c/section>\u003csection>\u003ch2>Saga：退款是新事实，不能擦掉已经发生的付款\u003c/h2>\u003cp>订舱与支付位于不同系统时，可以先预留，再请求支付，成功后确认，失败时释放。这个流程中存在“已预留、支付结果未知”的中间状态。超时不等于支付失败；如果直接释放并重新支付，可能同时出现已扣款和重复扣款。\u003c/p>\u003cp>流程管理器要保存当前阶段、稳定操作身份、外部交易号和下一步恢复责任。支付超时先查询或按同一幂等键重试；确认收到失败才推进释放。若已扣款后业务取消，应发起退款并记录退款事实，而不是删除付款记录、假装事情从未发生。退款本身也可能失败，需要重试或人工处置。\u003c/p>\u003cp>补偿不是机械地把步骤倒序执行。舱位可能已过确认期限，商品可能已经发出，外汇价格也可能改变。业务必须决定可补偿范围、费用承担与不可自动恢复的出口。Saga 适合可容忍这些中间状态的流程；不适合拿来掩盖一个绝对不能被短暂破坏的约束。\u003c/p>\u003c/section>\u003csection>\u003ch2>CQRS 与事件溯源：按需求选择两个独立决定\u003c/h2>\u003cp>运营列表需要客户名、最新运输位置和异常原因，写侧聚合只需要确认预订的当前资格。让一个对象同时承担复杂查询和修改规则，会引入大量与修改无关的关联。可以为列表直接查询或建立专用投影，而保持写模型聚焦于规则。读写分离不自动要求拆数据库或增加消息中间件。\u003c/p>\u003cp>当异步投影存在延迟时，刚成功下单却在列表看不到，会直接影响使用体验。可以显示命令返回的结果、提供按业务 ID 查询写侧的确认入口，或用版本水位告诉前端何时投影追上。不能用“最终一致”作为用户看到混乱状态的解释。\u003c/p>\u003cp>事件溯源则把事件序列作为权威历史，通过重放得到状态。它带来历史追溯能力，也要求处理事件版本、重放副作用、错误事实的纠正和快照兼容。发出领域事件，或在表里增加 outbox，都不等于采用事件溯源。海风的示例采用当前状态表加 Outbox，读侧采用状态快照，三者责任各不相同。\u003c/p>\u003c/section>","answer":"消费者开启事务，插入具有唯一键的 event_id，完成本地业务更新后提交；重复插入触发已处理逻辑。若本次失败，两者回滚。支付调用另需支付方支持的幂等键、结果查询和对账，不能靠本地去重表保证外部只发生一次。","quiz":[{"prompt":"Outbox 能保证全链路 exactly once 吗？","options":["能","不能，仍需去重与失败恢复","只有换 Kafka 就能"],"answer":1,"why":"relay 重复、消费者副作用和外部系统都需要独立处理。"},{"prompt":"已成功预订售罄后，同一命令重试应？","options":["先按剩余容量拒绝","返回已保存的原结果","再扣一次舱位"],"answer":1,"why":"重放不是新业务，幂等回执应优先于新的容量校验。"}],"diagram":"outbox","refs":["outbox","uow","cqrs","reference"],"caseTitle":"消息发出后，进程恰好崩溃","caseContext":"Relay 发消息成功，还没标记已发送就崩溃。消息可能再次投递，而外部支付还在本地事务边界之外。"},{"id":"20","n":20,"part":5,"title":"订舱系统：从预留到取消、过期与消息恢复","subtitle":"把概念连成一个可运行的用例，解释每条规则、每次提交和每个恢复窗口。","pages":"课程原创项目","tags":["状态模型","事务边界","取消","过期","演化"],"body":"\u003csection>\u003ch2>业务故事：给冷链货物留出一段确定的容量\u003c/h2>\u003cp>海风为某个航次提供 10 个标准舱位单位。客户可以暂留若干单位，在截止时间前确认，也可以取消；未确认的预留到期后释放。确认后的预订继续占容量，直到取消或后续履约流程处理。这里的容量是订舱承诺量，不是船舶实际装载重量。\u003c/p>\u003cp>为了把规则看清，案例限定为单租户、单航次、整数数量，不计超订、不计退款，也不处理开始履约后的取消。规则不是航运行业普遍定律，而是这个产品的业务约定。第 1 章中的超订政策正好提醒我们：如果业务改变承诺策略，就要重新讨论容量含义。\u003c/p>\u003cp>最早的 Voyage 模型只保存 reserved 总数，可以回答是否还能预留，却无法回答取消的是哪一笔。引入 Reservation 后，身份、数量、截止时间和状态成为取消与到期判断所需的最小知识。新对象的出现有明确理由：总数丢失了业务必须追踪的连续性。\u003c/p>\u003c/section>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>当前状态\u003c/th>\u003cth>操作与条件\u003c/th>\u003cth>新状态\u003c/th>\u003cth>容量变化\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>不存在\u003c/td>\u003ctd>hold：数量 > 0，截止时间在未来，容量足够\u003c/td>\u003ctd>ACTIVE\u003c/td>\u003ctd>占用 slots\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACTIVE\u003c/td>\u003ctd>confirm：now \u003c expires_at\u003c/td>\u003ctd>CONFIRMED\u003c/td>\u003ctd>不变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACTIVE / CONFIRMED\u003c/td>\u003ctd>cancel：本场景允许取消\u003c/td>\u003ctd>CANCELLED\u003c/td>\u003ctd>释放自身 slots\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ACTIVE\u003c/td>\u003ctd>expire：now ≥ expires_at\u003c/td>\u003ctd>EXPIRED\u003c/td>\u003ctd>释放自身 slots\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CANCELLED / EXPIRED\u003c/td>\u003ctd>再次 cancel\u003c/td>\u003ctd>保持原状态\u003c/td>\u003ctd>不变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CONFIRMED / CANCELLED / EXPIRED\u003c/td>\u003ctd>expire\u003c/td>\u003ctd>保持原状态\u003c/td>\u003ctd>不变\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003csection>\u003ch2>模型边界：预订身份与容量权威共同保护什么\u003c/h2>\u003cp>系统维护两条不变量：reserved 不得小于零或大于 total；reserved 等于仍占用容量的 ACTIVE 与 CONFIRMED 预订数量之和。第一条可由容量表的 CHECK 约束兜底，第二条跨记录，不能只靠每个对象各自检查自己的字段。\u003c/p>\u003cp>本例把某航次的容量和预订变更放在同一本地一致性边界：一笔操作要么同时改变状态和容量，要么都不发生。实现只加载目标预订与容量摘要，不加载全部历史。聚合边界与“每次把整个关系图读入内存”不是同一件事；历史可归档，但归档前必须证明它已不参与当前不变量。\u003c/p>\u003cp>如果把每笔预订设为独立聚合，容量由另一聚合维护，也可以明确采用同库本地事务协调这次操作；这个选择需要记录，并检查它是否反映真正稳定的业务边界。若两者部署到不同服务，就必须改成可追踪的预留令牌协议，重新解释暂时不一致的状态。网络边界不能免费保留原来的原子承诺。\u003c/p>\u003c/section>\u003csection>\u003ch2>先读领域方法：它只决定合法变化\u003c/h2>\u003cp>Reservation.change 不访问数据库，不读系统时钟，不发送消息。它接受操作与时间，返回新对象和需要释放的数量。对象不可变，调用方无法在方法返回前看到半个状态变化；同一时间输入也便于测试到期边界。\u003c/p>\u003cp>确认检查 now ≥ expires_at 即拒绝，因此即使过期扫描任务迟到，客户也不会在过期之后被确认。扫描任务负责最终释放容量，确认规则负责拒绝过期承诺，两者解决不同问题。已经确认的预订不会再被过期任务释放。\u003c/p>\u003cp>时间应由可信服务端在执行用例时提供。示例把整数秒传入方法是为了显式表达依赖，实际 API 不应让客户端随意声称“现在还没到期”。多个节点需明确时钟来源与容忍范围，关键期限还可考虑由同一数据库时间基准裁决。\u003c/p>\u003c/section>\u003cpre>\u003ccode># 从 lifecycle.py 节选：截止瞬间采用左闭右开区间。\nif action == &#x27;confirm&#x27;:\n    if self.state == &#x27;CONFIRMED&#x27;:\n        return self, 0\n    if self.state != &#x27;ACTIVE&#x27; or now &gt;= self.expires_at:\n        raise Rejected(&#x27;预留已结束或超过确认截止时间&#x27;)\n    return replace(self, state=&#x27;CONFIRMED&#x27;, version=self.version + 1), 0\n# deadline=100：now=99 可以确认；now=100 已不可确认。\n\u003c/code>\u003c/pre>\u003csection>\u003ch2>再读应用事务：保护快照与回执\u003c/h2>\u003cp>execute 先校验命令结构，然后用 BEGIN IMMEDIATE 开始 SQLite 写事务。这个示例选择先取得写权限，再读取状态进行决策，避免不同写者根据过期的可写快照同时承诺。它与前面的乐观版本示例是两种可以比较的策略，不是说 SQLite 等于所有生产数据库。\u003c/p>\u003cp>事务内先查回执。同一命令如果已成功，直接返回原结果，避免过期时间变化或容量售罄使重试变成拒绝。同键不同业务参数报错；服务端当前时间没有放进指纹，因为重试时当前时间必然改变，而它仍是同一个命令。固定的预留截止时间则属于 hold 的业务参数。\u003c/p>\u003cp>没有回执才执行变化：更新容量与预订，登记状态事件，保存回执，最后提交。任何一步失败，全部回滚。对重复取消，新命令可以获得一次无变化的成功回执，但不会产生新的释放量或新状态事件。同命令重放返回原来 changed=true 的回执，也不代表再次产生了变化。\u003c/p>\u003c/section>\u003csection>\u003ch2>容量不是越多锁越安全：热点首先是业务结构问题\u003c/h2>\u003cp>一个航次的最后几个舱位天然是竞争热点。SQLite 示例通过数据库级串行写入获得简单语义，在高流量生产环境中，这会限制不相关写入的并行性。关系数据库可评估针对单航次行的锁、条件增量，或者以航次为键串行处理的命令队列。\u003c/p>\u003cp>按租户或销售渠道分片并不是纯技术优化。如果把总容量提前分配成多个额度，局部扣减更快，但闲置额度、转移和超卖风险都需要新的业务协议。如果允许超订，则必须显式建模最大承诺量与拒载处理，不能把丢更新造成的超额伪装成业务灵活性。\u003c/p>\u003cp>这里需要看冲突率、等待时长、失败率和业务拒绝率的分布，而不仅是平均吞吐。一个总是返回 200、但重复释放容量的实现比明确拒绝冲突更危险。优化前先确认不变量，再测量代价，最后选择替代协议。\u003c/p>\u003c/section>\u003csection>\u003ch2>进程重启以后，到期处理还记得什么\u003c/h2>\u003cp>expires_at 持久保存在预订中。expire_due 定期扫描 ACTIVE 且到期的预订，用稳定命令键再次进入同一用例。进程中断后重新扫描即可继续，不依赖某个曾经存在的内存定时器。真实系统还可使用持久延迟队列，但业务仍须验证到期条件。\u003c/p>\u003cp>扫描与执行之间可能发生确认。执行时重新读到 CONFIRMED，就不会释放；若已经 EXPIRED，重试也不再减容量。查询结果只是待处理候选，状态转换才是最终裁决。数据量大时应给状态与截止时间建立合适索引，并用分页扫描、批量上限和积压年龄控制任务负载。\u003c/p>\u003cp>扩展“延长预留”时，原来的稳定到期命令身份可能不再足够：旧到期任务必须能识别自己针对哪个截止版本。可以将预留代次或截止版本纳入任务身份，并在执行时比较。一个幂等键设计是否正确，取决于业务意图是否仍然是同一个。\u003c/p>\u003c/section>\u003csection>\u003ch2>从待发事件到运营页面：一条可恢复的事实链\u003c/h2>\u003cp>每次真正改变状态，事务内保存 ReservationStateChanged。它携带 event_id、预订身份、版本、目标状态和发生时间。Relay 在事务外调用交付函数；下游持久接收后才标记已发。示例使用 Python 回调连接两个 SQLite 数据库，没有接入真实 MQ。\u003c/p>\u003cp>消费端把 Inbox 记录与状态投影放在自己的事务里。相同 event_id 重复到达无新增效果；相同 event_id 带不同载荷报错，避免将契约冲突伪装成正常重复。投影只接受更高预订版本，避免已取消页面被迟到的已确认消息改回。\u003c/p>\u003cp>这条消息是状态快照，才允许跳过旧版本。如果它改成“新增四个舱位”或“释放四个舱位”的增量，就不能照抄这一投影规则。真正的 MQ 还涉及确认协议、分区顺序、权限、保留期和生产重试；这些应在选定基础设施之后继续验证。\u003c/p>\u003c/section>\u003csection>\u003ch2>沿测试读故障：每条断言对应一项业务承诺\u003c/h2>\u003cp>test_confirm_cancel_releases_once 验证确认后取消只释放一次；test_replay_precedes_capacity_and_clock_validation 验证售罄和截止时间变化不破坏原成功回放；test_expiry_racing_confirmation_at_deadline 验证截止瞬间不能形成两个互斥状态。\u003c/p>\u003cp>test_atomic_rollback 在提交前故意抛错，检查预订、容量、回执、事件没有残留半成品；test_send_then_crash_replays_without_duplicate_business_effect 在下游提交后、发件人标记前崩溃，检查重发后只有一条 Inbox 与正确投影；乱序测试则先送较新状态，再送旧状态。\u003c/p>\u003cp>这些测试给出可重复的证据，但不证明任意数据库、真实 MQ 或外部支付都具有相同语义。换基础设施后，应保留这些业务断言，再用真实适配器补契约测试。模型测试验证规则，集成测试验证协议，生产监控验证恢复是否持续有效。\u003c/p>\u003c/section>\u003csection>\u003ch2>把故事接回 DDD：变化让概念显形\u003c/h2>\u003cp>容量限制让 Voyage 的规则出现；单笔取消让 Reservation 身份出现；自动过期让时间和状态转换出现；重试让命令身份出现；跨上下文通知让稳定事实契约出现。每一个新增概念都对应一个原模型无法正确回答的问题。\u003c/p>\u003cp>其中并非所有东西都属于领域模型。回执表、发送标记、数据库锁主要承担技术可靠性职责；预留、确认、取消及截止时间则直接表达业务承诺。把技术机制藏到适配器，并不意味着可以忘记它们；反过来，也不应让领域专家通过“更新 inbox row”来描述业务。\u003c/p>\u003cp>一个成熟的设计既能说明为什么这样建模，也能指出自己的边界：尚未处理的退款、租户权限、履约后取消，需要各自的业务规则。保持这种清楚的责任与证据，系统才能在新需求到来时继续演化。\u003c/p>\u003c/section>","answer":"预订必须有稳定身份、数量和生命周期，取消只释放该预订实际占用的容量，重复取消不产生新变化。确认在截止时刻之后被拒，过期任务在执行时重新读取状态。状态、容量、回执和待发事件通过本地事务一起提交；消费端通过 Inbox 与版本化状态投影处理重复和乱序。完整实现见代码案例中的 lifecycle.py。","quiz":[{"prompt":"仅保存 reserved 总数，能可靠取消某一笔预订吗？","options":["能，减去用户传入数量","不能，还需预订身份和生命周期","用缓存就可以"],"answer":1,"why":"总数无法证明取消对象、数量与是否已取消。新增需求暴露了模型缺口。"},{"prompt":"教学实验通过测试后，面试中应如何表述？","options":["宣称线上百万并发稳定运行","如实说明验证范围与未覆盖生产能力","不必提环境和限制"],"answer":1,"why":"高级工程师的可信度来自可验证证据与清楚的边界。"}],"diagram":"aggregate","refs":["go","cosmic"],"caseTitle":"取消与到期都来了，容量为什么只释放一次","caseContext":"容量 10，一笔预订占用 4，确认后又被取消。客户端再次发起取消，后台到期任务也开始执行。"}],"sources":[{"id":"reference","title":"Eric Evans · DDD Reference（2015）","url":"https://www.domainlanguage.com/ddd/reference/","type":"作者官方速查","note":"把核心模式放在同一张概念地图上阅读；适合查术语及模式之间的关系。2015 版还收录领域事件、伙伴关系和泥球等后续条目。","coverage":"第 1–17 章；领域事件见第 19 章。","next":"沿“上下文 → 核心 → 模型构件”阅读，再回到案例中判断模式的使用条件。","extra":"https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf"},{"id":"fowler","title":"Martin Fowler · Bounded Context","url":"https://martinfowler.com/bliki/BoundedContext.html","type":"一手概念解释","note":"解释为什么大型业务中会存在多个合理模型，以及模型之间为什么需要显式映射。","coverage":"第 2、14 章。","next":"重点看同名异义、模型有效范围与跨边界映射；不要把上下文直接等同部署服务。"},{"id":"cosmic","title":"Cosmic Python · Architecture Patterns with Python","url":"https://www.cosmicpython.com/","type":"作者免费在线书","note":"以 Python 展示领域模型、应用服务、仓储、工作单元和消息处理如何协作。","coverage":"第 4、6、19、20 章。","next":"推荐阅读第 1、2、4、6、7、8、12 章，追踪一次分配用例怎样进入事务并通知后续处理。"},{"id":"go","title":"Three Dots Labs · Wild Workouts","url":"https://github.com/ThreeDotsLabs/wild-workouts-go-ddd-example","type":"Go 原作者示例仓库","note":"通过一个训练预约系统的逐步重构，展示 Go 中的领域行为、整洁架构和 CQRS。","coverage":"第 3–6、13、19、20 章。","next":"先追一个命令的调用路径，再比较版本之间的职责变化；关注工厂、更新回调和失败处理。"},{"id":"slowbyte","title":"slowbyte · 面试被问到 DDD，怎么讲才不像背课文？","url":"https://www.cnblogs.com/slowbyte/p/23623223","type":"中文表达辅助","note":"中文 DDD 面试表达材料，可辅助组织“业务问题、模型边界、行为规则、实现取舍”的讲述顺序。","coverage":"面试参考页。","next":"概念表达需要补上并发、幂等与事务边界；钱包代码中的转账也需要结合原子性与重复请求审查。"},{"id":"meituan17","title":"美团 · 领域驱动设计在互联网业务开发中的实践","url":"https://tech.meituan.com/2017/12/22/ddd-in-practice.html","type":"一手工程博客 · 2017","note":"以抽奖平台讨论规则散落、领域对象和架构职责，也讨论简单业务使用过程化设计的条件。","coverage":"第 1、4、5、6 章。","next":"关注规则如何找到自己的归属，以及业务模型如何支持变化。"},{"id":"meituan24","title":"美团 · DDD 在大众点评交易系统演进中的应用","url":"https://tech.meituan.com/2024/05/09/DDD-Practice-Trading-System.html","type":"一手工程博客 · 2024","note":"以大众点评交易系统的演进讨论多业务共存、规则交织和跨角色建模。","coverage":"第 13–17 章。","next":"观察团队如何划定问题范围、统一业务理解并逐步演进，而非只模仿最终目录结构。"},{"id":"go-repo","title":"Three Dots Labs · The Repository pattern in Go","url":"https://threedots.tech/post/repository-pattern-in-go/","type":"Go 作者教程","note":"讨论 Go 仓储接口、不同存储实现与事务更新回调。","coverage":"第 6、19 章。","next":"关注回调的重试语义：回调中包含外部副作用时，提交失败后不能无条件重做。"},{"id":"uow","title":"Cosmic Python · Unit of Work","url":"https://www.cosmicpython.com/book/chapter_06_uow","type":"Python 深读","note":"用工作单元管理用例的原子提交与回滚，使应用服务不必直接操纵具体数据库会话。","coverage":"第 4、19、20 章。","next":"关注默认回滚、显式提交与真实数据库测试。"},{"id":"aggregate","title":"Cosmic Python · Aggregates and Consistency Boundaries","url":"https://www.cosmicpython.com/book/chapter_07_aggregate","type":"Python 深读","note":"从库存分配出发，把业务不变量、聚合大小与并发策略联系起来。","coverage":"第 6、19 章。","next":"比较资源权威、热点冲突和聚合过大的代价。"},{"id":"vernon","title":"Vaughn Vernon · Effective Aggregate Design","url":"https://www.dddcommunity.org/library/vernon_2011/","type":"一手聚合专题","note":"聚合设计专题：从一致性约束出发，再考虑规模、关联与事务。","coverage":"第 6 章；面试参考第 3、7 题。","next":"读 Part I 的大聚合失败场景，再理解单事务单聚合为何是一项设计经验法则。","extra":"https://www.dddcommunity.org/wp-content/uploads/files/pdf_articles/Vernon_2011_1.pdf"},{"id":"outbox","title":"Chris Richardson · Transactional Outbox","url":"https://microservices.io/patterns/data/transactional-outbox.html","type":"一手模式文档","note":"说明业务状态和发送意图如何在本地事务内持久化，以及为什么仍可能重复投递。","coverage":"第 19、20 章。","next":"沿发送成功、标记前崩溃的时间线理解 relay 与消费幂等。"},{"id":"cqrs","title":"Martin Fowler · CQRS","url":"https://martinfowler.com/bliki/CQRS.html","type":"一手架构辨析","note":"解释读写模型分离的收益与额外复杂度，以及按上下文局部采用的条件。","coverage":"第 19 章。","next":"先区分写规则与读取需求，再判断是否需要异步投影和独立存储。"},{"id":"specpaper","title":"Evans / Fowler · Specifications 原文","url":"https://martinfowler.com/apsupp/spec.pdf","type":"作者站论文","note":"规格模式专题：校验、筛选、按规格构造，及参数化、组合、蕴含和剩余规格。","coverage":"第 9、10、18 章。","next":"用路线约束理解集合包含；用实际已经完成的行程理解剩余条件。"},{"id":"cnbook","title":"DDD Community · 原书中文版书目","url":"https://www.dddcommunity.org/uncategorized/evans_2003_cn/","type":"中文阅读入口","note":"《领域驱动设计：软件核心复杂性应对之道》的中文书目入口。","coverage":"原书主线。","next":"可配合正式中文译本阅读；章节中的英文短引文附教学译文。"}],"interviews":[{"id":1,"title":"DDD 和 MVC／三层架构有什么区别？为什么采用？","body":"\u003cp>\u003cstrong>参考回答\u003c/strong>：MVC 主要组织交互与展示职责，三层架构组织技术职责；DDD 关注团队如何理解业务、建立语言与模型，并让代码持续表达它们，二者可以组合。以退款为例，客服、用户与系统任务都能退款，若“不能超过可退金额”的规则分别落在三个 Service，很容易出现语义漂移。我会先与业务明确“实付、已退、冻结退款额”，再让退款相关聚合维护不变量，应用服务负责鉴权、事务和调用顺序。不会因为用了四个目录就说采用了 DDD，也不会把所有查询都包装成复杂领域对象。\u003c/p>\u003cp>\u003cstrong>取舍\u003c/strong>：简单报表或配置 CRUD 继续用轻量实现，复杂规则集中处投入建模。多一层抽象必须减少规则重复或缩小变更影响。\u003c/p>\u003cp>\u003cstrong>验证证据\u003c/strong>：同一规则从所有入口触发结果一致；无数据库领域测试能覆盖主要分支；真实需求变更涉及文件和跨团队沟通范围可追踪。没有测量就不报虚构百分比。\u003c/p>\u003cp>\u003cstrong>追问\u003c/strong>：业务简单时仍要统一语言吗？——可以保留语言和边界意识，而不强制全套战术模式。\u003c/p>","kind":"真实面经主题＋原创追问","links":[["真实面经 · 上海爱数等","https://www.nowcoder.com/discuss/556438629988450304"],["真实社招面经 · WPS","https://www.nowcoder.com/discuss/631514581503926272?sourceSSR=enterprise"]]},{"id":2,"title":"限界上下文、子域、微服务分别是什么？怎么判断拆分合理？","body":"\u003cp>\u003cstrong>参考回答\u003c/strong>：子域是业务问题的分区；限界上下文是在一定范围内让语言和模型保持一致的边界；微服务是运行与部署选择。销售侧的订单强调价格和成交承诺，履约侧强调库存分配、包裹和时效，把两边共用一个巨型 Order 会让双方变化相互牵制。我会标出团队所有权、业务用词、变更节奏、集成契约和一致性要求，再决定是否形成两个上下文。两个上下文可以先在同一进程内通过接口协作，不能从一张实体关系图直接推出两个服务。\u003c/p>\u003cp>\u003cstrong>取舍\u003c/strong>：拆服务获得独立发布、扩缩容和故障隔离，但要支付网络失败、契约演进与运维成本。如果每次需求仍需联动发布，边界可能不稳定，或共享数据写入造成耦合。\u003c/p>\u003cp>\u003cstrong>失败与验证\u003c/strong>：消费者未知字段、重复事件、接口超时不能污染本地模型；做契约兼容测试、单方部署演练，检查共享写库和同步调用环路。服务数量没有目标值。\u003c/p>","kind":"真实面经主题＋原创追问","links":[["真实社招面经 · WPS","https://www.nowcoder.com/discuss/631514581503926272?sourceSSR=enterprise"]]},{"id":3,"title":"聚合怎么划？订单、订单项和库存放一起吗？","body":"\u003cp>\u003cstrong>参考回答\u003c/strong>：先列业务不变量，不从外键和“有一个 List”开始。订单提交时“行项目金额加运费减优惠等于应付金额”需要在同一版本下成立，可由订单聚合保护。库存属于不同竞争资源，若把一个商品的库存挂进每个订单，既失去唯一责任边界，也无法约束多订单争抢。通常由库存预留能力管理可售数量，订单根据预留结果推进到已确认；业务是否接受等待、缺货撤销或拆单，要先与领域专家确认。\u003c/p>\u003cp>\u003cstrong>取舍\u003c/strong>：大聚合容易加载无界历史、放大锁与版本冲突；过小聚合可能把真实强约束拆散。按 ID 引用其他聚合是常用手段，聚合边界不等于必须一次加载所有历史流水。\u003c/p>\u003cp>\u003cstrong>失败与验证\u003c/strong>：模拟两请求读同版本，保证一个失败或重新判定；检查库存不足、取消释放、重复回调。若某规则绝不能短暂违反，应调整边界或提供相应原子协议，而不是以“最终一致”四字跳过业务风险。\u003c/p>","kind":"课程自编高级追问","links":[]},{"id":4,"title":"应用服务、领域服务、实体方法和仓储如何分工？生命周期谁管？","body":"\u003cp>\u003cstrong>参考回答\u003c/strong>：创建时由构造函数或工厂形成有效对象；持续身份和状态变化由实体表达；天然属于对象的规则放在对象方法中；不自然属于单个实体但有明确业务含义的规则可用领域服务。应用服务加载对象、安排事务、调用规则并保存；仓储负责恢复和保存领域状态，不应把每张表都自动变成一个仓储。以撤销预订为例，预订判断是否已开始、是否允许取消，取消费用策略可以独立建模，应用服务把结果持久化并登记待发事件。\u003c/p>\u003cp>\u003cstrong>取舍\u003c/strong>：Go 不必模仿 Java 建大量继承结构；Python 的约定式封装也不能代替规则入口。查询可使用专用读模型，没必要为了分页重建全部聚合。\u003c/p>\u003cp>\u003cstrong>失败与验证\u003c/strong>：重建对象不得重新触发“首次创建”事件；无效持久化数据要显式失败或走迁移。内存仓储返回共享可变指针会绕过保存契约，测试替身需要复制或隔离状态。用仓储契约测试与真实数据库 round-trip 验证。\u003c/p>","kind":"真实面经主题＋原创追问","links":[["真实面经 · 对象生命周期","https://www.nowcoder.com/discuss/556438629988450304"]]},{"id":5,"title":"有了聚合根为什么还会超卖？乐观锁就够了吗？","body":"\u003cp>\u003cstrong>参考回答\u003c/strong>：对象方法只保证它看见的状态合理，两个进程都读取剩余一个名额时，可能各自判断成功。持久化必须协同维护约束，例如用版本号条件更新并检查影响行数，或在数据库用原子扣减条件。冲突后不能直接重复保存旧对象，必须重新读状态、重新执行规则；需要限制重试次数，避免热点请求互相放大。\u003c/p>\u003cp>\u003cstrong>取舍\u003c/strong>：乐观锁适合冲突可控场景；高冲突资源可以评估行锁、队列串行化、预留额度或业务分片。业务幂等与并发锁解决不同问题：前者识别同一意图的重试，后者协调不同意图争用状态。\u003c/p>\u003cp>\u003cstrong>失败与验证\u003c/strong>：并发发起 N 个独立请求，成功数不能超容量；同一 request_id 重试不能再次扣减；进程超时后重试要能读取首次结果。检查冲突率、等待时长和业务拒绝率，而不只看 HTTP 成功率。\u003c/p>","kind":"课程自编高级追问","links":[]},{"id":6,"title":"领域事件什么时候发？数据库成功、MQ 失败怎么办？","body":"\u003cp>\u003cstrong>参考回答\u003c/strong>：先区分进程内领域通知与对外集成消息。领域事件表达已经发生且有业务意义的事实；对外 payload 应是稳定契约，避免直接序列化整个聚合。写库前发送可能出现事务回滚但消息已生效；提交后直接发送则存在进程崩溃导致漏发的窗口。可把业务状态与 Outbox 记录写入同一本地事务，再由 relay 重试发送。它把“必须发”的意图持久化，不等于网络发送与数据库瞬时原子完成。\u003c/p>\u003cp>\u003cstrong>取舍与失败\u003c/strong>：relay 发出后、标记前崩溃会重复投递。消费者以 \u003ccode>(consumer, event_id)\u003c/code> 唯一键去重，并把去重记录与本地业务副作用置于同一事务；提交后确认消息。外部 RPC 副作用另需对方幂等键或状态核对。聚合内顺序可配版本号，跨聚合不默认全局有序。\u003c/p>\u003cp>\u003cstrong>验证证据\u003c/strong>：注入提交后宕机、发送后宕机、重复与乱序事件；核查业务效果只出现一次，积压可回收、死信可定位。观察最老未发事件年龄、重试次数、消费延迟。\u003c/p>","kind":"真实面经主题＋原创追问","links":[["真实社招面经 · 同花顺","https://leetcode.cn/discuss/post/3vLNFY/"]]},{"id":7,"title":"钱包转账跨两个聚合怎么办？“一个事务只能一个聚合”是铁律吗？","body":"\u003cp>\u003cstrong>参考回答\u003c/strong>：先界定系统边界。同库、同服务且业务要求同步原子完成时，可以明确采用一个本地事务协调两个账户的变化，并承认这是需要评审的跨聚合事务，而不是把所有账户合成巨型聚合。若经常跨相同边界强一致更新，应重新检查模型。交易顺序按稳定账户 ID 加锁可降低死锁，失败仍需完整回滚；还要验证正金额、同币种、账户状态、额度和转账幂等键。\u003c/p>\u003cp>\u003cstrong>跨系统取舍\u003c/strong>：两个外部钱包通常无法靠本地事务获得原子性。需要可追踪的转账流程与中间状态，例如发起、已扣款、待入账、完成、补偿中；具体是否接受预留、补偿取决于业务。网络超时只代表结果未知，不能直接当失败退款，否则对方已入账时会造钱。\u003c/p>\u003cp>\u003cstrong>验证证据\u003c/strong>：同一业务键的重复请求必须收敛到同一结果；余额与账务流水核对；模拟扣款后断网、入账响应丢失、补偿重试。钱包教学例子不构成生产账务系统的完整设计。\u003c/p>","kind":"课程自编高级追问","links":[["博客衍生评审题（非真实面经）","https://www.cnblogs.com/slowbyte/p/23623223"]]},{"id":8,"title":"老系统如何落地 DDD？什么情况下会收缩使用？","body":"\u003cp>\u003cstrong>参考回答\u003c/strong>：先选一个规则复杂、变化频繁且能隔离的业务切片，例如退款资格判定。记录旧行为与业务术语，补特征测试；在边界处把旧数据翻译成新模型，建立单一写入责任，再逐步切流。不要一次重写全部系统，也不要让新旧模型长期同时写相同事实。双写需要可靠同步、可核对水位和回滚方案，不能只写两个调用。\u003c/p>\u003cp>\u003cstrong>取舍\u003c/strong>：迁移成本来自模型理解、兼容协议和团队习惯。如果业务始终简单、团队规模很小，或抽象只有转发代码而没有保护规则，可以删掉无价值的层和工厂，保留语言、不变量及责任边界。应说清放弃的是哪些实现负担，而非宣布 DDD 对任何系统都无效。\u003c/p>\u003cp>\u003cstrong>验证证据\u003c/strong>：灰度比较业务结果，跟踪差异并由领域专家解释；演练切回旧路由；记录变更周期、跨模块改动范围、规则回归缺陷和性能。报告测量方法与样本，不能为了面试捏造收益。\u003c/p>","kind":"课程自编高级追问","links":[]}],"diagrams":{"cycle":"\u003csvg viewBox=\"0 0 840 240\" role=\"img\" aria-label=\"从真实案例到模型，再回到业务验证\">\u003ctitle>从真实案例到模型，再回到业务验证\u003c/title>\u003cdefs>\u003cmarker id=\"arr-3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\u003cpath d=\"M0,0 L6,3 L0,6\" fill=\"#245eea\"/>\u003c/marker>\u003c/defs>\u003crect x=\"30.0\" y=\"35\" width=\"245.33333333333334\" height=\"115\" rx=\"12\" fill=\"#f1f6ff\" stroke=\"#b5cceb\"/>\u003ctext x=\"152.66666666666669\" y=\"81\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#112a43\">真实案例\u003c/text>\u003ctext x=\"152.66666666666669\" y=\"115\" text-anchor=\"middle\" font-size=\"13\" fill=\"#526b80\">领域专家提出事实\u003c/text>\u003cpath d=\"M275.33333333333337,93 H293.33333333333337\" stroke=\"#245eea\" stroke-width=\"2\" marker-end=\"url(#arr-3)\"/>\u003crect x=\"297.33333333333337\" y=\"35\" width=\"245.33333333333334\" height=\"115\" rx=\"12\" fill=\"#f1f6ff\" stroke=\"#b5cceb\"/>\u003ctext x=\"420.00000000000006\" y=\"81\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#112a43\">模型假设\u003c/text>\u003ctext x=\"420.00000000000006\" y=\"115\" text-anchor=\"middle\" font-size=\"13\" fill=\"#526b80\">概念 + 规则\u003c/text>\u003cpath d=\"M542.6666666666667,93 H560.6666666666667\" stroke=\"#245eea\" stroke-width=\"2\" marker-end=\"url(#arr-3)\"/>\u003crect x=\"564.6666666666667\" y=\"35\" width=\"245.33333333333334\" height=\"115\" rx=\"12\" fill=\"#f1f6ff\" stroke=\"#b5cceb\"/>\u003ctext x=\"687.3333333333334\" y=\"81\" text-anchor=\"midd
